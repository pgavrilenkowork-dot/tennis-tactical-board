<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doubles court: net player shadow</title>
<style>
:root{--bg:#eef1f4;--bar:#ffffff;--ink:#1b2430;--muted:#5b6776;--line:#d3d9e0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--bar:#18202a;--ink:#e8edf3;--muted:#98a4b3;--line:#2b3644}}
:root[data-theme="dark"]{--bg:#0f141b;--bar:#18202a;--ink:#e8edf3;--muted:#98a4b3;--line:#2b3644}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:2;display:flex;flex-direction:column;padding:10px 14px;background:var(--bar);border-bottom:1px solid var(--line)}
#barToggle{display:none}
#settings{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
#status{flex:1 1 100%}
label{display:flex;align-items:center;gap:8px;color:var(--muted)}
output{min-width:3em;color:var(--ink)}
input[type=range]{width:120px}
button:focus-visible,input:focus-visible{outline:2px solid #2e6fd0;outline-offset:2px}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;touch-action:none;cursor:grab;display:block}
canvas.drag{cursor:grabbing}
/* Narrow screens: the header shrinks to a single tap-to-expand bar; tapping it reveals every setting.
   Wide screens keep the full header, since #barToggle stays hidden and #settings is always shown. */
@media (max-width:700px){
  header{padding:8px 12px}
  #barToggle{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;
    font:inherit;font-weight:600;color:var(--ink);background:transparent;border:0;border-radius:6px;
    padding:4px 0;cursor:pointer;text-align:left}
  #barToggle .chev{display:inline-block;font-size:11px;line-height:1;color:var(--muted);transition:transform .18s ease}
  header[data-open="true"] #barToggle .chev{transform:rotate(180deg)}
  #settings{display:none}
  header[data-open="true"] #settings{display:flex;margin-top:10px;
    max-height:calc(100vh - 104px);max-height:calc(100dvh - 104px);overflow:auto;overscroll-behavior:contain}
  label{flex:1 1 100%;justify-content:space-between}
  input[type=range]{flex:1 1 auto;width:auto;min-width:80px}
}
</style>
</head>
<body>
<header>
  <button id="barToggle" type="button" aria-expanded="false" aria-controls="settings">Settings<span class="chev" aria-hidden="true">▾</span></button>
  <div id="settings">
    <div id="status"></div>
    <label>Dynamic Volley Reach <input id="rn" type="range"><output id="rnv"></output></label>
    <label>Reach per side (groundstroke) <input id="rb" type="range"><output id="rbv"></output></label>
    <label>Fast balls reach margin per side <input id="rm" type="range"><output id="rmv"></output></label>
    <label>Show ball <input id="ballOn" type="checkbox"></label>
    <label>Display delta marker <input id="deltaOn" type="checkbox"></label>
    <label>Ball size <input id="ballSize" type="range" min="3" max="40" step="1"><output id="ballSizev"></output></label>
    <label>Arrow width <input id="arrowW" type="range" min="2" max="12" step="1"><output id="arrowWv"></output></label>
  </div>
</header>
<main><canvas id="c"></canvas></main>
<script>
// Real court dimensions in metres (doubles)
const CW = 10.97, CL = 23.77, SINGLES = 8.23, SERVICE = 6.40, POST = CW/2 + 0.914;
const MX = 2.5, MY = 3;
let VB = {x0:-10,y0:-15,x1:10,y1:15};     // visible world rectangle; origin = centre of net, y down
const COL = { A: '#ffb020', B: '#ff5fa2' };
const UNREACH_COL = '#ff3b30';   // red: the flight cannot be met at all (VBCRL-U) — the whole pair wears it
const SRCL_GREY = '#8a95a3';      // ball mode's AHS SRCL: grey, opaque, team colour nowhere. It is the reach
                                 // he keeps rather than one he plays from, so it does not wear his colours; and
                                 // it is a whole line, not a faded one, because nothing else is said about the
                                 // SRCP — no mark sits on it any more (see the SRCP pass below).
const LINE_W = 3.5;              // px, the stroke width of every reach line: the SRCL and the BCRL/VBCRL. One
                                 // number, so a line that is drawn over another is exactly as thick as it, and
                                 // the two can never drift apart.
// NAPRZ — the non-attacking player's reaching zone: the court under his MRA circle is shaded, not outlined.
// NAPRZ_ALPHA is the one knob for both shades (0 = invisible zone, 1 = opaque paint); the red is the pair's
// red and appears only when no contact exists at all (VBCRL-U, see noContact).
const NAPRZ_ALPHA = 0.1;
const NAPRZ_SHADE = 'rgba(0,0,0,' + NAPRZ_ALPHA + ')';
const NAPRZ_SHADE_RED = 'rgba(255,59,48,' + NAPRZ_ALPHA + ')';
const NAME = { A: 'Top team', B: 'Bottom team' };
const HEAD_PX = 11;
const DOT_GAP = 12;   // GUIDE LINE: clear space (px) kept at each end of the dashed line
const ARROW_GAP = 10;      // ARROW: clear space (px) between the GUIDE LINE and the arrow tail
const ARROW_LEN = 20;      // ARROW: overall length, tail -> tip (px)
const ARROW_HEAD_L = 9;    // ARROW: head length along the shaft (px)
const ARROW_HEAD_HW = 2.6; // ARROW: head half-width (px); 9 long x 2.6 half ≈ 32° apex, CAD-sharp
// DELTA MARKER: the whole drag guide — GUIDE LINE, ARROW and the Δ readout (see drawDragGuide) — is a
// measuring aid, not part of the plan, so it is opt-in: off until the header's "Display delta marker"
// checkbox turns it on, and nothing else in the scene depends on it.
let deltaOn = false;
const SHADOW_COL = "#000";
// The dashed reach guides' stroke, in CSS px: 2 px wide, 5 px dashes with 5 px gaps — the example's
// setLineDash([5, 5]) — so the reach curve and the arrow's continuation read as one family of short dashes.
// Court-space drawing divides these by s to land on pixels; pixel-space drawing uses them as is.
const DASH_W = 2, DASH_ON = 5, DASH_OFF = 5;
// Short names for a player's clickable objects, shared by pick() and end()
const DOT = 'dot';   // lettered placeholder (head dot): drags only, never emits
const FH  = 'fh';    // forehand end dot: emits from the forehand side
const BH  = 'bh';    // backhand end dot: emits from the backhand side
const SEG = 'seg';   // reach line between the two end dots: drags only
const BALL = 'ball'; // the tennis ball: drags only, never emits
const VEC = 'vec';   // the ball's arrow: drags (stretches -> speed) only, never emits
const EXT = 'ext';   // the arrow's dashed continuation: drags (swings -> rotation) only, never emits
// world-x of a player's forehand: facing the net, top team (A) = screen-left, bottom team (B) = screen-right
const fhSide = p => p.team === 'A' ? -1 : 1;
// Live reach settings, metres per side (the header sliders edit these). They are the defaults as well:
// the slider specs below take their min/max/step, position and readout from them, so a number is never
// written twice (the HTML carries nothing but the ids).
//   rNet    — "Dynamic Volley Reach": a net defender's reach when his attacker is half a court away
//   rBase   — "Reach per side (groundstroke)": the wide zone when the attacker is a full court length away
//   rMargin — "Fast balls reach margin per side": the negative fraction (e.g. -0.15) taken off each side
//             of that wide reach for the darker fast ball shadow, so it is never a setting of its own
let rNet = 1.5, rBase = 4, rMargin = -0.30, attack = 'A';

// The three reach sliders, defined once: range, the scale that turns the slider's number into the live
// setting (metres, or whole percent for the margin) and how the readout prints it. syncReachUI() pushes
// all of it into the header, so editing the numbers above is enough and the HTML stays bare.
const REACH_SLIDERS = [
  {id:'rn', out:'rnv', min:0.5, max:3,  step:0.1, scale:1,    fmt:v => v.toFixed(1) + ' m', get:() => rNet,    set:v => rNet = v},
  {id:'rb', out:'rbv', min:1,   max:8,  step:0.1, scale:1,    fmt:v => v.toFixed(1) + ' m', get:() => rBase,   set:v => rBase = v},
  {id:'rm', out:'rmv', min:-60, max:-5, step:1,   scale:0.01, fmt:v => v + '%',             get:() => rMargin, set:v => rMargin = v},
];
let players = [];
function resetPlayers(){
  // Default: top team attacks; one player emits, forehand side only (right-handed: facing the net,
  // the top team's forehand is the screen-left end, the bottom team's is the screen-right end).
  // Each player keeps a fixed letter (top team A, B / bottom team C, D) drawn in his dot.
  players = [
    {letter:'A', team:'A', x:-2.9, y:-2.3, l:false, r:false}, {letter:'B', team:'A', x: 5.6, y:-12.9, l:true,  r:false},
    {letter:'C', team:'B', x:-3.2, y: 12.5, l:false, r:false}, {letter:'D', team:'B', x: 4.1, y: 2.2, l:false, r:true}
  ];
  attack = 'A';
}
resetPlayers();

// ---- URL hash: the players' positions and who emits from which end travel in the fragment, so a
// link restores the whole court.
//   index.html#p-A2.23:-3.50;B2.00:2.00:R;C2.00:-1.00;D5.01:10.00
//   "p-" marks a court fragment, then one <letter><x>:<y>[:<side>] per player, metres, 2 decimals.
//   The optional side is L or R — his OWN left or right, facing the net — and names the end he
//   emits from; a player without one emits nothing.
//   The ball, while it is shown, adds one "b-" entry — its centre, the ball's speed in km/h and the
//   arrow's rotation in degrees — so the arrow travels with the link:
//     index.html#p-A2.23:-3.50;B2.00:2.00:R;b-0.00:6.50:90.0:303.7
//   ':' and ';' both work between those four numbers ("b-0.00;6.50;90.0;303.7"). Speed and rotation
//   are scale-free, so a link no longer depends on how long the arrow happens to be drawn: the arrow
//   is always 2 m of court per 50 km/h, at any zoom. The older tip form
//   "b:0.00:6.50:2.00:3.50" is still read — its tip becomes a speed and a rotation on the way in —
//   and a tip-less "b:0.00:6.50" places the ball and leaves the arrow pointing the way it already
//   does. A fragment with no ball entry hides the ball. The arrow's colour follows from the rotation
//   — which side of the net it points at, see arrowColor() — so a link restores that too. The ball's
//   size and arrow width are on-screen settings, not part of the link.
const HASH_TAG = 'p-';
// the ball's entry, wherever it sits in the fragment: "b-" then centre x, y, speed (km/h) and
// rotation (degrees). ':' and ';' both work between those four numbers, hence the mixed class.
const BALL_RE = /(?:^|;)\s*b\s*-\s*(-?\d+(?:\.\d+)?)\s*[:;]\s*(-?\d+(?:\.\d+)?)\s*[:;]\s*(-?\d+(?:\.\d+)?)\s*[:;]\s*(-?\d+(?:\.\d+)?)\s*(?=;|$)/i;
// the older tip form "b:x:y:tipx:tipy" (either separator, tip optional) is still read, so links made
// before the arrow became speed + rotation keep working; arrowFromTip() converts the tip.
const BALL_TIP_RE = /(?:^|;)\s*b\s*:\s*(-?\d+(?:\.\d+)?)\s*[:;]\s*(-?\d+(?:\.\d+)?)\s*(?:[:;]\s*(-?\d+(?:\.\d+)?)\s*[:;]\s*(-?\d+(?:\.\d+)?)\s*)?(?=;|$)/i;
// numbers in the fragment: d decimals, and never "-0.00"
const fmtNum = (v, d) => (Math.abs(v) < 0.5*Math.pow(10, -d) ? 0 : v).toFixed(d);
const fmtCoord = v => fmtNum(v, 2);                                 // metres, 2 decimals
const fmtVel = v => fmtNum(v, 1);                                   // km/h, 1 decimal
const fmtRot = r => fmtNum(Math.round(normRot(r)*10)/10 % 360, 1);  // degrees, 0 .. 359.9
const byLetter = L => players.find(p => p.letter === L);
// A faces the net with his right hand to screen-left, B with his right hand to screen-right, so
// fhSide() is exactly his right-hand side; his left is the mirror of it. Nothing lit = no suffix.
const sideOf = p => p.l === p.r ? '' : ((p.l ? -1 : 1) === fhSide(p) ? 'R' : 'L');
const entry = q => q.ball
  ? 'b-' + fmtCoord(q.x) + ':' + fmtCoord(q.y) + ':' + fmtVel(q.vel) + ':' + fmtRot(q.rot)
  : q.letter + fmtCoord(q.x) + ':' + fmtCoord(q.y) + (q.side ? ':' + q.side : '');
// the ball always comes last, so a fragment that puts it first still compares equal after applying
const canonical = list => HASH_TAG + list.slice()
  .sort((a, b) => (a.ball ? 1 : 0) - (b.ball ? 1 : 0)).map(entry).join(';');
const hashOf = () => canonical(players.map(p => ({letter: p.letter, x: p.x, y: p.y, side: sideOf(p)}))
  .concat(ball.on ? [{ball: true, x: ball.x, y: ball.y, vel: ball.vel, rot: ball.rot}] : []));
function readHash(){
  let raw;
  try { raw = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e){ return []; }
  if (raw.slice(0, HASH_TAG.length).toLowerCase() !== HASH_TAG) return [];   // not ours: leave the court alone
  raw = raw.slice(HASH_TAG.length);
  const out = [];
  const bm = BALL_RE.exec(raw);                    // the ball entry is picked out first, so its "b"
  if (bm){                                         // can never be read as player B
    out.push({ball: true, x: +bm[1], y: +bm[2], vel: +bm[3], rot: +bm[4]});
    raw = raw.replace(BALL_RE, ';');               // ...and taken out of the player list
  } else {
    const bt = BALL_TIP_RE.exec(raw);              // an older link still carries the arrow's tip
    if (bt){
      const x = +bt[1], y = +bt[2];
      const r = bt[3] != null ? arrowFromTip(x, y, +bt[3], +bt[4]) : null;   // tip -> speed/rotation
      out.push({ball: true, x, y, vel: r ? r.vel : ball.vel, rot: r ? r.rot : ball.rot});
      raw = raw.replace(BALL_TIP_RE, ';');
    }
  }
  for (const part of raw.split(';')){
    const m = /^\s*([A-Za-z])\s*(-?\d+(?:\.\d+)?)\s*:\s*(-?\d+(?:\.\d+)?)\s*(?::\s*([LRlr])\s*)?$/.exec(part);
    if (m) out.push({letter: m[1].toUpperCase(), x: +m[2], y: +m[3], side: m[4] ? m[4].toUpperCase() : ''});
  }                                                                        // junk entries are skipped
  return out;
}
// the positions move; the lit ends come from the fragment alone (no suffix = that player emits
// nothing), while letters, teams and who is attacking stay as they are. The ball is the fragment's
// too: a "b:" entry shows it with that arrow, and its absence hides it.
function applyHash(){
  const all = readHash();
  const hits = all.filter(q => !q.ball && byLetter(q.letter));
  const b = all.find(q => q.ball);
  if (!hits.length && !b) return false;
  clearBeams();
  for (const q of hits){
    const p = byLetter(q.letter);
    p.x = q.x; p.y = q.y;
    if (q.side){
      const ws = q.side === 'R' ? fhSide(p) : -fhSide(p);   // his right / his left as a world-x sign
      p.l = ws < 0; p.r = ws > 0;
    }
  }
  if (b){
    ball.on = true;
    ball.x = b.x; ball.y = b.y;
    ball.vel = clampVel(b.vel); ball.rot = normRot(b.rot);   // the arrow is speed + rotation
  } else {
    ball.on = false;
  }
  syncBallUI();
  return true;
}
// replaceState keeps the back button clean; file:// may refuse it, so fall back to the fragment itself
function writeHash(){
  const h = hashOf();
  if (location.hash.replace(/^#/, '') === h) return;
  try { history.replaceState(null, '', '#' + h); }
  catch (e){ location.replace('#' + h); }
}
// one URL write per frame at most, however fast the pointer moves
let hashQueued = false;
function scheduleHash(){
  if (hashQueued) return;
  hashQueued = true;
  requestAnimationFrame(() => { hashQueued = false; writeHash(); });
}
// a fragment that is pasted or edited re-places the players and re-lights the emitting ends; our
// own writes are exactly the canonical form of the live state, so they are recognised and ignored
window.addEventListener('hashchange', () => {
  if (drag) return;          // mid-drag the pointer owns the position and our own writes are stale
  const pos = readHash();
  if (!pos.length || canonical(pos) === hashOf()) return;
  if (applyHash()){ status(); draw(); }
});

// ---- defender reach
// net mode: a defender closer to the net than this (1/4 of the net-to-baseline distance)
const NET_MODE_Y = CL/8;
const inNetMode = q => Math.abs(q.y) < NET_MODE_Y;

// Static wingspan: an average player's shoulder-to-racket-tip reach is about 1 m per side without
// moving his feet, i.e. 2 m across. It is the tight end of the net defender's reach (attacker on top
// of him) and, through that volley reach, the tight end of every groundstroke zone as well.
const STATIC_WINGSPAN = 2.0;             // metres, both sides together
const STATIC_REACH = STATIC_WINGSPAN/2;  // metres, per side

// Every player distance here is head dot to head dot: a plain distance between two points on the
// court (each player's x, y).
const headDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// A net defender's reach per side: exactly "Dynamic Volley Reach" when the attacker is half a court
// length away and exactly the static wingspan when the attacker is on top of him, linear in between
// and extrapolated outside. An attacker inside the court keeps it below the setting; an attacker
// farther back than his own baseline pushes it past the setting.
const volleyReach = d => STATIC_REACH + (rNet - STATIC_REACH) * (d / (CL/2));

// How far along the line from the attacker to the defender the defender has to travel before the wide
// groundstroke zone reaches rBase. Its other end has not moved: t = 0 is still the net-mode edge, where
// the zone is exactly the net defender's volley reach. So t = 0 when the defender stands on that edge
// and t = 1 when the true attacker-to-defender distance is a full court length CL (held at 1 beyond).
// Both the edge crossing and the distance are true distances along the line connecting the two players,
// never the defender's own baseline and never a projection of it.
function reachRamp(src, q, d){
  if (d >= CL) return 1;                     // a full court length away (or more): exactly rBase
  const dy = q.y - src.y;
  let s = 0;                                 // level line: no edge crossing, measure from the attacker
  if (Math.abs(dy) > 1e-9){
    s = ((q.y > 0 ? 1 : -1) * NET_MODE_Y - src.y) * d / dy;   // attacker -> edge on the defender's side
    s = Math.max(0, Math.min(d, s));         // edge behind the attacker or past the defender: clamp
  }
  return Math.max(0, Math.min(1, (d - s) / (CL - s)));
}

// A groundstroker's wide reach per side, metres: the volley reach at the net-mode edge, opening to
// exactly rBase when the attacker is a full court length away, walking along the line between the two
// players (see reachRamp). The attacker's point src is what the distance is measured from.
const groundReach = (src, q) => {
  const d = headDist(src, q);
  const edge = volleyReach(d);
  return edge + (rBase - edge) * reachRamp(src, q, d);
};

// One source lights at a time — a tap clears every other dot first — so there is a single attacker:
// the player whose forehand/backhand dot is on, and he alone sizes a defender. His partner never
// does. Before any dot is tapped nobody is attacking yet, so the nearest attacker stands in for him.
// In ball mode nobody taps at all: the arrow picks the attacking team and the ball's own path picks
// the hitter, his side and the point he hits from (see ballHitter below).
const isEmitting = p => p.l || p.r;
function attacker(){
  if (ball.on){ const h = ballHitter(); return h ? h.p : null; }
  return players.find(p => p.team === attack && isEmitting(p)) || null;
}
function nearestAttacker(q){
  let best = null, bd = Infinity;
  for (const a of players) if (a.team === attackTeam()){
    const d = headDist(a, q);
    if (d < bd){ bd = d; best = a; }
  }
  return best;               // a team always fields two players, so this stays non-null
}
// The point a defender's shadow is measured from: the attacker who is actually hitting, or — before any
// dot is tapped — his nearest teammate. In ball mode that is the hitter the arrow points at (attacker()
// asks ballHitter), so the line, the shadow and the hitting point all use one source.
const defenderSource = q => attacker() || nearestAttacker(q);
// in net mode a defender has a single zone, the volley reach. Outside it his wide groundstroke zone
// runs from that same volley reach on the net-mode edge to rBase when the attacker is a full court
// length away along the line between the two players (see reachRamp), and his fast ball zone is simply
// that width cut by the margin: no interpolation of its own, so the dark shadow stays exactly the same
// percentage narrower than the wide one wherever he stands.
const reachFromSource = (src, q) => inNetMode(q) ? volleyReach(headDist(src, q)) : groundReach(src, q);
const defenderReach = q => reachFromSource(defenderSource(q), q);
// A ball-mode player's arc uses the very same defensive reach rules, with the incoming ball standing
// in for the attacker: the arc tightens as the ball closes in and opens out to the groundstroke reach
// while the ball is still a full court length away. It is the "lighter shadow" width, so no
// fast-ball margin here.
const arcReach = p => Math.max(0, reachFromSource(ball, p));
// The margin is taken off each side of the wide reach, so -0.15 leaves 85% of it on the forehand side
// and 85% on the backhand side — the dark shadow's whole width is 85% of the wide one, and shortening
// the reach by a percentage rather than a fixed number of metres keeps that ratio wherever he stands.
const fastReach = q => { const r = defenderReach(q); return r + r * rMargin; };

// ---- MBCR (Maximum Ball Contact Reach): the reach the ball's own flight time allows, in metres.
//      The player's speed is the same for everyone and follows from the court — while the ball flies
//      the court's diagonal he crosses from the edge of his wingspan to the singles sideline — so Vp
//      is a constant and only the flight time changes anything. Vb0 is the reference ball speed the
//      formula is calibrated on. A slow ball therefore gives him more time, never more speed.
const VB0 = 85;                                                             // km/h, reference ball speed
const VP  = VB0 * ((SINGLES/2 - STATIC_REACH) / Math.hypot(CL, SINGLES/2));  // km/h, ≈ 10.98
// The footwork the flight buys him: Dp = Vp * (dball / Vball), metres, for a BPCP dball metres down the
// arrow. The wingspan is not in it — this is how far he can get, not what he can reach once he is
// there — so it is also the radius of the circle his partner covers before the ball is met.
const travelBy = dball => VP * (dball / Math.max(1e-6, ball.vel));
// The reach for a BPCP dball metres down the arrow — the length of the BCRL that ends there: his
// footwork Dp = Vp*(dball/Vball) plus exactly one static wingspan, i.e. Dp + STATIC_REACH.
const mbcrLen = dball => STATIC_REACH + travelBy(dball);

// The BPCP that levels with p: where the arrow's ray crosses p's own reach line, parallel to the net.
// That is the last BPCP he can still meet the ball on — his front half ends there, exactly where the
// example's sweep stops — and it is the one the lateral BCRL is drawn to. Only ahead of the ball: a level
// arrow, or a path already past him, names no such point (null).
function levelBPCP(p, ray){
  if (Math.abs(ray.uy) < 1e-9) return null;
  const dball = (p.y - ray.y) / ray.uy;
  if (!(dball > 0)) return null;
  return {dball, x: ray.x + ray.ux*dball, y: p.y};
}

// The hitting window (HWS): the stretch of the arrow's path between the two EBCRPs, i.e. the part of
// the BTL inside p's MBCR reach. It is the two BPCPs where the ball's own
// distance from him equals the reach the flight has bought him by then, i.e. where the path crosses the
// MPRC itself. Those are the EBCRPs — the earliest and the latest BPCP he can possibly meet — and both
// of them sit exactly on the BTL. They are the roots of
//     |ball + s*u - p|² = mbcrLen(s)²,
// a quadratic in s because both sides grow linearly with the distance flown. The path is inside his
// reach between the roots and outside it everywhere else, so a near miss gives a short window and a
// path passing him closely gives a long one that runs on behind him. null when the path never comes
// inside his reach at all (no real root — the near miss in the screenshot — or only behind the ball).
function mbcrWindow(p, ray){
  const k = VP / Math.max(1e-6, ball.vel);            // metres of footwork per metre of ball flight
  const ox = ray.x - p.x, oy = ray.y - p.y;           // the ball, from his centre
  const A = 1 - k*k;                                  // k = 1 exactly: reach grows as fast as the ball
  const B = 2*((ox*ray.ux + oy*ray.uy) - STATIC_REACH*k);
  const C = ox*ox + oy*oy - STATIC_REACH*STATIC_REACH;
  if (Math.abs(A) < 1e-9){
    if (Math.abs(B) < 1e-9) return C <= 0 ? {s1: 0, s2: Infinity} : null;
    const r = -C/B;                                   // one root: inside on one side of it only
    if (B > 0) return r > 0 ? {s1: 0, s2: r} : null;
    return {s1: Math.max(0, r), s2: Infinity};
  }
  const disc = B*B - 4*A*C;
  if (disc < 0) return null;                          // the path never comes inside his reach
  const rt = Math.sqrt(disc), r1 = (-B - rt)/(2*A), r2 = (-B + rt)/(2*A);
  // k < 1: the ball is the faster of the two, so the reach catches up and is then left behind again —
  // inside between the roots. k > 1 (a very slow ball) is the other way round: once he is level with it
  // he stays with it, so everything past the far root is inside.
  const lo = A > 0 ? Math.min(r1, r2) : Math.max(r1, r2);
  const hi = A > 0 ? Math.max(r1, r2) : Infinity;
  if (hi <= 0) return null;                           // the whole window is behind the ball
  return {s1: Math.max(0, lo), s2: hi};
}

// Where he meets the ball is read off the reach line that is actually drawn, never solved on its own
// (bcRl, below): the level BPCP the VBCRL meets head on, the EBCRP an EBCRL ends on, or — when the
// flight misses him — the tip of the VBCRL-U. One model, so the contact dot, the beams that start there
// and the line can never name different places. A contact of its own did exactly that: clamped into the
// hitting window it landed on the FAR EBCRP in the screenshot while the drawn line ended on the near
// one, and its opaque dot then painted over the faded one that EBCRP is supposed to keep.


// The MPRC (maximum player reaching curve): the tip of the BCRLE for every direction he can sweep — the
// envelope of every possible reach line — sampled the way the example does it: sweep the ANGLE about p,
// uniformly, and for each ray solve where it crosses the ball's path. That crossing gives the BPCP's
// distance along the BTL, never its distance from p, so the sample is p + (cos θ, sin θ) * L(s). Sweeping
// the angle instead of the distance is what keeps the curve smooth: where the path runs close to p a
// short stretch of it swings through a wide arc of directions, and a distance- or time-uniform sweep
// jumps across that arc in a single step (a chord cut clean across the envelope). Angle steps are
// bounded, so they follow the swing instead. A ray parallel to the arrow names no crossing and is
// skipped.
//
// The sweep covers the hitting window (mbcrWindow): the BTL from the ball to the far EBCRP, so it runs
// continuously from right beside him out to where the ball leaves his reach for good. The curve is drawn
// from the player himself: its first point is his centre, then his wingspan circle in the direction of the
// ball — the ball's own BPCP, s = 0, where his reach is exactly STATIC_REACH — and the envelope only after
// that, as the example's sweep also starts at the direction to the ball. Its last sample is the far EBCRP, on
// the BTL, unless the ball is
// level with him before that: the curve always ends on the BCRL tip it is drawn to — the far edge's or
// the level BPCP's, whichever comes later — and never short of the level line. The near EBCRP is NOT an
// end: the ball is normally still outside his reach at s = 0 and only comes inside it at win.s1, but
// stopping the sweep there would cut the curve off out in the court and leave it floating away from the
// player. A path that never enters his reach has no far EBCRP at all: the sweep then runs out to the
// level BPCP, or to the screen edge when no such BPCP exists, so that end may sit off the BTL, since
// nothing of that flight can be met. The level BPCP is the end even when it lies beyond the screen edge,
// because the BCRL tip it names sits on his reach line, much nearer than the BPCP (the reach grows
// slower than the flight), and can be on screen while the BPCP that names it is not.
function mprc(p){
  const ray = ballRay(), c = toPx(ball);
  const exit = Math.max(0, edgeReach(c.x, c.y, ray.ux, ray.uy)/s);   // metres, ball -> screen edge
  const lv = levelBPCP(p, ray);
  const win = mbcrWindow(p, ray);                                    // the hitting window, or null
  const sA = 0;                                                      // start at the ball's own BPCP
  // Out to the far edge, but never short of the BPCP that levels with him. Two ways the sweep could stop
  // first, and both would leave the curve hanging below the reach line while the plan point sits on it:
  // a ball that enters his reach early can leave it again before it is level, and even a ball he never
  // reaches can run off the screen before it levels (the BPCP is on the flight, the BCRL tip is on his
  // reach line, and the reach grows slower than the flight, so the dot can be on screen while the BPCP
  // that names it is not). Sweeping on to the level BPCP makes the last sample land exactly on that dot
  // (same direction, same mbcrLen); when the ball stays in reach past the level line, the far edge is the
  // later end and the sweep still runs out to it, with the screen edge as the bound when there is no
  // level BPCP at all.
  const reachEnd = win ? win.s2 : (lv ? lv.dball : exit);       // where the ball leaves his reach
  const screenEnd = Math.min(reachEnd, exit);                   // ... clipped to the screen
  const sB = lv ? Math.max(screenEnd, lv.dball) : screenEnd;    // ... but never short of the level line
  // The two EBCRPs are named by the crossings of the BTL with this curve (mbcrWindow); the curve runs
  // from the ball out past both of them, so both dots sit on the samples drawn here.
  const a0 = Math.atan2(ray.y + ray.uy*sA - p.y, ray.x + ray.ux*sA - p.x);   // direction to the first
  const a1 = Math.atan2(ray.y + ray.uy*sB - p.y, ray.x + ray.ux*sB - p.x);   // ... and to the last
  let da = a1 - a0;                                                  // the short way round
  while (da >  Math.PI) da -= 2*Math.PI;
  while (da < -Math.PI) da += 2*Math.PI;

  // A path straight away from or straight at him spans no angle at all: every BPCP lies on one ray, so
  // the envelope is that ray's own stretch, r = mbcrLen(s) for s from the first BPCP to the last.
  // There is no direction to spread samples over, so sample that one ray by distance instead.
  if (Math.abs(da) < 1e-4){
    const pts = [], N = 48;
    for (let i = 0; i <= N; i++){
      const s2 = sA + (sB - sA)*i/N, bx = ray.x + ray.ux*s2, by = ray.y + ray.uy*s2;
      const dx = bx - p.x, dy = by - p.y, d = Math.hypot(dx, dy);
      if (d < 1e-6) continue;
      const L = mbcrLen(s2);
      pts.push({x: p.x + dx/d*L, y: p.y + dy/d*L});
    }
    // ... and from him: the centre first, then the one ray's stretch (see the notes above).
    pts.unshift({x: p.x, y: p.y});
    return {pts, lv, win, exit, ray, sB};
  }

  const steps = Math.max(10, Math.round(Math.abs(da)*200));          // uniform in angle: ~200 per radian
  const pts = [];
  // The tip for one direction: where the ray from him meets the flight, and the reach the flight buys there.
  const at = th => {
    const cx = Math.cos(th), cy = Math.sin(th);
    const den = cx*ray.uy - cy*ray.ux;                        // the ray against the arrow's direction
    if (Math.abs(den) < 1e-9) return null;                    // parallel to the path: no crossing
    const u = ((ray.x - p.x)*ray.uy - (ray.y - p.y)*ray.ux) / den;   // p -> BPCP, metres
    if (!(u >= 0)) return null;                               // the crossing lies behind him
    const s2 = (p.x + cx*u - ray.x)*ray.ux + (p.y + cy*u - ray.y)*ray.uy;  // ball -> BPCP, metres
    if (s2 < sA - 1e-6 || s2 > sB + 1e-6) return null;        // outside the stretch the sweep covers
    const L = mbcrLen(s2);
    return {x: p.x + cx*L, y: p.y + cy*L};                    // the BCRL tip for that direction
  };
  // Sampling in angle is only even near him: for a ray that runs almost along the flight a small turn moves
  // the BPCP a long way up the path, so the reach changes very fast and a fixed grid would cut a chord clean
  // across that spike instead of following it. Any step whose ends are further apart than MAX_CHORD is
  // bisected in angle until it is not, so the drawn curve follows the envelope wherever it bends hardest.
  const MAX_CHORD = 0.18;                                     // metres, the longest step the curve may take
  const walk = (th0, th1, depth) => {
    const q1 = at(th1);
    if (!q1) return;
    const q0 = pts[pts.length-1];
    if (q0 && Math.hypot(q1.x - q0.x, q1.y - q0.y) > MAX_CHORD && depth < 9){
      const tm = (th0 + th1)/2;
      if (at(tm)){ walk(th0, tm, depth+1); walk(tm, th1, depth+1); return; }
    }
    pts.push(q1);
  };
  const first = at(a0);
  if (first) pts.push(first);                                 // the sweep's own first sample
  for (let i = 0; i < steps; i++) walk(a0 + da*i/steps, a0 + da*(i+1)/steps, 0);
  // The curve begins at the player himself, not a reach off him: the first point is his centre, and the
  // next one is the envelope's first sample — the ball's own BPCP, where the reach is STATIC_REACH. The
  // envelope never comes inside STATIC_REACH, so without the centre the sweep would hang in the air beside
  // him, touching nothing.
  pts.unshift({x: p.x, y: p.y});
  return {pts, lv, win, exit, ray, sB};
}

// ---- BCRL: which reach line is the visible one --------------------------------------------------
// BCRLE (ball contact reach line extension) is any segment from p's centre out to a point of his MPRC.
// BCRL (ball contact reach line) is the part of a BCRLE from the centre up to where it crosses the BTL:
// the reach that really meets the ball. Where the BCRLE ends on the BTL itself the two are the same
// segment — an EBCRL (edge BCRL) — and its tip is an EBCRP (edge ball contact reach point), one of the
// at most two points of the flight he can just reach. Only one direction is ever drawn:
//   VBCRLE-L, the lateral one (horizontal, parallel to the net), when the ball is inside his reach at the
//     moment it levels with him: that is the line he meets the ball head-on on, so it beats the edges.
//     Its BCRLE runs on to the MPRC and its BCRL stops on the level BPCP;
//   otherwise the shorter of the two EBCRLs: the nearest EBCRP, the earliest point on the flight he can
//     meet. mbcrLen grows with dball, so the shorter line is simply the smaller s. Both EBCRPs are still
//     dotted (below); the one this line does not end on is the faded one;
//   no EBCRP at all: VBCRL-U (unreachable), perpendicular to the BTL — the shortest way toward a flight
//     he cannot touch — ending on the MPRC where that direction's reach runs out, or on the MCL when that
//     reach would carry it across the net, with a faded dot on that tip: it is a place he could stretch
//     to, not one where the ball ever is.
// Returns {tip, ball, edge, edges, dball}: tip is on the MPRC (the reach the flight buys him), ball is
// where the line crosses the BTL (null for VBCRL-U), edge is the BTL distance of an EBCRL tip (null when
// the tip is not on the BTL), edges lists every EBCRP's BTL distance, and dball is how far down the BTL
// the contact sits — the flight he has to wait for, which the contact dot, the beams and his partner's
// circle are all measured on. Every one of them comes from this single call, so the drawn line and the
// place he meets the ball cannot drift apart.
function bcRl(p, curve){
  const {ray, win, lv, exit, sB} = curve;
  const at = s => ({x: ray.x + ray.ux*s, y: ray.y + ray.uy*s});
  const edges = [];
  // Only crossings on his own side of the MCL count. A point of the flight beyond the net is one he may
  // not play, so it is never dotted and never picked as the edge the VBCRL ends on — the line stops at
  // the crossings he can actually use. Both teams stand clear of the net line by a head (see the drag
  // clamp), so which side a Y falls on is never ambiguous.
  const own = s => { const q = at(s); return q.y*p.y > 0; };
  if (win && win.s1 > 1e-9 && own(win.s1)) edges.push(win.s1);             // where the path enters his reach ...
  if (win && Number.isFinite(win.s2) && own(win.s2)) edges.push(win.s2);   // ... and where it leaves it again
  // VBCRLE-L: the ball is level with him on screen (exit) and inside his reach at that moment (win), so
  // the lateral line does reach it. The level BPCP is on the BTL by construction, so its BCRL end needs
  // no crossing test of its own.
  if (lv && lv.dball <= exit + 1e-9 && win &&
      lv.dball >= win.s1 - 1e-9 && lv.dball <= win.s2 + 1e-9){
    const L = mbcrLen(lv.dball), sgn = lv.x >= p.x ? 1 : -1;
    return {tip: {x: p.x + sgn*L, y: p.y}, ball: at(lv.dball), edge: null, edges, dball: lv.dball};
  }
  if (edges.length){
    const s = edges[0], tip = at(s);                        // the nearest EBCRP: the shorter EBCRL
    return {tip, ball: tip, edge: s, edges, dball: s};
  }
  // VBCRL-U: the perpendicular foot is the nearest BPCP; when the swept stretch ends before it (or the
  // ball itself is already past it) the nearest BPCP the MPRC actually covers is used instead, so the
  // tip lands on the drawn curve either way.
  const s = Math.max(0, Math.min(sB, (p.x - ray.x)*ray.ux + (p.y - ray.y)*ray.uy));
  const q = at(s), dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
  if (!(d > 1e-6)) return null;                             // the ball sits on him: no direction to show
  const L = mbcrLen(s), tip = {x: p.x + dx/d*L, y: p.y + dy/d*L};
  // The MPRC may bulge across the net — the flight's reach knows no halves — but the line into it may not:
  // a player never plays from the far side of the MCL, so the stretch stops where it meets the net and its
  // faded dot sits right on the MCL. That is the furthest he may go toward a ball he cannot touch.
  if (tip.y*p.y < 0){
    const t = p.y/(p.y - tip.y), x = p.x + (tip.x - p.x)*t;  // where the segment meets the net
    tip.x = x; tip.y = 0;
  }
  return {tip, ball: null, edge: null, edges, dball: s};
}

// an attacker always has the fixed static wingspan per side, wherever he stands
const reachOf = p => p.team === attackTeam() ? STATIC_REACH : defenderReach(p);

// ---- ball mode: the arrow decides the scene. It points at the team that receives the ball, i.e. the
//      team about to attack; the other team defends. No tap can override either role.
const frontSign = p => p.team === 'A' ? 1 : -1;   // +1: the top team faces down-court, -1: the bottom up
const ballInFront = p => (ball.y - p.y) * frontSign(p) >= 0;

// The team the arrow points at: up the screen -> the top team, down -> the bottom team. Within a
// pixel of level the arrow names nobody, so the current roles stay put (the arrow is plain white
// then too, see arrowColor).
function attackTeam(){
  if (!ball.on) return attack;
  const g = arrowGeom(), dy = g.uy*g.len;      // the direction as drawn, exactly like arrowColor()
  if (Math.abs(dy) < 1) return attack;
  return dy < 0 ? 'A' : 'B';
}

// The arrow as an imaginary ray: ball centre, unit direction. Hit detection, the side and the
// expected hitting point are all measured along it, so they can never disagree with the drawn arrow.
// It now comes straight from the stored rotation, so it is always defined (see the arrow's model).
function ballRay(){
  const a = ball.rot*DEG;
  return {x: ball.x, y: ball.y, ux: Math.cos(a), uy: Math.sin(a)};
}

// Which player of the attacking team meets the ball, on which side, and where he is expected to hit.
// A player has the ball when the path comes inside his MBCR reach (mbcrWindow); ties, and a path that
// misses everybody, are settled by the gap between the trajectory and his reach, so beams, shadows and
// contact dot never vanish just because the arrow is off every reach. The point he hits from is not
// solved here at all: it is the end of the reach line bcRl draws for him — the level BPCP, the EBCRP of
// the EBCRL, or the tip of the VBCRL-U — so the contact dot, the beams that start there, the partner's
// circle and the length of the drawn line all read one model.
// ballHitter runs a whole MPRC sweep, and the beams ask for it once per defender zone as well as once
// for the players, so the answer is memoised for the frame: draw() bumps hitterFrame and the first
// caller of the frame pays for the sweep. Everything it reads (the ball, the players, the arrow) is
// fixed while a frame is drawn, so a cached answer cannot go stale inside one.
let hitterFrame = 0, hitterCache = {frame: -1, value: null};
function ballHitter(){
  if (hitterCache.frame === hitterFrame) return hitterCache.value;   // one sweep per frame, see above
  return (hitterCache = {frame: hitterFrame, value: solveHitter()}).value;
}
function solveHitter(){
  if (!ball.on) return null;
  const ray = ballRay();
  if (!ray) return null;
  const team = attackTeam();
  let best = null;
  for (const p of players){
    if (p.team !== team || !ballInFront(p)) continue;   // behind the player: no reach, no hit
    const lv = levelBPCP(p, ray);
    const R = mbcrLen(lv ? lv.dball : 0);   // his reach when the ball levels with him
    const win = mbcrWindow(p, ray);         // ... and whether the path ever comes inside it
    const ox = ray.x - p.x, oy = ray.y - p.y;
    // a trajectory outside his reach still makes him a contender: the gap between that reach and the
    // trajectory decides who is closest, so the beams keep showing even when the arrow misses both
    const miss = win ? 0 : Math.max(0, Math.abs(ox*ray.uy - oy*ray.ux) - R);
    const better = !best || miss < best.miss - 1e-9 ||
                   (Math.abs(miss - best.miss) <= 1e-9 && Math.abs(p.y) < Math.abs(best.p.y));
    if (better) best = {p, R, miss, win, lv};
  }
  if (!best) return null;
  const p = best.p, curve = mprc(p), bcrl = bcRl(p, curve);
  // ball is set only when the line really reaches the ball, so it is also the test for a real contact:
  // a VBCRL-U ends on his MPRC, never on the flight, and its tip is where he stretches to, not a meeting.
  const at = bcrl ? bcrl.ball || bcrl.tip : {x: p.x, y: p.y};   // null bcrl: the ball sits on him
  const hit = {x: at.x, y: at.y, dball: bcrl ? bcrl.dball : 0, reached: !!(bcrl && bcrl.ball)};
  return {...best, curve, bcrl, hit, clamped: !hit.reached,
          side: Math.abs(hit.x - p.x) < 1e-9 ? (ball.x < p.x ? -1 : 1) : (hit.x < p.x ? -1 : 1)};
}

// The one bad case of ball mode: the flight never crosses the hitter's MPRC (bcRl's VBCRL-U), so no reach
// line can meet the ball at all. Then, and only then, the whole attacking pair reads red — the hitter has no
// contact and his partner has nothing to cover. A partner who is merely not the man the arrow picked is not
// at fault, so the red is never asked of a player on his own reach: it belongs to the pair.
function noContact(){
  const h = ball.on ? ballHitter() : null;
  return !!(h && h.bcrl && !h.bcrl.ball);
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let cw = 0, ch = 0, dpr = 1, s = 1, ox = 0, oy = 0;
function resize(){
  const r = cv.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  cw = r.width; ch = r.height;
  cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
  const top = document.querySelector('header').getBoundingClientRect().bottom + 6;
  const availH = Math.max(100, ch - top);
  s = Math.min(cw/(CW+2*MX), availH/(CL+2*MY));
  ox = cw/2; oy = top + availH/2;
  VB = {x0:-ox/s, y0:-oy/s, x1:(cw-ox)/s, y1:(ch-oy)/s};
  draw();
}
new ResizeObserver(resize).observe(cv);
new ResizeObserver(resize).observe(document.querySelector('header'));
const toPx = p => ({x: ox + p.x*s, y: oy + p.y*s});
const toWorld = (px,py) => ({x:(px-ox)/s, y:(py-oy)/s});

// ---- the ball's felt colour, in one place: the whole body is one shading ramp derived from this
//      value, so re-tinting the ball is a one-line edit. '#cfea55' is the optic yellow it ships
//      with; other ideas: '#d8f24a' (brighter), '#f2e14a' (classic yellow), '#e8703a' (clay).
//      Any CSS hex ('#rrggbb') or [r, g, b] array works, and opts.color overrides it per call.
const BALL_COLOR = '#d6d606';
const BALL_SEAM_COLOR = '#ffffff';            // the seam's lit colour (real balls have white seams)

// ---- overall brightness of the ball: 1 is the plain shading model below, and 1.3 is the punchier
//      felt tennis_ball.html ships with (its light dim is gentler, worth about 1.3x here). It
//      multiplies the body ramp and the seam, then clips at 255, so the highlight goes sunny and
//      the shadow side stays readable. opts.brightness overrides it per call.
const BALL_BRIGHTNESS = 1.1;

// ---- tennis ball: a self-contained sphere renderer (shaded body + the classic four-lobe seam
//      band), so the court can show a real tennis ball that the user can drag around.
//   drawTennisBall(ctx, x, y, radius, opts)
//     x, y     centre in CSS pixels — the ctx must be in pixel space, not scaled to metres
//     radius   ball radius in pixels
//     opts     quat     orientation [w, x, y, z]     (default 0.0698, 0.6742, -0.7349, 0.0210)
//              spin     extra turn of the whole pattern about the view axis, ° (default 0),
//                       positive = clockwise on screen, i.e. the arrow's own rot can be passed as is
//              az, el   light azimuth / elevation, °  (default -82, 26)
//              seam     carved seam width, °          (default 4.0)
//              segments seam resolution               (default 252)
//              color    felt colour, '#rrggbb' | [r,g,b]  (default BALL_COLOR)
//              seamColor seam colour, same forms      (default BALL_SEAM_COLOR)
//              brightness overall brightness multiplier (default BALL_BRIGHTNESS)
const drawTennisBall = (() => {
  const D = {quat: [0.0698, 0.6742, -0.7349, 0.0210], spin: 0, az: 0, el: 0, seam: 4.0, segments: 252};
  // felt ramp: the five shading stops of the body, each the base colour plus an offset — the
  // highlight lifts it, the three lower bands drain it. Integers, so the default look is exact.
  const TINT = [[0.00,  26,  14,  55],
                [0.26,   0,   0,   0],
                [0.55, -33, -29, -34],
                [0.80, -73, -69, -56],
                [1.00,-128,-128, -70]];
  // '#rrggbb' | 'rgb(r,g,b)' | [r,g,b] -> [r,g,b], or null if it cannot be read
  const HEX = /^#?([0-9a-f]{6})$/i, RGBA = /^rgba?\(([^)]+)\)$/i;
  function color(c){
    if (Array.isArray(c)) return [+c[0]|0, +c[1]|0, +c[2]|0];
    const s = String(c == null ? '' : c).trim();
    const h = HEX.exec(s);
    if (h){ const v = parseInt(h[1], 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; }
    const t = RGBA.exec(s);
    if (t){ const p = t[1].split(',').map(Number); return [p[0]|0, p[1]|0, p[2]|0]; }
    return null;
  }
  const n3 = v => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/m, v[1]/m, v[2]/m]; };
  const n4 = q => { const m = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
                    return [q[0]/m, q[1]/m, q[2]/m, q[3]/m]; };
  const cross = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  const bite = v => { v = Math.round(v); return v < 0 ? 0 : v > 255 ? 255 : v; };
  const rgb = (r, g, b) => 'rgb(' + bite(r) + ',' + bite(g) + ',' + bite(b) + ')';
  // opts.brightness -> a usable multiplier: anything unreadable or <= 0 falls back to the constant
  const brightOf = b => { const v = +b; return Number.isFinite(v) && v > 0 ? clamp(v, 0, 3) : BALL_BRIGHTNESS; };
  const rot = q => {                                  // quaternion -> 3x3 matrix, row major
    const w = q[0], x = q[1], y = q[2], z = q[3];
    return [1-2*(y*y+z*z), 2*(x*y-w*z),   2*(x*z+w*y),
            2*(x*y+w*z),   1-2*(x*x+z*z), 2*(y*z-w*x),
            2*(x*z-w*y),   2*(y*z+w*x),   1-2*(x*x+y*y)];
  };
  const turn = (m, p) => [m[0]*p[0] + m[1]*p[1] + m[2]*p[2],
                          m[3]*p[0] + m[4]*p[1] + m[5]*p[2],
                          m[6]*p[0] + m[7]*p[1] + m[8]*p[2]];
  // the seam: four semicircular arcs on the unit sphere, cached per resolution
  const A = 0.5, Bo = A/3, C = 2*Math.sqrt(A*Bo), U = A + Bo, seams = new Map();
  function seamPts(n){
    let pts = seams.get(n);
    if (pts) return pts;
    pts = new Array(n);
    for (let i = 0; i < n; i++){
      const t = i/n*Math.PI*2;
      pts[i] = [(A*Math.cos(t) + Bo*Math.cos(3*t))/U, (A*Math.sin(t) - Bo*Math.sin(3*t))/U,
                C*Math.sin(2*t)/U];
    }
    seams.set(n, pts);
    return pts;
  }
  // light direction: azimuth measured from +z toward +x, elevation from the horizontal plane
  function light(az, el){
    const a = az*Math.PI/180, e = el*Math.PI/180, ce = Math.cos(e);
    return [ce*Math.sin(a), Math.sin(e), ce*Math.cos(a)];
  }

  return function drawTennisBall(ctx, x, y, radius, opts = {}){
    if (!(radius > 0.01)) return;
    const M = rot(n4(opts.quat || D.quat));
    // spin: one more turn of everything about the view axis (z, the axis pointing at the reader), applied
    // after the quaternion. The ball's own y is up while a screen's y is down, so a turn that is clockwise
    // on screen — the sense the arrow's rot grows in — reads as (x, y) -> (x cos + y sin, y cos - x sin)
    // here: the sine carries the opposite sign to the screen formula, and the two agree by construction.
    const sp = (opts.spin ?? D.spin)*Math.PI/180, sc = Math.cos(sp), sn = Math.sin(sp);
    const L = light(opts.az ?? D.az, opts.el ?? D.el);
    const br = brightOf(opts.brightness);             // overall brightness, on top of the light shading
    const band = (opts.seam ?? D.seam)*Math.PI/180;    // seam half-width on the sphere (rad)
    const pts = seamPts(Math.max(16, Math.round(opts.segments ?? D.segments)));
    const N = pts.length, P = new Array(N), E1 = new Array(N), E2 = new Array(N), vis = new Array(N);
    for (let i = 0; i < N; i++){
      const p = turn(M, pts[i]);
      P[i] = [p[0]*sc + p[1]*sn, p[1]*sc - p[0]*sn, p[2]];   // the hinge is z, so z is left alone
    }
    for (let i = 0; i < N; i++){
      const p = P[i], pa = P[(i + N - 1) % N], pb = P[(i + 1) % N];
      const tan = n3([pb[0] - pa[0], pb[1] - pa[1], pb[2] - pa[2]]);    // along the seam
      const bin = n3(cross(p, tan));                                    // across the seam
      E1[i] = n3([p[0] + band*bin[0], p[1] + band*bin[1], p[2] + band*bin[2]]);
      E2[i] = n3([p[0] - band*bin[0], p[1] - band*bin[1], p[2] - band*bin[2]]);
      vis[i] = p[2] > 0;                                                // front hemisphere only
    }
    const px = v => [x + v[0]*radius, y - v[1]*radius];

    ctx.save();
    // body: one radial gradient, centred on the highlight the light direction implies
    const xy = Math.hypot(L[0], L[1]), bright = Math.max(0, L[2]);
    const ux = xy > 1e-6 ? L[0]/xy : 0, uy = xy > 1e-6 ? L[1]/xy : 0;
    const hf = (L[2] >= 0 ? xy*0.85 : 0.85)*radius;
    const hx = x + ux*hf, hy = y - uy*hf;
    const k = clamp(0.55 + 0.45*(L[2] + 0.45)/1.13, 0.35, 1)*br;       // dims when backlit, then brightens
    const g = ctx.createRadialGradient(hx, hy, radius*(0.06 + 0.10*(1 - bright)),
                                       hx, hy, radius*(1.30 + 0.30*(1 - bright)));
    const base = color(opts.color) || color(BALL_COLOR) || [207, 234, 85];   // felt colour
    for (const [pos, r, gg, b] of TINT)      // the whole body ramp, derived from that one colour
      g.addColorStop(pos, rgb((base[0] + r)*k, (base[1] + gg)*k, (base[2] + b)*k));
    ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();

    // seam: one flat-shaded quad per visible segment, lit by the same light
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const seamCol = color(opts.seamColor) || color(BALL_SEAM_COLOR) || [255, 255, 244];
    const lw = radius > 30 ? Math.min(1.1, radius*0.02) : 0;            // hides hairlines on big balls
    if (lw) ctx.lineWidth = lw;
    for (let i = 0; i < N; i++){
      const j = (i + 1) % N;
      if (!vis[i] && !vis[j]) continue;
      const nx = (P[i][0] + P[j][0])*0.5, ny = (P[i][1] + P[j][1])*0.5, nz = (P[i][2] + P[j][2])*0.5;
      const nl = Math.hypot(nx, ny, nz) || 1;
      const lam = Math.max(0, (nx*L[0] + ny*L[1] + nz*L[2])/nl);
      // lit by the same light, brightened, and capped so the seam tops out at its own colour
      const t = Math.min(1, (0.42 + 0.58*Math.pow(lam, 0.9))*br);
      const col = rgb(seamCol[0]*t, seamCol[1]*t, seamCol[2]*t);
      const a = px(E1[i]), b = px(E2[i]), c = px(E2[j]), d = px(E1[j]);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]);
      ctx.closePath();
      ctx.fillStyle = col; ctx.fill();
      if (lw){ ctx.strokeStyle = col; ctx.stroke(); }
    }
    ctx.restore();
  };
})();

// A tennis ball is 3.43 cm in radius, i.e. about one pixel at the court's normal scale, so its true
// size is far too small to see: what is drawn is BALL_PX pixels of screen instead (raise BALL_PX,
// or drag "Ball size" in the header — that writes ball.px — to watch it change). The true radius is
// still a floor, so the ball only grows past ball.px when you zoom in enough for it to matter.
// Like a player it is clamped to the visible rectangle, and it is drawn above everything else.
const BALL_R = 0.0343;                        // true radius of a tennis ball, metres
const BALL_PX = 11;                            // drawn radius, CSS px  ← the size you actually see
const ball = {
  on: false,
  x: 0, y: 6.5,                               // starts on the centre line, behind the near service line
  vel: 90,                                    // the ball's speed, km/h — it IS the arrow's length
  rot: 303.7,                                 // the arrow's rotation, degrees (see the model below)
  px: BALL_PX,                                // drawn radius, CSS px (the header slider edits this)
  quat: [0.0698, 0.6742, -0.7349, 0.0210]     // the ball's default orientation
};
// ---- the arrow's model: speed + rotation, never a tip.  The arrow is drawn to a fixed scale —
//      2 m of court is 50 km/h, i.e. 25 km/h per metre — so the same speed and angle mean the same
//      thing at any zoom and the URL can carry them instead of a length in metres.
//      Rotation is in degrees: 0 points along +x (screen right) and the angle grows clockwise on
//      screen, because court y grows down; -90 (i.e. 270) aims at the top pair, +90 at the bottom.
const DEG = Math.PI/180;
const normRot = deg => ((deg % 360) + 360) % 360;          // into 0 .. 360
const VEL_PER_M = 50/2;                                    // km/h per metre of arrow: 2 m = 50 km/h
const BALL_VEL_MIN = 10, BALL_VEL_MAX = 400;               // km/h — the arrow stays inside this
const clampVel = v => Math.max(BALL_VEL_MIN, Math.min(BALL_VEL_MAX, v));
const arrowLenM = () => ball.vel / VEL_PER_M;              // the arrow's length, metres
// the arrow's tip in world metres: always derived from the centre, so moving the ball carries the
// arrow with it and stretching/swinging the arrow never touches the ball's position
const arrowTipWorld = () => {
  const a = ball.rot*DEG, L = arrowLenM();
  return {x: ball.x + Math.cos(a)*L, y: ball.y + Math.sin(a)*L};
};
// a tip in world metres -> {vel, rot}: what an older "b:x:y:tipx:tipy" link still carries
function arrowFromTip(x, y, tx, ty){
  const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy);
  if (d < 1e-9) return null;
  return {vel: clampVel(d*VEL_PER_M), rot: normRot(Math.atan2(dy, dx)/DEG)};
}
const ballR = () => Math.max(BALL_R*s, ball.px);
// The felt turns with the arrow: the seam pattern is spun about the view axis by the arrow's own rotation,
// so the ball is never showing the same face twice — swing the arrow and its face turns with it, at 1:1.
// ball.quat stays the ball's rest orientation (the arrow edits nothing else), and because the light is fixed
// in the same frame, only the pattern turns while the highlight stays where the light puts it.
function drawBall(){
  if (!ball.on) return;
  const c = toPx(ball);
  drawTennisBall(ctx, c.x, c.y, ballR(), {quat: ball.quat, spin: ball.rot});
}

// ---- the ball's arrow. It always starts at the ball's centre, but the first stretch is never drawn:
//      a gap radius (always wider than the ball) swallows the tail, so the felt stays clean and the
//      arrow reads as a direction sticking out of the ball. Drag the arrow itself and it only changes
//      the ball's speed (its length, see stretchArrow); swing it by dragging the dashed continuation
//      past the tip (see rotateArrow), where the lever arm is as long as the grab is far away.
const BALL_ARROW_W       = 4;     // shaft width, CSS px  ← the 4 px "Arrow width" setting
const BALL_ARROW_GAP     = 8;     // clear space kept past the ball's edge, CSS px
const BALL_ARROW_MIN     = 14;    // shortest VISIBLE arrow, gap edge -> tip, CSS px
const BALL_ARROW_HEAD_L  = 12;    // head length along the shaft, CSS px
const BALL_ARROW_HEAD_HW = 6.5;   // head half-width, CSS px
const BALL_ARROW_COLOR   = '#ffffff';   // the plain arrow colour
let arrowW = BALL_ARROW_W;        // live shaft width (the header "Arrow width" slider edits this)

// The arrow is the ball's shot direction, so its colour names the side that sent it: aimed up at the
// top pair (A, B) it wears the bottom pair's colour, aimed down at C, D it wears the top pair's —
// the ball comes from that side's opponent. It reads the direction as it is DRAWN (pixel space, the
// same vector arrowGeom() uses), so the colour can never disagree with the arrow you see; within a
// pixel of level it is aimed at nobody and keeps the plain colour. Read at draw time, so turning the
// arrow recolours it.
function arrowColor(){
  const g = arrowGeom(), dy = g.uy*g.len;          // the arrow's whole drawn rise, CSS px
  if (Math.abs(dy) < 1) return BALL_ARROW_COLOR;
  return dy < 0 ? COL.B : COL.A;                 // up -> sent by the bottom pair, down -> by the top pair
}

// The arrow as it is drawn, all in CSS px: ball centre, unit direction (ux, uy), the gap it hides
// behind, and the tail / tip / head it ends up with. Never shorter than BALL_ARROW_MIN past the gap.
// The direction comes from ball.rot and the length from ball.vel at VEL_PER_M, so the shaft is a
// physical reading of the ball's speed; only the pixel minimum below is a drawing convenience.
function arrowGeom(){
  const c = toPx(ball), gap = ballR() + BALL_ARROW_GAP;
  const t = toPx(arrowTipWorld());
  let dx = t.x - c.x, dy = t.y - c.y, d = Math.hypot(dx, dy);
  if (d < 1e-6){ dx = 1; dy = 0; d = 1; }                   // degenerate: aim along +x
  const len  = Math.max(d, gap + BALL_ARROW_MIN);            // minimal length, from the ball's centre
  const ux = dx/d, uy = dy/d;
  const head = Math.min(Math.max(BALL_ARROW_HEAD_L, arrowW*1.6), (len - gap)*0.55);   // grows with width,
  return {c, gap, ux, uy, len, head,                        // never longer than the visible arrow
          hw: Math.max(arrowW*0.85, BALL_ARROW_HEAD_HW*(head/BALL_ARROW_HEAD_L)),
          tail: {x: c.x + ux*gap, y: c.y + uy*gap},
          tip:  {x: c.x + ux*len, y: c.y + uy*len}};
}

// The dashed continuation wears the arrow's own colour, lightened halfway to white: at 0.6 opacity
// the plain team colour reads too dim over the court, and a lightened version keeps the team's hue
// while staying visible all the way to the screen edge.
function brighten(hex){
  const n = parseInt(hex.slice(1), 16), mix = v => Math.round(v + (255 - v)*0.5);
  return 'rgb(' + mix((n >> 16) & 255) + ',' + mix((n >> 8) & 255) + ',' + mix(n & 255) + ')';
}

// How far a pixel-space ray from (x, y) along (ux, uy) runs before it leaves the canvas: the dashed
// extension of the arrow stops exactly at the edge of the screen, wherever it is aimed.
function edgeReach(x, y, ux, uy){
  let t = Infinity;
  if (ux >  1e-9) t = Math.min(t, (cw - x)/ux);
  if (ux < -1e-9) t = Math.min(t, (0  - x)/ux);
  if (uy >  1e-9) t = Math.min(t, (ch - y)/uy);
  if (uy < -1e-9) t = Math.min(t, (0  - y)/uy);
  return t;
}

// shaft + filled head, in pixel space above the court. The tail cap is flat ("butt"), so the gap
// really is empty: the arrow begins exactly gap px past the ball's edge and never covers the ball.
// Its length is the ball's speed (see VEL_PER_M), so it grows with the shot and shrinks with it.
// Past the tip the same direction carries on as a thin dashed line at 0.6 — the opacity the example
// gives its dashed trajectory — in the arrow's own colour (lightened, see brighten), right to the edge
// of the screen, so the shot line reads across the whole court without competing with the arrow itself.
// That dashed run is also the aiming handle: it is long, so grabbing it far from the ball gives a long
// lever arm (see rotateArrow).
// The flight itself, drawn first among the ball-mode elements (see draw): the marks and the players are
// laid on top of it, never the other way round.
function drawBallFlight(){
  if (!ball.on) return;
  const g = arrowGeom(), col = arrowColor();
  // The dashed run is the flight itself, drawn whole: it never stops at a player's reach, because the
  // trajectory is what the arrow means and a line that ends mid-court reads as the arrow being cut
  // short. It runs from the tip all the way to the edge of the screen, wherever the arrow is aimed —
  // except across the HWS, which is drawn solid instead (below), so the two never overlap and double
  // their alpha.
  const run = edgeReach(g.tip.x, g.tip.y, g.ux, g.uy);   // tip -> screen edge, along the arrow
  const h = ballHitter();
  const hws = h && h.win && Number.isFinite(h.win.s2) && h.win.s2 > h.win.s1 ? h.win : null;
  const w0 = hws ? hws.s1*s : Infinity;                  // HWS near EBCRP, px from the ball's centre
  const w1 = hws ? hws.s2*s : -Infinity;                 // ... and its far EBCRP
  // Dashes up to the window, then from its far end to the edge; with no window the run is one piece.
  const dashedRuns = [[g.len, Math.min(g.len + run, w0)], [Math.max(g.len, w1), g.len + run]];
  if (run > 0.5){
    ctx.save();
    ctx.globalAlpha = 0.6;                          // the opacity of the example's dashed trajectory
    ctx.strokeStyle = brighten(col);                // same hue, half way to white: readable at 0.6
    ctx.lineWidth = DASH_W; ctx.lineCap = 'butt';   // exactly the MBCR curve's stroke, in CSS px
    ctx.setLineDash([DASH_ON, DASH_OFF]);
    for (const [a, b] of dashedRuns)
      if (b - a > 0.5) line(g.c.x + g.ux*a, g.c.y + g.uy*a, g.c.x + g.ux*b, g.c.y + g.uy*b);
    ctx.restore();
  }
  // HWS: the hitting window is the segment of the BTL between the two EBCRPs — the part of the flight
  // the hitter can actually meet. It is the same line as the dashed run above, so it uses exactly that
  // stroke and colour and only drops the dashes: solid says "inside his window", dashed is the rest of
  // the flight. No window at all (the path never enters his reach) means no solid stretch.
  if (hws){
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = brighten(col);
    ctx.lineWidth = DASH_W; ctx.lineCap = 'butt';
    ctx.setLineDash([]);                            // solid: the window, not the flight
    line(g.c.x + g.ux*w0, g.c.y + g.uy*w0, g.c.x + g.ux*w1, g.c.y + g.uy*w1);
    ctx.restore();
  }
}

// The arrow itself — shaft, filled head and the speed readout — drawn in pixels above everything else
// the ball mode puts on the court. It is the aim handle, not part of the model, so it stays on top even
// though the flight it describes is drawn underneath the marks and the players (see draw).
function drawBallArrow(){
  const g = arrowGeom(), col = arrowColor();
  const bx = g.tip.x - g.ux*g.head, by = g.tip.y - g.uy*g.head;   // centre of the head's base
  const nx = -g.uy, ny = g.ux;                                    // across the shaft
  ctx.save();
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = arrowW; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
  line(g.tail.x, g.tail.y, bx, by);
  ctx.beginPath();
  ctx.moveTo(g.tip.x, g.tip.y);
  ctx.lineTo(bx + nx*g.hw, by + ny*g.hw);
  ctx.lineTo(bx - nx*g.hw, by - ny*g.hw);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // the speed readout, by the arrow's end. The context is turned to the arrow's own angle, so the
  // text's baseline runs along the trajectory and the number is read in the direction the ball is
  // sent; it sits just off the head's flank, clear of the dashed run. Plain white, like the court
  // markings — the arrow's own colour already says which team sends the ball.
  ctx.save();
  ctx.translate(g.tip.x, g.tip.y);
  ctx.rotate(Math.atan2(g.uy, g.ux));
  ctx.font = '700 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  const label = Math.round(ball.vel) + ' km/h';
  ctx.fillText(label, 6, -(g.hw + 9));               // across the shaft, on the arrow's left flank
  ctx.restore();
}

// drag the ARROW: it only changes the ball's speed — the direction belongs to the dashed extension
// (see rotateArrow). The pointer's distance from the ball's centre is read against the speed it had
// when the drag started, so grabbing the shaft anywhere never makes the head jump on the first move.
function stretchArrow(px, py, vel0, dist0){
  const c = toPx(ball), d = Math.hypot(px - c.x, py - c.y)/s;   // metres from the ball's centre
  ball.vel = clampVel(vel0 + (d - dist0)*VEL_PER_M);
}

// drag the DASHED EXTENSION: the arrow is aimed at the pointer and keeps its speed, so only the
// rotation changes. The rotation radius is how far from the ball the drag started — grabbing the
// dashed line far out gives a long lever arm, which is what makes fine aiming possible.
function rotateArrow(px, py){
  const c = toPx(ball), dx = px - c.x, dy = py - c.y;
  if (Math.hypot(dx, dy) < 1e-6) return;
  ball.rot = normRot(Math.atan2(dy, dx)/DEG);
}


function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

function drawCourt(){
  ctx.fillStyle = '#2f8a4e'; ctx.fillRect(VB.x0,VB.y0,VB.x1-VB.x0,VB.y1-VB.y0);
  ctx.fillStyle = '#2e6fd0'; ctx.fillRect(-CW/2,-CL/2,CW,CL);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(0.06, 1.5/s); ctx.lineCap = 'butt';
  ctx.strokeRect(-CW/2,-CL/2,CW,CL);
  line(-SINGLES/2,-CL/2,-SINGLES/2,CL/2); line(SINGLES/2,-CL/2,SINGLES/2,CL/2);
  line(-SINGLES/2,-SERVICE,SINGLES/2,-SERVICE); line(-SINGLES/2,SERVICE,SINGLES/2,SERVICE);
  line(0,-SERVICE,0,SERVICE);
  line(0,-CL/2,0,-CL/2+0.1); line(0,CL/2,0,CL/2-0.1);
}

function drawNet(){
  ctx.strokeStyle = '#f2f4f7'; ctx.lineWidth = Math.max(0.1, 2.5/s);
  line(-POST,0,POST,0);
  ctx.fillStyle = '#f2f4f7';
  for (const x of [-POST, POST]){ ctx.beginPath(); ctx.arc(x,0,0.16,0,7); ctx.fill(); }
}

// A beam is only ever lit by the attacker who is hitting, and that attacker's head-dot distance to a
// defender sizes that defender's reach here — the very same distance the reach line and end dots use
// (see defenderSource), so the shadow and the line can never disagree. In ball mode there is still one
// hitter and two beams, but his source is the end of the reach line drawn for him (ballHitter's hit:
// the level BPCP, an EBCRP, or the tip of a VBCRL-U) — the same point the contact dot marks — so the
// light always leaves from where the line says he meets the ball.
function drawBeams(){
  const T = 400;
  ctx.save();
  ctx.beginPath(); ctx.rect(VB.x0,VB.y0,VB.x1-VB.x0,VB.y1-VB.y0); ctx.clip();
  const atk = attackTeam();
  const defenders = players.filter(q => q.team !== atk);
  // A beam is cast from the attacking player, so the half it is cast from is his own court: there he is in
  // nobody's way and the shade only follows his own stroke, so it is four times lighter. Past the net it
  // falls on the defender's ground, where it is the reach it takes away, and keeps its full weight. Every
  // polygon is therefore filled twice, once inside each half, clipped at the MCL — one number, one rule, and
  // the step in weight lands exactly on the net.
  const atkUp = atk === 'A';                       // A stands in the upper half (y < 0), B in the lower
  const ownRect = atkUp ? [VB.x0, VB.y0, VB.x1-VB.x0, -VB.y0] : [VB.x0, 0, VB.x1-VB.x0, VB.y1];
  const oppRect = atkUp ? [VB.x0, 0, VB.x1-VB.x0, VB.y1] : [VB.x0, VB.y0, VB.x1-VB.x0, -VB.y0];
  const OWN_LIGHT = 0.25;                          // a quarter: the beam on his own side
  const beam = (pts, alpha) => {
    for (const [r, a] of [[ownRect, alpha*OWN_LIGHT], [oppRect, alpha]]){
      ctx.save();
      ctx.beginPath(); ctx.rect(r[0], r[1], r[2], r[3]); ctx.clip();
      ctx.globalAlpha = a; ctx.fillStyle = SHADOW_COL;
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  };
  // one beam per defender: source to that defender's reach zone, then the shadow behind him
  const cast = (S, q) => {
    // net mode: one dark beam only; otherwise the wide (lighter) zone, then the fast ball (darker)
    // one, cut from it by the margin. Both go through the same defenderReach/fastReach the reach
    // line uses, so the line ends and the shadow edge beams can never drift apart.
    const zones = inNetMode(q) ? [[defenderReach(q), 0.3]]
                               : [[defenderReach(q), 0.15], [fastReach(q), 0.3]];
    for (const [rq, alpha] of zones){
      const A = {x: q.x - rq, y: q.y}, B = {x: q.x + rq, y: q.y};
      const dA = {x: A.x-S.x, y: A.y-S.y}, dB = {x: B.x-S.x, y: B.y-S.y};
      if (Math.hypot(dA.x,dA.y) < 1e-6 || Math.hypot(dB.x,dB.y) < 1e-6) continue;
      // lit part: source to defender
      beam([S, A, B], 0.22);
      // shadow behind defender
      beam([A, B, {x: B.x+dB.x*T, y: B.y+dB.y*T}, {x: A.x+dA.x*T, y: A.y+dA.y*T}], alpha);
    }
  };
  if (ball.on){
    const h = ballHitter();
    if (h) for (const q of defenders) cast(h.hit, q);   // one source, exactly two beams
  } else {
    for (const p of players.filter(q => q.team === atk)){
      for (const sx of [-1, 1]){
        if (!(sx < 0 ? p.l : p.r)) continue;
        const S = {x: p.x + sx*STATIC_REACH, y: p.y};
        for (const q of defenders) cast(S, q);
      }
    }
  }
  ctx.restore();
}

function drawPlayers(){
  // Two passes: every reach mark first, every head after. The marks are where the ball can be met —
  // crossing dots, reach lines, the MPRC curve, the partner’s NAPRZ — so they belong to the court, not to
  // the player; the head is drawn last, over them and over the flight (see draw).
  for (const p of players) drawPlayerMarks(p);
  for (const p of players) drawPlayerHead(p);
}

// One player’s marks: his SRCL (the static reach he keeps), his MPRC curve in ball mode, his partner’s
// NAPRZ, the one BCRL that reaches the flight with its EBCRPs, his SRCPs — and last the contact dot, the
// point the whole plan converges on (see the end of the body). Everything here is in court metres.
function drawPlayerMarks(p){
  const atk = attackTeam(), hitter = ball.on ? ballHitter() : null;
  const ray = ball.on ? ballRay() : null;
  const teamCol = COL[p.team], att = p.team === atk, r = reachOf(p);
  // Red marks say one thing only: this flight cannot be returned (noContact — the VBCRL-U case, where the
  // path never crosses the hitter's MPRC), and then the whole attacking pair wears it, hitter and partner
  // alike. Nothing else is red: a partner who is simply not the one hitting is not at fault, and a defender
  // never is — his line is a coverage zone (defenderReach), not a reach curve, so it keeps its team colour.
  const col = ball.on && att && noContact() ? UNREACH_COL : teamCol;
  ctx.strokeStyle = col; ctx.lineCap = 'round';
  ctx.lineWidth = LINE_W/s;
  // An attacker's reach line is his SRCL pair: centre -> SRCP-L and centre -> SRCP-R. In ball mode it —
  // and its SRCP — is still held inside the zone the defensive model gives him (arcReach), so when that
  // zone is narrower than his fixed wingspan the line shortens to it. Otherwise it is the full
  // STATIC_WINGSPAN/2. The MBCR reach the flight buys him is a separate thing and rides on top, as the
  // BCRL to the EBCRP below; the two lines are drawn independently and may differ in length and angle.
  const arc = ball.on && att && ballInFront(p) ? arcReach(p) : 0;
  const half = arc ? Math.min(r, arc) : r;
  // The AHS (active hitting side) is the side he plans to meet this ball on: the side of his centre the
  // contact lies on (hitter.side). In ball mode only that SRCL and SRCP are drawn — the other side is a
  // reach he is not going to use. The partner has no AHS (the flight is not his to plan for), so he
  // carries his travel circle instead; outside ball mode the pair is drawn whole, as before.
  const ahs = !ball.on || !att ? null : (hitter && hitter.p === p ? hitter.side : 0);
  const srclSides = ahs === null ? [-half, half] : (ahs ? [ahs*half] : []);
  // a defender outside net mode: half-transparent line over the whole (wide, lighter-shadow) reach,
  // opaque over the fast ball (darker-shadow) reach, which is that same wide reach cut by the margin.
  // In net mode the reach is a single dark zone, so the line is drawn solid all the way. Every reach
  // here comes from reachOf/defenderReach/fastReach, i.e. from the attacker who is actually hitting
  // and from the identical numbers the shadow edges use.
  const twoZones = !att && !inNetMode(p);
  if (twoZones) ctx.globalAlpha = 0.5;
  if (ahs === null) line(p.x-half,p.y,p.x+half,p.y);   // SRCL-L and SRCL-R (or a defender's zone)
  else if (ahs){
    // Ball mode: the AHS SRCL only — the side he plans to meet this ball on — and in grey instead of team
    // colour: this side is a reach he keeps, not one he plays from, and the SRCP is no longer marked on it,
    // so the line has to say both things by itself. Opaque and butt-capped: it ends exactly at the SRCP, the
    // point he can reach a ball at, with nothing growing half a stroke width past it.
    const prev = ctx.strokeStyle, cap = ctx.lineCap;
    ctx.strokeStyle = SRCL_GREY; ctx.lineCap = 'butt';
    line(p.x,p.y,p.x+ahs*half,p.y);
    ctx.strokeStyle = prev; ctx.lineCap = cap;
  }
  ctx.globalAlpha = 1;
  if (twoZones){ const rn = fastReach(p); line(p.x-rn,p.y,p.x+rn,p.y); }

  // ball mode: only the man who actually meets the ball carries the MPRC — the reach the ball's own
  // flight time allows, swept like the example: uniformly in ANGLE about him, each ray's BPCP giving
  // r = Dp + STATIC_REACH (mprc). It starts at his own centre, runs out to his wingspan circle in the
  // direction of the ball and sweeps on continuously to the far EBCRP where the ball's path finally leaves
  // that reach — or to the level BPCP when the ball is already out of reach by the time it is level with
  // him, so the curve always joins the BCRL tip; a player with the ball behind him has none. Dashed
  // team colour, like the example's curve. His partner is not meeting this ball, so a reach curve
  // would claim he could: he gets the ground he can cover instead (below).
  const fwd = ball.on && att && ballInFront(p);
  const curve = fwd && hitter && hitter.p === p ? hitter.curve : null;
  const bcrl = curve ? hitter.bcrl : null;

  if (curve && curve.pts.length > 1){
    ctx.save();
    ctx.setLineDash([DASH_ON/s, DASH_OFF/s]);
    ctx.lineWidth = DASH_W/s; ctx.lineCap = 'butt';   // butt caps: the dash itself is exactly DASH_ON
    // The sweep is the reach the flight buys him, but where it bulges across the MCL it names ground he may
    // not stand on, so that run is faded — the mirror of the partner's zone, which is clipped at the same
    // line. The curve is cut exactly at y = 0 (a point is inserted there), so every run is stroked in a
    // single alpha, and the dash phase is carried over the cut so the pattern does not restart.
    const cut = [curve.pts[0]];
    for (let i = 1; i < curve.pts.length; i++){
      const a = cut[cut.length-1], b = curve.pts[i];
      if (a.y*b.y < 0) cut.push({x: a.x + (b.x-a.x)*a.y/(a.y-b.y), y: 0});   // where it meets the net
      cut.push(b);
    }
    const runs = [[cut[0]]];
    for (let i = 1; i < cut.length; i++){
      const run = runs[runs.length-1];
      if (cut[i].y === 0 && run[run.length-1].y !== 0){ run.push(cut[i]); runs.push([cut[i]]); }
      else run.push(cut[i]);
    }
    const period = (DASH_ON + DASH_OFF)/s;
    let phase = 0;
    for (const run of runs){
      const q = run.find(pt => pt.y !== 0);          // any sample off the net: which half is this run on
      ctx.globalAlpha = q && p.y*q.y < 0 ? 0.3 : 1;
      ctx.lineDashOffset = -(phase % period);        // the dashes keep their rhythm across the cut
      ctx.beginPath();
      ctx.moveTo(run[0].x, run[0].y);
      for (let i = 1; i < run.length; i++) ctx.lineTo(run[i].x, run[i].y);
      ctx.stroke();
      for (let i = 1; i < run.length; i++) phase += Math.hypot(run[i].x-run[i-1].x, run[i].y-run[i-1].y);
    }
    ctx.restore();
  }

  // ball mode, the partner: his NAPRZ (non-attacking player reaching zone) is the MRA circle — the ground
  // he can travel before his partner meets the ball, travelBy at the contact's BPCP, the same Dp = Vp*t the
  // hitter's own BCRL adds to his wingspan, with no wingspan of its own: it says where he can get to, not
  // what he can reach once he is there. It carries no outline at all: it is a claim on ground, not a line to
  // a point, so the court under the circle is shaded instead (NAPRZ_ALPHA). It is cut at the MCL too: the
  // circle meets the net as a chord, not as a half, so the part beyond it is clipped away — that ground is
  // court he may not stand in and must not be claimed. The shade turns reddish exactly when the pair is red
  // (noContact): then there is no contact left for him to cover.
  if (fwd && hitter && hitter.p !== p){
    const R = travelBy(hitter.hit.dball);            // metres, Vp * (dball / Vball)
    if (R > 1e-6){
      ctx.save();
      ctx.beginPath();                               // his own half of the world, up to the MCL
      if (p.team === 'A') ctx.rect(VB.x0, VB.y0, VB.x1-VB.x0, -VB.y0);
      else                ctx.rect(VB.x0, 0,     VB.x1-VB.x0,  VB.y1);
      ctx.clip();
      ctx.beginPath();
      ctx.arc(p.x, p.y, R, 0, 2*Math.PI);
      ctx.fillStyle = noContact() ? NAPRZ_SHADE_RED : NAPRZ_SHADE;
      ctx.fill();
      ctx.restore();
    }
  }

  // ball mode: the one visible BCRL pair (see bcRl). The VBCRLE beyond the BCRL is faded — it only marks
  // the reach the flight buys him, out to the MPRC — while the VBCRL, the part that really reaches the
