<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doubles court: net player shadow</title>
<style>
:root{--bg:#eef1f4;--bar:#ffffff;--ink:#1b2430;--muted:#5b6776;--line:#d3d9e0;--panel-w:320px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--bar:#18202a;--ink:#e8edf3;--muted:#98a4b3;--line:#2b3644}}
:root[data-theme="dark"]{--bg:#0f141b;--bar:#18202a;--ink:#e8edf3;--muted:#98a4b3;--line:#2b3644}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:2;display:flex;flex-direction:column;padding:10px 14px;background:var(--bar);border-bottom:1px solid var(--line)}
/* The header is a tab strip plus the selected tab's pane. Three tabs share it; only one pane is laid
   out at a time (see setTab), so the court gets everything the pane does not need. */
#tabs{display:flex;gap:4px;margin:-2px 0 0;flex:0 0 auto}
#tabs [role=tab]{font:inherit;font-weight:600;color:var(--muted);background:transparent;border:0;
  border-bottom:2px solid transparent;margin-bottom:-1px;padding:6px 10px;border-radius:6px 6px 0 0;cursor:pointer}
#tabs [role=tab]:hover{color:var(--ink)}
#tabs [role=tab][aria-selected="true"]{color:var(--ink);border-bottom-color:#2e6fd0}
#panel{display:flex;flex-direction:column;min-height:0}
.tabpane{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.tabpane[hidden]{display:none}
#status{color:var(--muted)}
/* The Game tab: the game on court, named at the top, and its help line behind a triangle — the help is
   long, and on a phone it would otherwise be the whole pane. */
#gameHead{display:flex;align-items:center;gap:8px}
#gameName{margin:0;font-size:15px;font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
#helpBtn{flex:0 0 auto;width:26px;height:26px;display:grid;place-items:center;padding:0;border:1px solid var(--line);
  border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
#helpBtn:hover{color:var(--ink);border-color:#2e6fd0}
#helpBtn svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
#helpBtn[aria-expanded="true"] svg{transform:rotate(90deg)}
label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted)}
output{min-width:3em;color:var(--ink);text-align:right}
input[type=range]{flex:1 1 120px;min-width:80px}
button:focus-visible,input:focus-visible{outline:2px solid #2e6fd0;outline-offset:2px}
/* My Games: a "New game" button over the list of saved games. A row is the game's name — one tap opens
   it, a double tap renames it — and a bin at the right; the lit dot marks the active game. */
#newGame{font:inherit;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;cursor:pointer}
#newGame:hover{border-color:#2e6fd0}
#games{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.game{display:flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:8px;
  padding:2px 6px;cursor:pointer;touch-action:manipulation}
.game::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}
.game:hover{background:rgba(46,111,208,.08)}
.game[data-active="true"]{background:rgba(46,111,208,.14);border-color:#2e6fd0}
.game[data-active="true"]::before{background:#2e6fd0}
.gname{flex:1 1 auto;min-width:0;font:inherit;color:var(--ink);background:transparent;padding:6px 4px;
  text-align:left;border-radius:6px}
/* The name is a button, so it is drawn as plain text: no box, no border, nothing that could be taken
   for the rename field. Only the field itself ever looks like a field — hovering or clicking a row can
   no longer read as "the editor opened". */
button.gname{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;cursor:pointer}
button.gname:hover{color:#2e6fd0}
button.gname:focus-visible{outline:2px solid #2e6fd0;outline-offset:-2px}
input.gname{border:1px solid var(--line);cursor:text}
input.gname:focus{border-color:#2e6fd0;background:var(--bar);outline:none}
/* the bin: the row's only action other than opening the game, so it keeps its own colour to stay apart */
.gdel{flex:0 0 auto;width:26px;height:26px;display:grid;place-items:center;padding:0;border:0;
  border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.gdel:hover{color:#c0392b;background:rgba(192,57,43,.12)}
.gdel svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.hint{margin:0;color:var(--muted);font-size:12px}
canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;touch-action:none;cursor:grab;display:block}
canvas.drag{cursor:grabbing}
/* Narrow screens: the pane stacks under the tabs from the top down and scrolls on its own, so the
   court keeps the rest of the height. */
@media (max-width:700px){
  header{padding:8px 12px}
  #panel{max-height:calc(100vh - 118px);max-height:calc(100dvh - 118px);overflow:auto;overscroll-behavior:contain}
}
/* Wide screens: a tab that has a pane becomes a column down the left side and the court moves to its
   right. The Game tab has no panel yet — its pane is only the scene's line of help — so it keeps the
   header as a strip across the top and the court keeps the full width. */
@media (min-width:701px){
  header:not([data-tab="game"]){right:auto;bottom:0;width:var(--panel-w);border-right:1px solid var(--line);
    border-bottom:0;overflow:auto;overscroll-behavior:contain}
  header:not([data-tab="game"]) ~ main canvas{left:var(--panel-w);width:calc(100vw - var(--panel-w))}
  #tabs{position:sticky;top:0;z-index:1;background:var(--bar)}
}
</style>
</head>
<body>
<header data-tab="game">
  <nav id="tabs" role="tablist" aria-label="Controls">
    <button type="button" role="tab" id="tabbtn-game" aria-selected="true" aria-controls="tab-game">Game</button>
    <button type="button" role="tab" id="tabbtn-games" aria-selected="false" aria-controls="tab-games">My Games</button>
    <button type="button" role="tab" id="tabbtn-settings" aria-selected="false" aria-controls="tab-settings">Settings</button>
  </nav>
  <div id="panel">
    <section class="tabpane" id="tab-game" role="tabpanel" aria-labelledby="tabbtn-game">
      <div id="gameHead">
        <h2 id="gameName">Game 1</h2>
        <button id="helpBtn" type="button" aria-expanded="false" aria-controls="status"
                aria-label="Help" title="Show help">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div id="status" hidden></div>
    </section>
    <section class="tabpane" id="tab-games" role="tabpanel" aria-labelledby="tabbtn-games" hidden>
      <button id="newGame" type="button">New game</button>
      <ul id="games"></ul>
      <p class="hint">Tap a game to open it, double tap to rename it.</p>
    </section>
    <section class="tabpane" id="tab-settings" role="tabpanel" aria-labelledby="tabbtn-settings" hidden>
      <label>Dynamic Volley Reach <input id="rn" type="range"><output id="rnv"></output></label>
      <label>Reach per side (groundstroke) <input id="rb" type="range"><output id="rbv"></output></label>
      <label>Fast balls reach margin per side <input id="rm" type="range"><output id="rmv"></output></label>
      <label>Show ball <input id="ballOn" type="checkbox"></label>
      <label>Display delta marker <input id="deltaOn" type="checkbox"></label>
      <label>Ball size <input id="ballSize" type="range" min="3" max="40" step="1"><output id="ballSizev"></output></label>
      <label>Arrow width <input id="arrowW" type="range" min="2" max="12" step="1"><output id="arrowWv"></output></label>
    </section>
  </div>
</header>
<main><canvas id="c"></canvas></main>
<script>
// Real court dimensions in metres (doubles)
const CW = 10.97, CL = 23.77, SINGLES = 8.23, SERVICE = 6.40, POST = CW/2 + 0.914;
const MX = 2.5, MY = 3;
let VB = {x0:-10,y0:-15,x1:10,y1:15};     // visible world rectangle; origin = centre of net, y down
const COL = { A: '#ffb020', B: '#ff5fa2' };
const UNREACH_COL = '#ff3b30';   // red: the flight cannot be met at all (S-BCRL-U) — the whole pair wears it
const SRCL_GREY = '#8a95a3';      // ball mode's AHS SRCL: grey, opaque, team colour nowhere. It is the reach
                                 // he keeps rather than one he plays from, so it does not wear his colours; and
                                 // it is a whole line, not a faded one, because nothing else is said about the
                                 // SRCP — no mark sits on it any more (see the SRCP pass below).
const LINE_W = 3.5;              // px, the stroke width of every reach line: the SRCL and the BCRL/S-BCRL. One
                                 // number, so a line that is drawn over another is exactly as thick as it, and
                                 // the two can never drift apart.
// NAPRZ — the non-attacking player's reaching zone: the court under his MRA circle is shaded, not outlined.
// NAPRZ_ALPHA is the one knob for both shades (0 = invisible zone, 1 = opaque paint); the red is the pair's
// red and appears only when no contact exists at all (S-BCRL-U, see noContact).
const NAPRZ_ALPHA = 0.1;
const NAPRZ_SHADE = 'rgba(0,0,0,' + NAPRZ_ALPHA + ')';
const NAPRZ_SHADE_RED = 'rgba(255,59,48,' + NAPRZ_ALPHA + ')';
const NAME = { A: 'Top team', B: 'Bottom team' };
const HEAD_PX = 11;
// Grab pads, in CSS pixels. A finger is about 40 px wide and a thin line is a couple of pixels, so a handle
// that claimed only its own stroke would be impossible to catch on a phone; every draggable line is given a
// wide, invisible band instead. Which one a pointer lands on is still decided by distance (pick), so the
// pads may overlap freely: the arrow's shaft, its dashed run and a reach line all stay separately grabbable.
const PAD_LINE = 16;   // px, around a thin line handle: the arrow's shaft, its dashed run, a reach line
const PAD_DOT  = 20;   // px, around a dot handle: a player's head, an end dot, the contact dot
const DOT_GAP = 12;   // GUIDE LINE: clear space (px) kept at each end of the dashed line
const ARROW_GAP = 10;      // ARROW: clear space (px) between the GUIDE LINE and the arrow tail
const ARROW_LEN = 20;      // ARROW: overall length, tail -> tip (px)
const ARROW_HEAD_L = 9;    // ARROW: head length along the shaft (px)
const ARROW_HEAD_HW = 2.6; // ARROW: head half-width (px); 9 long x 2.6 half ≈ 32° apex, CAD-sharp
// DELTA MARKER: the whole drag guide — GUIDE LINE, ARROW and the Δ readout (see drawDragGuide) — is a
// measuring aid, not part of the plan, so it is opt-in: off until the header's "Display delta marker"
// checkbox turns it on, and nothing else in the scene depends on it.
let deltaOn = false;
const SHADOW_COL = "#000";
// The dashed reach guides' stroke, in CSS px: 2 px wide, 5 px dashes with 5 px gaps — the example's
// setLineDash([5, 5]) — so the reach curve and the arrow's continuation read as one family of short dashes.
// Court-space drawing divides these by s to land on pixels; pixel-space drawing uses them as is.
const DASH_W = 2, DASH_ON = 5, DASH_OFF = 5;
// Short names for a player's clickable objects, shared by pick() and end()
const DOT = 'dot';   // lettered placeholder (head dot): drags only, never emits
const FH  = 'fh';    // forehand end dot: emits from the forehand side
const BH  = 'bh';    // backhand end dot: emits from the backhand side
const SEG = 'seg';   // reach line between the two end dots: drags only
const BALL = 'ball'; // the tennis ball: drags only, never emits
const VEC = 'vec';   // the ball's arrow: drags (stretches -> speed) only, never emits
const EXT = 'ext';   // the arrow's dashed continuation: drags (swings -> rotation) only, never emits
const SBCP = 'sbcp'; // the selected contact dot (S-BCP): drags it along the HWS, which re-aims his S-BCRLE
const SBCRLE = 'sbcrle'; // his selected reach line (S-BCRLE): drags it to the same end, by its own line
// world-x of a player's forehand: facing the net, top team (A) = screen-left, bottom team (B) = screen-right
const fhSide = p => p.team === 'A' ? -1 : 1;
// Live reach settings, metres per side (the header sliders edit these). They are the defaults as well:
// the slider specs below take their min/max/step, position and readout from them, so a number is never
// written twice (the HTML carries nothing but the ids).
//   rNet    — "Dynamic Volley Reach": a net defender's reach when his attacker is half a court away
//   rBase   — "Reach per side (groundstroke)": the wide zone when the attacker is a full court length away
//   rMargin — "Fast balls reach margin per side": the negative fraction (e.g. -0.15) taken off each side
//             of that wide reach for the darker fast ball shadow, so it is never a setting of its own
let rNet = 1.5, rBase = 4, rMargin = -0.30, attack = 'A';

// The three reach sliders, defined once: range, the scale that turns the slider's number into the live
// setting (metres, or whole percent for the margin) and how the readout prints it. syncReachUI() pushes
// all of it into the header, so editing the numbers above is enough and the HTML stays bare.
const REACH_SLIDERS = [
  {id:'rn', out:'rnv', min:0.5, max:3,  step:0.1, scale:1,    fmt:v => v.toFixed(1) + ' m', get:() => rNet,    set:v => rNet = v},
  {id:'rb', out:'rbv', min:1,   max:8,  step:0.1, scale:1,    fmt:v => v.toFixed(1) + ' m', get:() => rBase,   set:v => rBase = v},
  {id:'rm', out:'rmv', min:-60, max:-5, step:1,   scale:0.01, fmt:v => v + '%',             get:() => rMargin, set:v => rMargin = v},
];
let players = [];
function resetPlayers(){
  // Default: top team attacks; one player emits, forehand side only (right-handed: facing the net,
  // the top team's forehand is the screen-left end, the bottom team's is the screen-right end).
  // Each player keeps a fixed letter (top team A, B / bottom team C, D) drawn in his dot.
  players = [
    {letter:'A', team:'A', x:-2.9, y:-2.3, l:false, r:false}, {letter:'B', team:'A', x: 5.6, y:-12.9, l:true,  r:false},
    {letter:'C', team:'B', x:-3.2, y: 12.5, l:false, r:false}, {letter:'D', team:'B', x: 4.1, y: 2.2, l:false, r:true}
  ];
  for (const p of players) p.bcrleDir = null;   // US-BCRLE: no chosen axis until one is dragged out
  attack = 'A';
}
resetPlayers();

// ---- URL hash: the players' positions and who emits from which end travel in the fragment, so a
// link restores the whole court.
//   index.html#p-A2.23:-3.50;B2.00:2.00:R;C2.00:-1.00;D5.01:10.00
//   "p-" marks a court fragment, then one <letter><x>:<y>[:<dir>][:<side>] per player, metres, 2
//   decimals. The optional direction, printed 2 decimals like every angle here, is his US-BCRLE — the
//   reach axis he last dragged the S-BCP along (see bcRl) — and it is simply absent while he has none,
//   which is the default: without it his plan is chosen automatically. It outlives the ball leaving his
//   reach (the axis is not used while there is nothing to meet), and it is dropped — here and in the link
//   at once — only when he stops attacking: his partner meets the ball instead, or the ball is hidden.
//   The optional side is L or R
//   — his OWN left or right, facing the net — and names the end he emits from; a player without one
//   emits nothing. A number can never be read as a side nor a side as a number, so the order is free:
//     index.html#p-A2.23:-3.50:119.75:R;B2.00:2.00
//   The ball, while it is shown, adds one "b-" entry — its centre, the ball's speed in km/h and the
//   arrow's rotation in degrees — so the arrow travels with the link:
//     index.html#p-A2.23:-3.50;B2.00:2.00:R;b-0.00:6.50:90.0:303.70
//   ':' and ';' both work between those four numbers ("b-0.00;6.50;90.0;303.7"). Speed and rotation
//   are scale-free, so a link no longer depends on how long the arrow happens to be drawn: the arrow
//   is always 2 m of court per 50 km/h, at any zoom. The older tip form
//   "b:0.00:6.50:2.00:3.50" is still read — its tip becomes a speed and a rotation on the way in —
//   and a tip-less "b:0.00:6.50" places the ball and leaves the arrow pointing the way it already
//   does. A fragment with no ball entry hides the ball. The arrow's colour follows from the rotation
//   — which side of the net it points at, see arrowColor() — so a link restores that too. The court's
//   own settings ride in the same fragment as a separate "s-" entry (see SETTINGS below), so one link
//   restores the scene and every control that shapes it.
const HASH_TAG = 'p-';
// the ball's entry, wherever it sits in the fragment: "b-" then centre x, y, speed (km/h) and
// rotation (degrees). ':' and ';' both work between those four numbers, hence the mixed class.
const BALL_RE = /(?:^|;)\s*b\s*-\s*(-?\d+(?:\.\d+)?)\s*[:;]\s*(-?\d+(?:\.\d+)?)\s*[:;]\s*(-?\d+(?:\.\d+)?)\s*[:;]\s*(-?\d+(?:\.\d+)?)\s*(?=;|$)/i;
// the older tip form "b:x:y:tipx:tipy" (either separator, tip optional) is still read, so links made
// before the arrow became speed + rotation keep working; arrowFromTip() converts the tip.
const BALL_TIP_RE = /(?:^|;)\s*b\s*:\s*(-?\d+(?:\.\d+)?)\s*[:;]\s*(-?\d+(?:\.\d+)?)\s*(?:[:;]\s*(-?\d+(?:\.\d+)?)\s*[:;]\s*(-?\d+(?:\.\d+)?)\s*)?(?=;|$)/i;
// numbers in the fragment: d decimals, and never "-0.00"
const fmtNum = (v, d) => (Math.abs(v) < 0.5*Math.pow(10, -d) ? 0 : v).toFixed(d);
const fmtCoord = v => fmtNum(v, 2);                                 // metres, 2 decimals
const fmtVel = v => fmtNum(v, 1);                                   // km/h, 1 decimal
// degrees, 0 .. 359.99: the ball's rotation and the US-BCRLE direction alike. Two decimals, because one
// is coarser than the pointer that drew the angle — a tenth of a degree is a couple of centimetres at a
// metre of reach, enough to make a restored aim read differently from the one that was just dragged.
const fmtAngle = a => fmtNum(Math.round(normRot(a)*100)/100 % 360, 2);
const byLetter = L => players.find(p => p.letter === L);
// A faces the net with his right hand to screen-left, B with his right hand to screen-right, so
// fhSide() is exactly his right-hand side; his left is the mirror of it. Nothing lit = no suffix.
const sideOf = p => p.l === p.r ? '' : ((p.l ? -1 : 1) === fhSide(p) ? 'R' : 'L');
const entry = q => q.ball
  ? 'b-' + fmtCoord(q.x) + ':' + fmtCoord(q.y) + ':' + fmtVel(q.vel) + ':' + fmtAngle(q.rot)
  : q.letter + fmtCoord(q.x) + ':' + fmtCoord(q.y) +
    (q.dir != null ? ':' + fmtAngle(q.dir) : '') + (q.side ? ':' + q.side : '');
// the ball always comes last, so a fragment that puts it first still compares equal after applying
const canonical = list => HASH_TAG + list.slice()
  .sort((a, b) => (a.ball ? 1 : 0) - (b.ball ? 1 : 0)).map(entry).join(';');
const hashOf = () => canonical(
  players.map(p => ({letter: p.letter, x: p.x, y: p.y, dir: p.bcrleDir, side: sideOf(p)}))
    .concat(ball.on ? [{ball: true, x: ball.x, y: ball.y, vel: ball.vel, rot: ball.rot}] : []));
// the fragment as text, decoded ("" when there is none, or when it cannot be decoded)
function fragmentText(){
  try { return decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e){ return ''; }
}
// the court's part of a fragment, as a list of entries. The "p-" entry may sit anywhere in it and
// everything else — the settings entry, junk — is skipped, so a link's order is free.
function parseCourt(text){
  const all = text || '';
  const at = all.search(/(?:^|;)\s*p\s*-/i);
  if (at < 0) return [];                            // not ours: leave the court alone
  let raw = all.slice(at).replace(/^;?\s*p\s*-/i, '');
  const out = [];
  const bm = BALL_RE.exec(raw);                    // the ball entry is picked out first, so its "b"
  if (bm){                                         // can never be read as player B
    out.push({ball: true, x: +bm[1], y: +bm[2], vel: +bm[3], rot: +bm[4]});
    raw = raw.replace(BALL_RE, ';');               // ...and taken out of the player list
  } else {
    const bt = BALL_TIP_RE.exec(raw);              // an older link still carries the arrow's tip
    if (bt){
      const x = +bt[1], y = +bt[2];
      const r = bt[3] != null ? arrowFromTip(x, y, +bt[3], +bt[4]) : null;   // tip -> speed/rotation
      out.push({ball: true, x, y, vel: r ? r.vel : ball.vel, rot: r ? r.rot : ball.rot});
      raw = raw.replace(BALL_TIP_RE, ';');
    }
  }
  for (const part of raw.split(';')){
    const m = /^\s*([A-Za-z])\s*(-?\d+(?:\.\d+)?)\s*:\s*(-?\d+(?:\.\d+)?)\s*(?::\s*(-?\d+(?:\.\d+)?)\s*)?(?::\s*([LRlr])\s*)?$/.exec(part);
    if (m) out.push({letter: m[1].toUpperCase(), x: +m[2], y: +m[3],
                     dir: m[4] != null ? +m[4] : null, side: m[5] ? m[5].toUpperCase() : ''});
  }                                                                        // junk entries are skipped
  return out;
}
// the positions move; the lit ends and the US-BCRLE directions come from the fragment alone (no suffix =
// that player emits nothing, no direction = he plans automatically), while letters, teams and who is
// attacking stay as they are. The ball is the fragment's too: a "b:" entry shows it with that arrow, and
// its absence hides it.
function applyCourt(text){
  const all = parseCourt(text);
  const hits = all.filter(q => !q.ball && byLetter(q.letter));
  const b = all.find(q => q.ball);
  if (!hits.length && !b) return false;
  clearBeams();
  for (const q of hits){
    const p = byLetter(q.letter);
    p.x = q.x; p.y = q.y; p.bcrleDir = q.dir;      // the link's direction replaces whatever he had, null too
    if (q.side){
      const ws = q.side === 'R' ? fhSide(p) : -fhSide(p);   // his right / his left as a world-x sign
      p.l = ws < 0; p.r = ws > 0;
    }
  }
  if (b){
    ball.on = true;
    ball.x = b.x; ball.y = b.y;
    ball.vel = clampVel(b.vel); ball.rot = normRot(b.rot);   // the arrow is speed + rotation
  } else {
    ball.on = false;
  }
  syncBallUI();
  return true;
}
// the whole fragment: the court, then the settings. One link therefore carries the scene AND the
// controls, and a saved game stores exactly the same two pieces of text.
function fullHash(){ return hashOf() + ';' + settingsFragment(); }

// ---- is the link the game that is already on court?
// The digest of one state string, SHA-256 from the browser's own SubtleCrypto. A plain-http origin is not
// a secure context and has no crypto.subtle; there, and if a digest is ever refused, the two strings are
// compared as they are — the same comparison on the same text, since both sides come out of fullHash().
function digest(text){
  const sub = globalThis.crypto && globalThis.crypto.subtle;
  if (!sub) return Promise.resolve(text);
  return sub.digest('SHA-256', new TextEncoder().encode(text))
    .then(buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join(''),
          () => text);
}
// two states compared by digest: "is this the same scene?" is then one comparison of hex strings
const sameDigest = (a, b) => Promise.all([digest(a), digest(b)]).then(([x, y]) => x === y);
// The digests are taken of the game's own hash — what the court says — laid side by side around the
// link: one before the link is applied and one after, so equal digests are the answer to "is this game
// already that scene?". A paste that only shuffles or pads entries changes nothing and compares equal.
// replaceState keeps the back button clean; file:// may refuse it, so fall back to the fragment itself.
// Every write also refreshes the active game's record — a drag, a tap or a slider is a save.
function writeHash(){
  markDirty();
  const h = fullHash();
  if (location.hash.replace(/^#/, '') === h) return;
  try { history.replaceState(null, '', '#' + h); }
  catch (e){ location.replace('#' + h); }
}
// one URL write per ~60 ms at most, however fast the pointer moves. A timer, not a frame: sliders are
// often moved in a window that is not being painted, and a queued frame would never be drawn there.
let hashTimer = 0;
function scheduleHash(){
  if (hashTimer) return;
  hashTimer = setTimeout(() => { hashTimer = 0; writeHash(); }, 60);
}
// A fragment pasted into an open tab is a link like any other, and a link is a scene of its own: it never
// takes over the game on court. It is laid on the court, the game's own hash is read back, and the two are
// compared by digest — equal means the link says nothing this game does not already say, so the page does
// what a reload would do and only the URL is re-spelled canonically. Different means the link is a scene of
// its own: it gets a game of its own and takes the court, while the game that was active keeps its record
// and its court. A first visit is the one exception — boot has just made its game and there is no saved
// work to protect, so `fresh` lets the link land in that game.
async function openLink(link, fresh){
  const live = fullHash();                    // the current game, as a reload of it would restore it
  const courtHit = applyCourt(link);
  const setHit = applySettingsText(settingsOf(link));
  if (!courtHit && !setHit) return false;     // nothing of ours in the fragment: the court is left alone
  const merged = fullHash();                  // ...and the state the link asks for on this court
  if (await sameDigest(live, merged)){ writeHash(); return false; }   // the same scene: nothing happened
  if (!fresh){
    // the game that was on court is the user's and keeps its record; the link gets a game of its own,
    // applied a second time because createGame() has just put the default scene under it.
    createGame(); applyCourt(link); applySettingsText(settingsOf(link));
  }
  writeHash();                                // the link is that game's state now, and the link says so
  status(); draw();
  return true;
}
// Our own writes arrive here as well where replaceState is refused (the file:// fallback), and then the
// fragment is exactly the live state, which is what that early return recognises.
window.addEventListener('hashchange', () => {
  if (drag) return;          // mid-drag the pointer owns the position and our own writes are stale
  const raw = fragmentText();
  if (raw === fullHash()) return;
  markDirty();               // the record catches up with the court before anything is compared to it
  openLink(raw, false);
});

// ---- settings in the fragment
// A setting is what shapes the scene rather than the court: the three reach numbers and the four
// display controls. They travel like the court does — one "<key>:<value>" token each, keyed by the
// first letters of its name, joined by ';' behind an "s-" tag — so a link carries them too and a saved
// game holds exactly the text a link would:
//   #p-A2.23:-3.50;B2.00:2.00;b-0.00:6.50:90.0:303.70;s-dvr:1.5;rps:4.0;fbrm:-30;ddm:Y;sb:Y;bs:11;aw:4
//     dvr  Dynamic Volley Reach        rps  Reach per side (groundstroke)
//     fbrm Fast balls reach margin     ddm  Display delta marker
//     sb   Show ball                   bs   Ball size, CSS px
//     aw   Arrow width, CSS px
// The values are printed the way the readouts print them (even-odd: one decimal for metres, whole
// percent for the margin, Y/N for the boxes) and read back through each control's own range, so a
// hand-edited link can never push a slider past its ends. Order is free and unknown keys are ignored,
// which is what lets an older link open in a newer page.
const SETTINGS_TAG = 's-';
// a number from a fragment, clamped into its control's track; null (keep what is there) when it is junk
function numIn(text, lo, hi){
  const n = parseFloat(text);
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : null;
}
const SETTINGS = [
  {key:'dvr',  name:'Dynamic Volley Reach',    get: () => fmtNum(rNet, 1),
   set:s => { const v = numIn(s, 0.5, 3);   if (v != null) rNet = v; }},
  {key:'rps',  name:'Reach per side',          get: () => fmtNum(rBase, 1),
   set:s => { const v = numIn(s, 1, 8);     if (v != null) rBase = v; }},
  {key:'fbrm', name:'Fast balls reach margin', get: () => fmtNum(rMargin*100, 0),
   set:s => { const v = numIn(s, -60, -5);  if (v != null) rMargin = v/100; }},
  {key:'ddm',  name:'Display delta marker',    get: () => deltaOn ? 'Y' : 'N',
   set:s => { deltaOn = /^y/i.test(s); }},
  {key:'sb',   name:'Show ball',               get: () => ball.on ? 'Y' : 'N',
   set:s => { ball.on = /^y/i.test(s); }},
  {key:'bs',   name:'Ball size',               get: () => String(Math.round(ball.px)),
   set:s => { const v = numIn(s, 3, 40);    if (v != null) ball.px = Math.round(v); }},
  {key:'aw',   name:'Arrow width',             get: () => String(Math.round(arrowW)),
   set:s => { const v = numIn(s, 2, 12);    if (v != null) arrowW = Math.round(v); }},
];
function settingsText(){ return SETTINGS.map(q => q.key + ':' + q.get()).join(';'); }
function settingsFragment(){ return SETTINGS_TAG + settingsText(); }
// the settings part of a whole fragment, wherever its "s-" entry sits ("" when there is none). The
// court's entries can never look like it: none of their letters is an "s".
function settingsOf(text){
  const m = /(?:^|;)\s*s\s*-/i.exec(text || '');
  return m ? text.slice(m.index).replace(/^;?\s*s\s*-/i, '') : '';
}
// read a settings fragment into the live settings; true when at least one setting was recognised
function applySettingsText(text){
  if (!text) return false;
  let hit = false;
  for (const part of text.split(';')){
    const m = /^\s*([a-z]+)\s*:\s*([^\s;]+)\s*$/i.exec(part);
    if (!m) continue;
    const q = SETTINGS.find(k => k.key === m[1].toLowerCase());
    if (!q) continue;
    q.set(m[2]); hit = true;
  }
  if (hit) syncSettingsUI();
  return hit;
}

// ---- saved games
// localStorage holds the list of games and which one is active. A game is a name plus the two pieces
// of text a link is made of — its court ("p-...") and its settings ("s-...") — so restoring one is
// literally opening a link, and there is no second copy of the scene to keep in step.
const STORE_KEY = 'tennis:games:v1';
let games = [], activeId = null;
const activeGame = () => games.find(g => g.id === activeId) || null;
let saveTimer = 0;
function saveStore(){
  if (saveTimer){ clearTimeout(saveTimer); saveTimer = 0; }
  try { localStorage.setItem(STORE_KEY, JSON.stringify({active: activeId, games})); }
  catch (e){ /* private mode or a full quota: the session still works, it just is not remembered */ }
}
// a drag rewrites the record every frame, so the write itself waits for the pointer to rest; pagehide
// gives it the last word before the tab goes away
function saveSoon(){
  if (saveTimer) return;
  saveTimer = setTimeout(saveStore, 150);
}
window.addEventListener('pagehide', saveStore);
// the active game's text follows the live court and settings; every writeHash() lands here
function markDirty(){
  const g = activeGame();
  if (!g) return;
  g.pos = hashOf(); g.set = settingsFragment();
  saveSoon();
}
function loadStore(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e){ return false; }
  if (!raw || !Array.isArray(raw.games)) return false;
  games = raw.games.filter(g => g && g.id && typeof g.pos === 'string')
    .map(g => ({id: String(g.id), name: String(g.name || 'Game'), pos: g.pos,
                set: typeof g.set === 'string' ? g.set : ''}));
  if (!games.length) return false;
  activeId = games.some(g => g.id === raw.active) ? raw.active : games[0].id;
  return true;
}
const newGameId = () => 'g' + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);

// a fresh game opens on the page's own default scene: the players where resetPlayers puts them, the
// ball hidden at its starting spot, every setting back at its constant — the scene a first-ever visit
// shows. A stored game is the opposite: its two fragments, put back exactly as a link would.
function resetScene(){
  resetPlayers();
  ball.on = false; ball.x = 0; ball.y = 6.5; ball.vel = 90; ball.rot = 303.7;
  ball.px = BALL_PX; rNet = 1.5; rBase = 4; rMargin = -0.30;
  deltaOn = false; arrowW = BALL_ARROW_W;
  syncSettingsUI();
}
function restoreGame(g){
  if (!g) return false;
  applyCourt(g.pos);                    // also places the ball and lights the emitting ends
  applySettingsText(settingsOf(g.set));  // the record holds the whole "s-..." fragment, tag and all
  syncSettingsUI();
  return true;
}
// A new game takes the first number nobody is using, so "Game 3" is never handed out twice: deleting
// game 2 does not make the game after it a second "Game 3", and a name moved off the pattern frees its
// number up again. The comparison is case- and space-insensitive, so a hand-typed "game 3" counts too.
function newGameName(){
  const taken = new Set(games.map(g => g.name.trim().toLowerCase()));
  let n = 1;
  while (taken.has('game ' + n)) n++;
  return 'Game ' + n;
}
function createGame(){
  resetScene();
  const g = {id: newGameId(), name: newGameName(),
             pos: hashOf(), set: settingsFragment()};
  games.push(g);
  activeId = g.id;                      // a new game is the one on court, always
  renderGames(); saveStore();
  return g;
}
// The lit dot and aria-current follow activeId without rebuilding the rows. Rebuilding would replace the
// very element the tap landed on, and the second half of a double click would then arrive on a detached
// button: a pointerup on a node that is no longer in the page never reaches #games at all, so the
// rename would silently not happen.
function paintActive(){
  for (const li of gameList.children){
    const on = li.dataset.id === activeId;
    if (on){ li.dataset.active = 'true'; li.setAttribute('aria-current', 'true'); }
    else { delete li.dataset.active; li.removeAttribute('aria-current'); }
  }
  syncGameName();
}
// a tap on a row loads that game; the link follows it, since the link always shows what is on court
function activateGame(id){
  const g = games.find(q => q.id === id);
  if (!g) return false;
  if (id !== activeId){ activeId = id; restoreGame(g); }
  paintActive(); saveStore();
  writeHash();
  status(); draw();
  return true;
}
const gameList = document.getElementById('games');
// the bin's icon, in the page's own stroke style; it carries no text, so the button names itself with
// an aria-label instead (see renderGames)
const TRASH_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
  '<path d="M4 7h16M10 4h4M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';
function renderGames(){
  gameList.textContent = '';
  for (const g of games){
    const li = document.createElement('li');
    li.className = 'game'; li.dataset.id = g.id;
    if (g.id === activeId){ li.dataset.active = 'true'; li.setAttribute('aria-current', 'true'); }
    // The name is a button, not a field: one tap (or Enter) opens the game and only a double tap (or
    // F2) swaps it for a text field, so simply opening a game can never leave you typing in its name.
    const name = document.createElement('button');
    name.type = 'button'; name.className = 'gname';
    name.textContent = g.name; name.title = 'Double tap to rename';
    li.appendChild(name);
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'gdel';
    del.innerHTML = TRASH_SVG;
    del.setAttribute('aria-label', 'Delete ' + g.name); del.title = 'Delete ' + g.name;
    li.appendChild(del);
    gameList.appendChild(li);
  }
  syncGameName();                 // the Game tab's head always names the game on court
}
// A double tap swaps the name button for a field in place. Enter or leaving the field commits the new
// name, Escape drops it; the list re-renders either way, so the button comes back with whatever won.
// The row is found again from the game's id rather than trusted from the event: whatever happened to
// the element the tap landed on, the field always goes into the row that is in the page now.
function startRename(g){
  const li = [...gameList.children].find(r => r.dataset.id === g.id);
  if (!li) return;
  const btn = li.querySelector('button.gname');
  if (!btn) return;                              // already editing this row
  const field = document.createElement('input');
  field.type = 'text'; field.className = 'gname'; field.value = g.name;
  field.setAttribute('aria-label', 'Game name');
  btn.replaceWith(field);
  field.focus(); field.select();
  let done = false;
  const finish = keep => {
    if (done) return; done = true;
    const t = field.value.trim();
    if (keep && t) g.name = t;                   // a name cleared by accident keeps the old one
    saveStore(); renderGames();
  };
  field.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  field.addEventListener('blur', () => finish(true));
}
// The bin takes the game out of the store. If it was the one on court, the next game in the list
// inherits the court (the one before it, when the deleted game was last), and if it was the only game a
// fresh Game 1 appears in its place: the list always holds the game the court is showing.
function deleteGame(g){
  const at = games.indexOf(g);
  if (at < 0) return;
  games.splice(at, 1);
  if (g.id === activeId){
    activeId = null;
    const next = games[Math.min(at, games.length - 1)];
    if (next){ activeId = next.id; restoreGame(next); }
  }
  if (!games.length) createGame();
  renderGames(); saveStore();
  writeHash(); status(); draw();
}
// A tap opens the game it lands on, two taps in quick succession rename it instead. Pointer events
// rather than click/dblclick: a double tap on a phone is not a reliable dblclick, and this way a
// mouse, a finger and a pen all take the same path. Ids are read off the row's data, not the element,
// so a re-render in the middle of the gesture cannot confuse it.
const DOUBLE_MS = 350, DOUBLE_PX = 30;
let lastTap = {id: '', at: 0, x: 0, y: 0};
gameList.addEventListener('pointerup', e => {
  const li = e.target.closest('.game');
  if (!li) return;
  const g = games.find(q => q.id === li.dataset.id);
  if (!g) return;
  if (e.target.closest('.gdel')){ deleteGame(g); return; }   // the bin acts at once, no tap counting
  if (e.target.closest('input')) return;                     // the name field owns its own taps
  const now = performance.now();
  const dbl = lastTap.id === g.id && now - lastTap.at < DOUBLE_MS &&
              Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < DOUBLE_PX;
  lastTap = {id: g.id, at: now, x: e.clientX, y: e.clientY};
  if (dbl) startRename(g);
  else activateGame(g.id);
});
// A desktop double click arrives as a dblclick of its own, which is more reliable than counting the two
// pointerups ourselves; it is the same rename, and if the pointerup count already opened the field this
// finds no button left to swap and does nothing. Touch screens never send dblclick, so the count above
// stays the path there.
gameList.addEventListener('dblclick', e => {
  const li = e.target.closest('.game');
  if (!li || e.target.closest('.gdel') || e.target.closest('input')) return;
  const g = games.find(q => q.id === li.dataset.id);
  if (g) startRename(g);
});
// the same three actions from the keyboard: Enter opens, F2 renames, and the bin deletes
gameList.addEventListener('keydown', e => {
  const li = e.target.closest('.game');
  if (!li) return;
  const g = games.find(q => q.id === li.dataset.id);
  if (!g || e.target.closest('input')) return;
  if (e.key === 'F2'){ e.preventDefault(); startRename(g); }
  else if (e.key === 'Enter' || e.key === ' '){
    e.preventDefault();                     // a button would fire a click of its own as well
    if (e.target.closest('.gdel')) deleteGame(g); else activateGame(g.id);
  }
});
document.getElementById('newGame').addEventListener('click', () => {
  createGame();
  writeHash();               // the new game's default court goes into the link at once
  status(); draw();
});
// the stored list (true), or the very first game on a first visit (false) — resetPlayers() has already
// put the default scene on the court, so Game 1 simply records it
function initGames(){
  if (loadStore()){ restoreGame(activeGame()); renderGames(); return true; }
  games = []; activeId = null;
  createGame();
  return false;
}

// ---- defender reach
// net mode: a defender closer to the net than this (1/4 of the net-to-baseline distance)
const NET_MODE_Y = CL/8;
const inNetMode = q => Math.abs(q.y) < NET_MODE_Y;

// Static wingspan: an average player's shoulder-to-racket-tip reach is about 1 m per side without
// moving his feet, i.e. 2 m across. It is the tight end of the net defender's reach (attacker on top
// of him) and, through that volley reach, the tight end of every groundstroke zone as well.
const STATIC_WINGSPAN = 2.0;             // metres, both sides together
const STATIC_REACH = STATIC_WINGSPAN/2;  // metres, per side

// Every player distance here is head dot to head dot: a plain distance between two points on the
// court (each player's x, y).
const headDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// A net defender's reach per side: exactly "Dynamic Volley Reach" when the attacker is half a court
// length away and exactly the static wingspan when the attacker is on top of him, linear in between
// and extrapolated outside. An attacker inside the court keeps it below the setting; an attacker
// farther back than his own baseline pushes it past the setting.
const volleyReach = d => STATIC_REACH + (rNet - STATIC_REACH) * (d / (CL/2));

// How far along the line from the attacker to the defender the defender has to travel before the wide
// groundstroke zone reaches rBase. Its other end has not moved: t = 0 is still the net-mode edge, where
// the zone is exactly the net defender's volley reach. So t = 0 when the defender stands on that edge
// and t = 1 when the true attacker-to-defender distance is a full court length CL (held at 1 beyond).
// Both the edge crossing and the distance are true distances along the line connecting the two players,
// never the defender's own baseline and never a projection of it.
function reachRamp(src, q, d){
  if (d >= CL) return 1;                     // a full court length away (or more): exactly rBase
  const dy = q.y - src.y;
  let s = 0;                                 // level line: no edge crossing, measure from the attacker
  if (Math.abs(dy) > 1e-9){
    s = ((q.y > 0 ? 1 : -1) * NET_MODE_Y - src.y) * d / dy;   // attacker -> edge on the defender's side
    s = Math.max(0, Math.min(d, s));         // edge behind the attacker or past the defender: clamp
  }
  return Math.max(0, Math.min(1, (d - s) / (CL - s)));
}

// A groundstroker's wide reach per side, metres: the volley reach at the net-mode edge, opening to
// exactly rBase when the attacker is a full court length away, walking along the line between the two
// players (see reachRamp). The attacker's point src is what the distance is measured from.
const groundReach = (src, q) => {
  const d = headDist(src, q);
  const edge = volleyReach(d);
  return edge + (rBase - edge) * reachRamp(src, q, d);
};

// One source lights at a time — a tap clears every other dot first — so there is a single attacker:
// the player whose forehand/backhand dot is on, and he alone sizes a defender. His partner never
// does. Before any dot is tapped nobody is attacking yet, so the nearest attacker stands in for him.
// In ball mode nobody taps at all: the arrow picks the attacking team and the ball's own path picks
// the hitter, his side and the point he hits from (see ballHitter below).
const isEmitting = p => p.l || p.r;
function attacker(){
  if (ball.on){ const h = ballHitter(); return h ? h.p : null; }
  return players.find(p => p.team === attack && isEmitting(p)) || null;
}
function nearestAttacker(q){
  let best = null, bd = Infinity;
  for (const a of players) if (a.team === attackTeam()){
    const d = headDist(a, q);
    if (d < bd){ bd = d; best = a; }
  }
  return best;               // a team always fields two players, so this stays non-null
}
// The point a defender's shadow is measured from: the attacker who is actually hitting, or — before any
// dot is tapped — his nearest teammate. In ball mode that is the hitter the arrow points at (attacker()
// asks ballHitter), so the line, the shadow and the hitting point all use one source.
const defenderSource = q => attacker() || nearestAttacker(q);
// in net mode a defender has a single zone, the volley reach. Outside it his wide groundstroke zone
// runs from that same volley reach on the net-mode edge to rBase when the attacker is a full court
// length away along the line between the two players (see reachRamp), and his fast ball zone is simply
// that width cut by the margin: no interpolation of its own, so the dark shadow stays exactly the same
// percentage narrower than the wide one wherever he stands.
const reachFromSource = (src, q) => inNetMode(q) ? volleyReach(headDist(src, q)) : groundReach(src, q);
const defenderReach = q => reachFromSource(defenderSource(q), q);
// A ball-mode player's arc uses the very same defensive reach rules, with the incoming ball standing
// in for the attacker: the arc tightens as the ball closes in and opens out to the groundstroke reach
// while the ball is still a full court length away. It is the "lighter shadow" width, so no
// fast-ball margin here.
const arcReach = p => Math.max(0, reachFromSource(ball, p));
// The margin is taken off each side of the wide reach, so -0.15 leaves 85% of it on the forehand side
// and 85% on the backhand side — the dark shadow's whole width is 85% of the wide one, and shortening
// the reach by a percentage rather than a fixed number of metres keeps that ratio wherever he stands.
const fastReach = q => { const r = defenderReach(q); return r + r * rMargin; };

// ---- MBCR (Maximum Ball Contact Reach): the reach the ball's own flight time allows, in metres.
//      The player's speed is the same for everyone and follows from the court — while the ball flies
//      the court's diagonal he crosses from the edge of his wingspan to the singles sideline — so Vp
//      is a constant and only the flight time changes anything. Vb0 is the reference ball speed the
//      formula is calibrated on. A slow ball therefore gives him more time, never more speed.
const VB0 = 85;                                                             // km/h, reference ball speed
const VP  = VB0 * ((SINGLES/2 - STATIC_REACH) / Math.hypot(CL, SINGLES/2));  // km/h, ≈ 10.98
// The footwork the flight buys him: Dp = Vp * (dball / Vball), metres, for a BPCP dball metres down the
// arrow. The wingspan is not in it — this is how far he can get, not what he can reach once he is
// there — so it is also the radius of the circle his partner covers before the ball is met.
const travelBy = dball => VP * (dball / Math.max(1e-6, ball.vel));
// The reach for a BPCP dball metres down the arrow — the length of the BCRL that ends there: his
// footwork Dp = Vp*(dball/Vball) plus exactly one static wingspan, i.e. Dp + STATIC_REACH.
const mbcrLen = dball => STATIC_REACH + travelBy(dball);

// The BPCP that levels with p: where the arrow's ray crosses p's own reach line, parallel to the net.
// That is the last BPCP he can still meet the ball on — his front half ends there, exactly where the
// example's sweep stops — and it is the one the lateral BCRL is drawn to. Only ahead of the ball: a level
// arrow, or a path already past him, names no such point (null).
function levelBPCP(p, ray){
  if (Math.abs(ray.uy) < 1e-9) return null;
  const dball = (p.y - ray.y) / ray.uy;
  if (!(dball > 0)) return null;
  return {dball, x: ray.x + ray.ux*dball, y: p.y};
}

// The hitting window (HWS): the stretch of the arrow's path between the two BCRP-Es, i.e. the part of
// the BTL inside p's MBCR reach. It is the two BPCPs where the ball's own
// distance from him equals the reach the flight has bought him by then, i.e. where the path crosses the
// MPRC itself. Those are the BCRP-Es — the earliest and the latest BPCP he can possibly meet — and both
// of them sit exactly on the BTL. They are the roots of
//     |ball + s*u - p|² = mbcrLen(s)²,
// a quadratic in s because both sides grow linearly with the distance flown. The path is inside his
// reach between the roots and outside it everywhere else, so a near miss gives a short window and a
// path passing him closely gives a long one that runs on behind him. null when the path never comes
// inside his reach at all (no real root — the near miss in the screenshot — or only behind the ball).
function mbcrWindow(p, ray){
  const k = VP / Math.max(1e-6, ball.vel);            // metres of footwork per metre of ball flight
  const ox = ray.x - p.x, oy = ray.y - p.y;           // the ball, from his centre
  const A = 1 - k*k;                                  // k = 1 exactly: reach grows as fast as the ball
  const B = 2*((ox*ray.ux + oy*ray.uy) - STATIC_REACH*k);
  const C = ox*ox + oy*oy - STATIC_REACH*STATIC_REACH;
  if (Math.abs(A) < 1e-9){
    if (Math.abs(B) < 1e-9) return C <= 0 ? {s1: 0, s2: Infinity} : null;
    const r = -C/B;                                   // one root: inside on one side of it only
    if (B > 0) return r > 0 ? {s1: 0, s2: r} : null;
    return {s1: Math.max(0, r), s2: Infinity};
  }
  const disc = B*B - 4*A*C;
  if (disc < 0) return null;                          // the path never comes inside his reach
  const rt = Math.sqrt(disc), r1 = (-B - rt)/(2*A), r2 = (-B + rt)/(2*A);
  // k < 1: the ball is the faster of the two, so the reach catches up and is then left behind again —
  // inside between the roots. k > 1 (a very slow ball) is the other way round: once he is level with it
  // he stays with it, so everything past the far root is inside.
  const lo = A > 0 ? Math.min(r1, r2) : Math.max(r1, r2);
  const hi = A > 0 ? Math.max(r1, r2) : Infinity;
  if (hi <= 0) return null;                           // the whole window is behind the ball
  return {s1: Math.max(0, lo), s2: hi};
}

// Where he meets the ball is read off the reach line that is actually drawn, never solved on its own
// (bcRl, below): the BPCP his US-BCRLE reaches, the level BPCP the S-BCRL meets head on, the BCRP-E a
// BCRL-E ends on, or — when the flight misses him — the tip of the S-BCRL-U. One model, so the contact dot,
// the beams that start there and the line can never name different places. A contact of its own did exactly
// that: clamped into the hitting window it landed on the FAR BCRP-E in the screenshot while the drawn line
// ended on the near one, and its opaque dot then painted over the faded one that BCRP-E is supposed to keep.


// The MPRC (maximum player reaching curve): the tip of the BCRLE for every direction he can sweep — the
// envelope of every possible reach line — sampled the way the example does it: sweep the ANGLE about p,
// uniformly, and for each ray solve where it crosses the ball's path. That crossing gives the BPCP's
// distance along the BTL, never its distance from p, so the sample is p + (cos θ, sin θ) * L(s). Sweeping
// the angle instead of the distance is what keeps the curve smooth: where the path runs close to p a
// short stretch of it swings through a wide arc of directions, and a distance- or time-uniform sweep
// jumps across that arc in a single step (a chord cut clean across the envelope). Angle steps are
// bounded, so they follow the swing instead. A ray parallel to the arrow names no crossing and is
// skipped.
//
// The sweep covers the hitting window (mbcrWindow): the BTL from the ball to the far BCRP-E, so it runs
// continuously from right beside him out to where the ball leaves his reach for good. The curve is drawn
// from the player himself: its first point is his centre, then his wingspan circle in the direction of the
// ball — the ball's own BPCP, s = 0, where his reach is exactly STATIC_REACH — and the envelope only after
// that, as the example's sweep also starts at the direction to the ball. Its last sample is the far BCRP-E, on
// the BTL, unless the ball is
// level with him before that: the curve always ends on the BCRL tip it is drawn to — the far edge's or
// the level BPCP's, whichever comes later — and never short of the level line. The near BCRP-E is NOT an
// end: the ball is normally still outside his reach at s = 0 and only comes inside it at win.s1, but
// stopping the sweep there would cut the curve off out in the court and leave it floating away from the
// player. A path that never enters his reach has no far BCRP-E at all: the sweep then runs out to the
// level BPCP, or to the screen edge when no such BPCP exists, so that end may sit off the BTL, since
// nothing of that flight can be met. The level BPCP is the end even when it lies beyond the screen edge,
// because the BCRL tip it names sits on his reach line, much nearer than the BPCP (the reach grows
// slower than the flight), and can be on screen while the BPCP that names it is not.
function mprc(p){
  const ray = ballRay(), c = toPx(ball);
  const exit = Math.max(0, edgeReach(c.x, c.y, ray.ux, ray.uy)/s);   // metres, ball -> screen edge
  const lv = levelBPCP(p, ray);
  const win = mbcrWindow(p, ray);                                    // the hitting window, or null
  const sA = 0;                                                      // start at the ball's own BPCP
  // Out to the far edge, but never short of the BPCP that levels with him. Two ways the sweep could stop
  // first, and both would leave the curve hanging below the reach line while the plan point sits on it:
  // a ball that enters his reach early can leave it again before it is level, and even a ball he never
  // reaches can run off the screen before it levels (the BPCP is on the flight, the BCRL tip is on his
  // reach line, and the reach grows slower than the flight, so the dot can be on screen while the BPCP
  // that names it is not). Sweeping on to the level BPCP makes the last sample land exactly on that dot
  // (same direction, same mbcrLen); when the ball stays in reach past the level line, the far edge is the
  // later end and the sweep still runs out to it, with the screen edge as the bound when there is no
  // level BPCP at all.
  const reachEnd = win ? win.s2 : (lv ? lv.dball : exit);       // where the ball leaves his reach
  const screenEnd = Math.min(reachEnd, exit);                   // ... clipped to the screen
  const sB = lv ? Math.max(screenEnd, lv.dball) : screenEnd;    // ... but never short of the level line
  // The two BCRP-Es are named by the crossings of the BTL with this curve (mbcrWindow); the curve runs
  // from the ball out past both of them, so both dots sit on the samples drawn here.
  const a0 = Math.atan2(ray.y + ray.uy*sA - p.y, ray.x + ray.ux*sA - p.x);   // direction to the first
  const a1 = Math.atan2(ray.y + ray.uy*sB - p.y, ray.x + ray.ux*sB - p.x);   // ... and to the last
  let da = a1 - a0;                                                  // the short way round
  while (da >  Math.PI) da -= 2*Math.PI;
  while (da < -Math.PI) da += 2*Math.PI;

  // A path straight away from or straight at him spans no angle at all: every BPCP lies on one ray, so
  // the envelope is that ray's own stretch, r = mbcrLen(s) for s from the first BPCP to the last.
  // There is no direction to spread samples over, so sample that one ray by distance instead.
  if (Math.abs(da) < 1e-4){
    const pts = [], N = 48;
    for (let i = 0; i <= N; i++){
      const s2 = sA + (sB - sA)*i/N, bx = ray.x + ray.ux*s2, by = ray.y + ray.uy*s2;
      const dx = bx - p.x, dy = by - p.y, d = Math.hypot(dx, dy);
      if (d < 1e-6) continue;
      const L = mbcrLen(s2);
      pts.push({x: p.x + dx/d*L, y: p.y + dy/d*L});
    }
    // ... and from him: the centre first, then the one ray's stretch (see the notes above).
    pts.unshift({x: p.x, y: p.y});
    return {pts, lv, win, exit, ray, sB};
  }

  const steps = Math.max(10, Math.round(Math.abs(da)*200));          // uniform in angle: ~200 per radian
  const pts = [];
  // The tip for one direction: where the ray from him meets the flight, and the reach the flight buys there.
  const at = th => {
    const cx = Math.cos(th), cy = Math.sin(th);
    const den = cx*ray.uy - cy*ray.ux;                        // the ray against the arrow's direction
    if (Math.abs(den) < 1e-9) return null;                    // parallel to the path: no crossing
    const u = ((ray.x - p.x)*ray.uy - (ray.y - p.y)*ray.ux) / den;   // p -> BPCP, metres
    if (!(u >= 0)) return null;                               // the crossing lies behind him
    const s2 = (p.x + cx*u - ray.x)*ray.ux + (p.y + cy*u - ray.y)*ray.uy;  // ball -> BPCP, metres
    if (s2 < sA - 1e-6 || s2 > sB + 1e-6) return null;        // outside the stretch the sweep covers
    const L = mbcrLen(s2);
    return {x: p.x + cx*L, y: p.y + cy*L};                    // the BCRL tip for that direction
  };
  // Sampling in angle is only even near him: for a ray that runs almost along the flight a small turn moves
  // the BPCP a long way up the path, so the reach changes very fast and a fixed grid would cut a chord clean
  // across that spike instead of following it. Any step whose ends are further apart than MAX_CHORD is
  // bisected in angle until it is not, so the drawn curve follows the envelope wherever it bends hardest.
  const MAX_CHORD = 0.18;                                     // metres, the longest step the curve may take
  const walk = (th0, th1, depth) => {
    const q1 = at(th1);
    if (!q1) return;
    const q0 = pts[pts.length-1];
    if (q0 && Math.hypot(q1.x - q0.x, q1.y - q0.y) > MAX_CHORD && depth < 9){
      const tm = (th0 + th1)/2;
      if (at(tm)){ walk(th0, tm, depth+1); walk(tm, th1, depth+1); return; }
    }
    pts.push(q1);
  };
  const first = at(a0);
  if (first) pts.push(first);                                 // the sweep's own first sample
  for (let i = 0; i < steps; i++) walk(a0 + da*i/steps, a0 + da*(i+1)/steps, 0);
  // The curve begins at the player himself, not a reach off him: the first point is his centre, and the
  // next one is the envelope's first sample — the ball's own BPCP, where the reach is STATIC_REACH. The
  // envelope never comes inside STATIC_REACH, so without the centre the sweep would hang in the air beside
  // him, touching nothing.
  pts.unshift({x: p.x, y: p.y});
  return {pts, lv, win, exit, ray, sB};
}

// ---- BCRL: which reach line is the selected one ------------------------------------------------
// BCRLE (ball contact reach line extension) is any segment from p's centre out to a point of his MPRC.
// BCRL (ball contact reach line) is the part of a BCRLE from the centre up to where it crosses the BTL:
// the reach that really meets the ball. Every term here carries its direction as a postfix — -L lateral,
// -E edge, -U unreachable. Where the BCRLE ends on the BTL itself the two are the same segment — a BCRL-E
// (edge BCRL) — and its tip is a BCRP-E (edge ball contact reach point), one of the at most two points of
// the flight he can just reach. Only one direction is ever drawn, the S-BCRLE (selected BCRLE):
//   the US-BCRLE first, when he has one: the axis the user left behind by dragging his S-BCP inside the
//     HWS. An explicit choice beats every automatic one, and it is kept inside the HWS by construction
//     (the drag clamps it, bcRl snaps it onto the edge a moved ball pushed it through), so the line always
//     meets the ball. A flight that drifts out of his reach does not destroy it: the axis is simply not
//     used while there is nothing to meet, and it is still there when the ball comes back. Only when he
//     stops attacking — the flight is coming to his partner, so the shaded NAPRZ circle is drawn around him
//     instead — or the ball is hidden, is it null again and the choice below made for him (pruneDir);
//   S-BCRLE-L, the lateral one (horizontal, parallel to the net), when the ball is inside his reach at the
//     moment it levels with him: that is the line he meets the ball head-on on, so it beats the edges.
//     Its BCRLE runs on to the MPRC and its BCRL stops on the level BPCP;
//   otherwise the shorter of the two BCRL-Es: the nearest BCRP-E, the earliest point on the flight he can
//     meet. mbcrLen grows with dball, so the shorter line is simply the smaller s. Both BCRP-Es are still
//     dotted (below); the one this line does not end on is the faded one;
//   no BCRP-E at all: S-BCRL-U (unreachable), perpendicular to the BTL — the shortest way toward a flight
//     he cannot touch — ending on the MPRC where that direction's reach runs out, or on the MCL when that
//     reach would carry it across the net, with a faded dot on that tip: it is a place he could stretch
//     to, not one where the ball ever is.
// Returns {tip, ball, edge, edges, dball}: tip is on the MPRC (the reach the flight buys him), ball is
// where the line crosses the BTL (null for S-BCRL-U), edge is the BTL distance of a BCRL-E tip (null when
// the tip is not on the BTL), edges lists every BCRP-E's BTL distance, and dball is how far down the BTL
// the contact sits — the flight he has to wait for, which the contact dot, the beams and his partner's
// circle are all measured on. Every one of them comes from this single call, so the drawn line and the
// place he meets the ball cannot drift apart.

// The stretch of the HWS that lies on his own side of the MCL, in metres along the BTL. Every BPCP he may
// play is in it, so it is both the range the S-BCP can be put in and the range a US-BCRLE axis is allowed
// to name: outside it the contact would be a point of the flight he cannot reach or may not play. y is
// linear in s, so the net cuts the window at most once, and Infinity is a legal end (a very slow ball keeps
// him in reach for good): the sign of y still reads there. Null when no part of the window is on his side.
function hwsSpan(p, curve){
  const {ray, win} = curve;
  if (!win) return null;
  const own = s => (ray.y + ray.uy*s)*p.y > 0;
  let lo = win.s1, hi = win.s2;
  if (Math.abs(ray.uy) > 1e-12){
    const sNet = -ray.y/ray.uy;                 // where the BTL meets the MCL
    if (!own(lo)) lo = Math.max(lo, sNet);      // the window opens past the net: it starts at the net
    if (!own(hi)) hi = Math.min(hi, sNet);      // ... and it closes there
  }
  if (!(hi > lo)) return null;
  const mid = Number.isFinite(hi) ? (lo + hi)/2 : lo + 1;   // one point inside is enough: own() is
  return own(mid) ? {lo, hi} : null;                        // constant across the stretch by now
}

function bcRl(p, curve){
  const {ray, win, lv, exit, sB} = curve;
  const at = s => ({x: ray.x + ray.ux*s, y: ray.y + ray.uy*s});
  const edges = [];
  // Only crossings on his own side of the MCL count. A point of the flight beyond the net is one he may
  // not play, so it is never dotted and never picked as the edge the S-BCRL ends on — the line stops at
  // the crossings he can actually use. Both teams stand clear of the net line by a head (see the drag
  // clamp), so which side a Y falls on is never ambiguous.
  const own = s => { const q = at(s); return q.y*p.y > 0; };
  if (win && win.s1 > 1e-9 && own(win.s1)) edges.push(win.s1);             // where the path enters his reach ...
  if (win && Number.isFinite(win.s2) && own(win.s2)) edges.push(win.s2);   // ... and where it leaves it again
  // US-BCRLE: the axis the user last dragged the S-BCP along, when there is one. It is the explicit choice,
  // so it comes first; what it may not do is leave the HWS — between the two BCRL-Es is exactly the stretch
  // he can meet the ball on. So the crossing it names is clamped into the span and the direction is written
  // back snapped to that BPCP: a ball that moves would otherwise leave a stored angle pointing at a contact
  // he cannot reach, and the link would then carry an aim the drawing does not show. Parallel to the BTL it
  // names no crossing at all, so the near edge is used; with no span it does not apply at all, because there
  // is nothing to meet — the axis waits, stored, until the flight comes back inside his reach (pruneDir
  // drops it only when he stops attacking).
  const span = hwsSpan(p, curve);
  if (span && p.bcrleDir != null){
    const a2 = p.bcrleDir*DEG, cx = Math.cos(a2), cy = Math.sin(a2);
    const den = cx*ray.uy - cy*ray.ux;                   // the axis against the arrow's direction
    let s = span.lo;
    if (Math.abs(den) >= 1e-9){
      const u = ((ray.x - p.x)*ray.uy - (ray.y - p.y)*ray.ux) / den;   // p -> crossing, metres
      s = (p.x + cx*u - ray.x)*ray.ux + (p.y + cy*u - ray.y)*ray.uy;   // ball -> crossing, metres
    }
    s = Math.max(span.lo, Math.min(span.hi, s));
    const q = at(s), dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
    if (d > 1e-6){
      p.bcrleDir = normRot(Math.atan2(dy, dx)/DEG);     // snapped: the state and the drawing name one axis
      const L = mbcrLen(s);
      return {tip: {x: p.x + dx/d*L, y: p.y + dy/d*L}, ball: q, edge: null, edges, dball: s};
    }
  }
  // S-BCRLE-L: the ball is level with him on screen (exit) and inside his reach at that moment (win), so
  // the lateral line does reach it. The level BPCP is on the BTL by construction, so its BCRL end needs
  // no crossing test of its own.
  if (lv && lv.dball <= exit + 1e-9 && win &&
      lv.dball >= win.s1 - 1e-9 && lv.dball <= win.s2 + 1e-9){
    const L = mbcrLen(lv.dball), sgn = lv.x >= p.x ? 1 : -1;
    return {tip: {x: p.x + sgn*L, y: p.y}, ball: at(lv.dball), edge: null, edges, dball: lv.dball};
  }
  if (edges.length){
    const s = edges[0], tip = at(s);                        // the nearest BCRP-E: the shorter BCRL-E
    return {tip, ball: tip, edge: s, edges, dball: s};
  }
  // S-BCRL-U: the perpendicular foot is the nearest BPCP; when the swept stretch ends before it (or the
  // ball itself is already past it) the nearest BPCP the MPRC actually covers is used instead, so the
  // tip lands on the drawn curve either way.
  const s = Math.max(0, Math.min(sB, (p.x - ray.x)*ray.ux + (p.y - ray.y)*ray.uy));
  const q = at(s), dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
  if (!(d > 1e-6)) return null;                             // the ball sits on him: no direction to show
  const L = mbcrLen(s), tip = {x: p.x + dx/d*L, y: p.y + dy/d*L};
  // The MPRC may bulge across the net — the flight's reach knows no halves — but the line into it may not:
  // a player never plays from the far side of the MCL, so the stretch stops where it meets the net and its
  // faded dot sits right on the MCL. That is the furthest he may go toward a ball he cannot touch.
  if (tip.y*p.y < 0){
    const t = p.y/(p.y - tip.y), x = p.x + (tip.x - p.x)*t;  // where the segment meets the net
    tip.x = x; tip.y = 0;
  }
  return {tip, ball: null, edge: null, edges, dball: s};
}

// an attacker always has the fixed static wingspan per side, wherever he stands
const reachOf = p => p.team === attackTeam() ? STATIC_REACH : defenderReach(p);

// ---- ball mode: the arrow decides the scene. It points at the team that receives the ball, i.e. the
//      team about to attack; the other team defends. No tap can override either role.
const frontSign = p => p.team === 'A' ? 1 : -1;   // +1: the top team faces down-court, -1: the bottom up
const ballInFront = p => (ball.y - p.y) * frontSign(p) >= 0;

// The team the arrow points at: up the screen -> the top team, down -> the bottom team. Within a
// pixel of level the arrow names nobody, so the current roles stay put (the arrow is plain white
// then too, see arrowColor).
function attackTeam(){
  if (!ball.on) return attack;
  const g = arrowGeom(), dy = g.uy*g.len;      // the direction as drawn, exactly like arrowColor()
  if (Math.abs(dy) < 1) return attack;
  return dy < 0 ? 'A' : 'B';
}

// The arrow as an imaginary ray: ball centre, unit direction. Hit detection, the side and the
// expected hitting point are all measured along it, so they can never disagree with the drawn arrow.
// It now comes straight from the stored rotation, so it is always defined (see the arrow's model).
function ballRay(){
  const a = ball.rot*DEG;
  return {x: ball.x, y: ball.y, ux: Math.cos(a), uy: Math.sin(a)};
}

// Which player of the attacking team meets the ball, on which side, and where he is expected to hit.
// A player has the ball when the path comes inside his MBCR reach (mbcrWindow); ties, and a path that
// misses everybody, are settled by the gap between the trajectory and his reach, so beams, shadows and
// contact dot never vanish just because the arrow is off every reach. The point he hits from is not
// solved here at all: it is the end of the reach line bcRl draws for him — the level BPCP, the BCRP-E of
// the BCRL-E, or the tip of the S-BCRL-U — so the contact dot, the beams that start there, the partner's
// circle and the length of the drawn line all read one model.
// ballHitter runs a whole MPRC sweep, and the beams ask for it once per defender zone as well as once
// for the players, so the answer is memoised for the frame: draw() bumps hitterFrame and the first
// caller of the frame pays for the sweep. Everything it reads (the ball, the players, the arrow) is
// fixed while a frame is drawn, so a cached answer cannot go stale inside one.
let hitterFrame = 0, hitterCache = {frame: -1, value: null};
function ballHitter(){
  if (hitterCache.frame === hitterFrame) return hitterCache.value;   // one sweep per frame, see above
  return (hitterCache = {frame: hitterFrame, value: solveHitter()}).value;
}
function solveHitter(){
  if (!ball.on) return null;
  const ray = ballRay();
  if (!ray) return null;
  const team = attackTeam();
  let best = null;
  for (const p of players){
    if (p.team !== team || !ballInFront(p)) continue;   // behind the player: no reach, no hit
    const lv = levelBPCP(p, ray);
    const R = mbcrLen(lv ? lv.dball : 0);   // his reach when the ball levels with him
    const win = mbcrWindow(p, ray);         // ... and whether the path ever comes inside it
    const ox = ray.x - p.x, oy = ray.y - p.y;
    // a trajectory outside his reach still makes him a contender: the gap between that reach and the
    // trajectory decides who is closest, so the beams keep showing even when the arrow misses both
    const miss = win ? 0 : Math.max(0, Math.abs(ox*ray.uy - oy*ray.ux) - R);
    const better = !best || miss < best.miss - 1e-9 ||
                   (Math.abs(miss - best.miss) <= 1e-9 && Math.abs(p.y) < Math.abs(best.p.y));
    if (better) best = {p, R, miss, win, lv};
  }
  if (!best) return null;
  const p = best.p, curve = mprc(p), bcrl = bcRl(p, curve);
  // ball is set only when the line really reaches the ball, so it is also the test for a real contact:
  // an S-BCRL-U ends on his MPRC, never on the flight, and its tip is where he stretches to, not a meeting.
  const at = bcrl ? bcrl.ball || bcrl.tip : {x: p.x, y: p.y};   // null bcrl: the ball sits on him
  const hit = {x: at.x, y: at.y, dball: bcrl ? bcrl.dball : 0, reached: !!(bcrl && bcrl.ball)};
  return {...best, curve, bcrl, hit, clamped: !hit.reached,
          side: Math.abs(hit.x - p.x) < 1e-9 ? (ball.x < p.x ? -1 : 1) : (hit.x < p.x ? -1 : 1)};
}

// The one bad case of ball mode: the flight never crosses the hitter's MPRC (bcRl's S-BCRL-U), so no reach
// line can meet the ball at all. Then, and only then, the whole attacking pair reads red — the hitter has no
// contact and his partner has nothing to cover. A partner who is merely not the man the arrow picked is not
// at fault, so the red is never asked of a player on his own reach: it belongs to the pair.
function noContact(){
  const h = ball.on ? ballHitter() : null;
  return !!(h && h.bcrl && !h.bcrl.ball);
}

// The US-BCRLE is a plan, and only the attacking player has one — the man the flight is coming to
// (ballHitter), not his whole team. What it survives is the ball drifting out of his reach: an unreachable
// flight (the S-BCRL-U case) leaves the chosen axis stored, so it is still there — and still in the link —
// the moment the arrow brings the ball back inside his reach; he is still the one it is coming to, his line
// is merely the perpendicular one. What it does not survive is losing the attack: once the flight is coming
// to his partner, that partner is the attacker and he is the non-attacking one, the shaded NAPRZ circle is
// drawn around him instead, and his plan is stale — the direction becomes null, it leaves the link, and his
// line is chosen automatically again (bcRl) the next time the ball is his. With no ball there is no attacker
// at all, so no plan survives either. Run at the top of every frame, after the hitterFrame bump so it sees
// this frame's hitter, and before anything is drawn: a direction the state no longer allows cannot survive
// even one frame, and since hashOf reads the same field the link loses it at the same moment.
function pruneDir(){
  const h = ball.on ? ballHitter() : null;
  const keep = h ? h.p : null;                            // the attacker: whoever the flight comes to
  for (const p of players)
    if (p.bcrleDir != null && p !== keep) p.bcrleDir = null;
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let cw = 0, ch = 0, dpr = 1, s = 1, ox = 0, oy = 0;
function resize(){
  const r = cv.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  cw = r.width; ch = r.height;
  cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
  // The header sits above the court on a narrow screen and beside it on a wide one, where a tab's pane
  // is a column down the left. Only an overlap in x means its bottom edge eats into the top of the court.
  const hb = document.querySelector('header').getBoundingClientRect();
  const over = hb.bottom > r.top && hb.right > r.left && hb.left < r.right;
  const top = over ? hb.bottom - r.top + 6 : 0;
  const availH = Math.max(100, ch - top);
  s = Math.min(cw/(CW+2*MX), availH/(CL+2*MY));
  ox = cw/2; oy = top + availH/2;
  VB = {x0:-ox/s, y0:-oy/s, x1:(cw-ox)/s, y1:(ch-oy)/s};
  draw();
}
new ResizeObserver(resize).observe(cv);
new ResizeObserver(resize).observe(document.querySelector('header'));
const toPx = p => ({x: ox + p.x*s, y: oy + p.y*s});
const toWorld = (px,py) => ({x:(px-ox)/s, y:(py-oy)/s});

// ---- the ball's felt colour, in one place: the whole body is one shading ramp derived from this
//      value, so re-tinting the ball is a one-line edit. '#cfea55' is the optic yellow it ships
//      with; other ideas: '#d8f24a' (brighter), '#f2e14a' (classic yellow), '#e8703a' (clay).
//      Any CSS hex ('#rrggbb') or [r, g, b] array works, and opts.color overrides it per call.
const BALL_COLOR = '#d6d606';
const BALL_SEAM_COLOR = '#ffffff';            // the seam's lit colour (real balls have white seams)

// ---- overall brightness of the ball: 1 is the plain shading model below, and 1.3 is the punchier
//      felt tennis_ball.html ships with (its light dim is gentler, worth about 1.3x here). It
//      multiplies the body ramp and the seam, then clips at 255, so the highlight goes sunny and
//      the shadow side stays readable. opts.brightness overrides it per call.
const BALL_BRIGHTNESS = 1.1;

// ---- tennis ball: a self-contained sphere renderer (shaded body + the classic four-lobe seam
//      band), so the court can show a real tennis ball that the user can drag around.
//   drawTennisBall(ctx, x, y, radius, opts)
//     x, y     centre in CSS pixels — the ctx must be in pixel space, not scaled to metres
//     radius   ball radius in pixels
//     opts     quat     orientation [w, x, y, z]     (default 0.0698, 0.6742, -0.7349, 0.0210)
//              spin     extra turn of the whole pattern about the view axis, ° (default 0),
//                       positive = clockwise on screen, i.e. the arrow's own rot can be passed as is
//              az, el   light azimuth / elevation, °  (default -82, 26)
//              seam     carved seam width, °          (default 4.0)
//              segments seam resolution               (default 252)
//              color    felt colour, '#rrggbb' | [r,g,b]  (default BALL_COLOR)
//              seamColor seam colour, same forms      (default BALL_SEAM_COLOR)
//              brightness overall brightness multiplier (default BALL_BRIGHTNESS)
const drawTennisBall = (() => {
  const D = {quat: [0.0698, 0.6742, -0.7349, 0.0210], spin: 0, az: 0, el: 0, seam: 4.0, segments: 252};
  // felt ramp: the five shading stops of the body, each the base colour plus an offset — the
  // highlight lifts it, the three lower bands drain it. Integers, so the default look is exact.
  const TINT = [[0.00,  26,  14,  55],
                [0.26,   0,   0,   0],
                [0.55, -33, -29, -34],
                [0.80, -73, -69, -56],
                [1.00,-128,-128, -70]];
  // '#rrggbb' | 'rgb(r,g,b)' | [r,g,b] -> [r,g,b], or null if it cannot be read
  const HEX = /^#?([0-9a-f]{6})$/i, RGBA = /^rgba?\(([^)]+)\)$/i;
  function color(c){
    if (Array.isArray(c)) return [+c[0]|0, +c[1]|0, +c[2]|0];
    const s = String(c == null ? '' : c).trim();
    const h = HEX.exec(s);
    if (h){ const v = parseInt(h[1], 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; }
    const t = RGBA.exec(s);
    if (t){ const p = t[1].split(',').map(Number); return [p[0]|0, p[1]|0, p[2]|0]; }
    return null;
  }
  const n3 = v => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/m, v[1]/m, v[2]/m]; };
  const n4 = q => { const m = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
                    return [q[0]/m, q[1]/m, q[2]/m, q[3]/m]; };
  const cross = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  const bite = v => { v = Math.round(v); return v < 0 ? 0 : v > 255 ? 255 : v; };
  const rgb = (r, g, b) => 'rgb(' + bite(r) + ',' + bite(g) + ',' + bite(b) + ')';
  // opts.brightness -> a usable multiplier: anything unreadable or <= 0 falls back to the constant
  const brightOf = b => { const v = +b; return Number.isFinite(v) && v > 0 ? clamp(v, 0, 3) : BALL_BRIGHTNESS; };
  const rot = q => {                                  // quaternion -> 3x3 matrix, row major
    const w = q[0], x = q[1], y = q[2], z = q[3];
    return [1-2*(y*y+z*z), 2*(x*y-w*z),   2*(x*z+w*y),
            2*(x*y+w*z),   1-2*(x*x+z*z), 2*(y*z-w*x),
            2*(x*z-w*y),   2*(y*z+w*x),   1-2*(x*x+y*y)];
  };
  const turn = (m, p) => [m[0]*p[0] + m[1]*p[1] + m[2]*p[2],
                          m[3]*p[0] + m[4]*p[1] + m[5]*p[2],
                          m[6]*p[0] + m[7]*p[1] + m[8]*p[2]];
  // the seam: four semicircular arcs on the unit sphere, cached per resolution
  const A = 0.5, Bo = A/3, C = 2*Math.sqrt(A*Bo), U = A + Bo, seams = new Map();
  function seamPts(n){
    let pts = seams.get(n);
    if (pts) return pts;
    pts = new Array(n);
    for (let i = 0; i < n; i++){
      const t = i/n*Math.PI*2;
      pts[i] = [(A*Math.cos(t) + Bo*Math.cos(3*t))/U, (A*Math.sin(t) - Bo*Math.sin(3*t))/U,
                C*Math.sin(2*t)/U];
    }
    seams.set(n, pts);
    return pts;
  }
