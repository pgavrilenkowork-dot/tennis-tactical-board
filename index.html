  // ball, is opaque; the two coincide when the line ends on the BTL itself (EBCRL). Every EBCRP is
  // dotted, the one the VBCRL ends on solid and the other faded, so the eye can tell which crossing he
  // can actually meet. A VBCRL-U ends on the MPRC instead and keeps the faded dot: a place he could
  // stretch to, not one the ball goes through.
  if (bcrl){
    const dot = (q, a) => {
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(q.x, q.y, 4/s, 0, 7);
      ctx.fillStyle = col; ctx.fill();
      ctx.lineWidth = 2/s; ctx.strokeStyle = '#fff'; ctx.stroke();
      ctx.lineWidth = LINE_W/s;
    };
    ctx.save();
    ctx.lineWidth = LINE_W/s; ctx.lineCap = 'round';
    // Neither line can cross the MCL: the ball may cross the net, the player may not, so a VBCRL-U is cut
    // there (bcRl) and the level BPCP lies on his own side by construction. The 0.4 fade the reaches used to
    // need past the net went with the crossing.
    ctx.globalAlpha = 0.5;
    if (!bcrl.edge) line(p.x, p.y, bcrl.tip.x, bcrl.tip.y);       // VBCRLE beyond the BCRL: reach, not contact
    if (bcrl.ball){
      ctx.globalAlpha = 1;                                       // VBCRL: it does reach the ball, so opaque
      line(p.x, p.y, bcrl.ball.x, bcrl.ball.y);
    }
    for (const s2 of bcrl.edges){
      const q = {x: curve.ray.x + curve.ray.ux*s2, y: curve.ray.y + curve.ray.uy*s2};
      dot(q, bcrl.edge !== null && Math.abs(s2 - bcrl.edge) < 1e-9 ? 1 : 0.5);
    }
    if (!bcrl.edges.length) dot(bcrl.tip, 0.5);      // VBCRL-U: the stretch tip, faded
    ctx.restore();
  }

  // The SRCPs come first and the contact dot last. Each SRCP is the point on its own SRCL he can reach a
  // ball at, so the line is drawn before its mark; and the contact dot (S-BCP) closes the pass because it
  // is the point the whole plan converges on — nothing is laid over it. The head still comes later
  // (drawPlayerHead) and does overlap these marks at ordinary zoom — the reach is about a metre, the head's
  // circle a little wider — which is why the idle SRCP dots are rimmed white: what shows past the head still
  // reads as a marked point.
  for (const sx of srclSides){
    if (ahs !== null){
      // Ball mode: no dot and no mark. The SRCL above already ends at this point and is grey there, so the
      // SRCP is read off the end of the line itself: anything drawn on top of it would only hide the end it
      // marks. The AHS keeps exactly one visible tip, and that tip is the SRCP.
      continue;
    }
    const on = att && (sx < 0 ? p.l : p.r);   // a side he is emitting from: idle mode only
    ctx.beginPath(); ctx.arc(p.x+sx,p.y,(att ? 7 : 4)/s,0,7);
    ctx.fillStyle = on ? col : '#1b2430'; ctx.fill();
    ctx.lineWidth = 2/s; ctx.strokeStyle = att ? '#fff' : col; ctx.stroke();   // every SRCP is rimmed white
  }
  // Ball mode: the contact point — the end of the reach line drawn above, where it meets the ball — as the
  // same small dot as the reach-line ends but filled with the team colour and rimmed in white. The beams
  // start exactly here (see drawBeams). A VBCRL-U reaches no ball, so it carries no contact dot: its own tip
  // keeps the faded one, and the beams start from that tip all the same.
  if (hitter && hitter.p === p && hitter.hit.reached){
    ctx.beginPath(); ctx.arc(hitter.hit.x, hitter.hit.y, 4/s, 0, 7);
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 2/s; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
}

// One player’s head: the rim (red when the ball’s path misses his reach in ball mode), the dot in his
// team colour and his letter. Drawn after every mark, so the players read as standing on the court.
function drawPlayerHead(p){
  const att = p.team === attackTeam(), teamCol = COL[p.team];
  // the very red the marks use, and under the very same rule: the whole pair, only when nothing can be met
  const red = ball.on && att && noContact();
  // The rim — an attacker's white halo, a defender's team ring — turns red only then; the head's own
  // background keeps the team colour.
  if (att){
    ctx.beginPath(); ctx.arc(p.x,p.y,(HEAD_PX+2)/s,0,7);
    ctx.fillStyle = red ? UNREACH_COL : '#fff'; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(p.x,p.y,HEAD_PX/s,0,7);
  ctx.fillStyle = att ? teamCol : '#1b2430'; ctx.fill();
  if (!att){ ctx.strokeStyle = teamCol; ctx.lineWidth = 3/s; ctx.stroke(); }
  // player letter (A-D) centred in the dot: bold while he is attacking, regular while defending;
  // dark on a team-coloured attacker, white on a dark defender
  ctx.fillStyle = att ? '#1b2430' : '#fff';
  ctx.font = (att ? '700 ' : '400 ') + (13/s) + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.letter, p.x, p.y + 0.5/s);
}
// Temporary overlay drawn only while a player's DOT is held and the DELTA MARKER setting is on (deltaOn).
// Three named parts:
//   GUIDE LINE — vertical dashed line at the held dot's x. Starts DOT_GAP clear of the held dot
//                and ends DOT_GAP clear of the nearest opposing dot (nearest measured
//                perpendicular to the line, i.e. smallest |Δx|).
//   ARROW      — short arrow perpendicular to the GUIDE LINE. Its tail sits ARROW_GAP clear of
//                the line (near the far end) and its tip points at the target opponent's side.
//   DELTA (Δ)  — horizontal displacement between the held player and that opponent, one decimal,
//                printed beside the ARROW. It always shows; only the ARROW is hidden at 0.0 m.
function drawDragGuide(){
  if (!deltaOn || !drag || drag.part !== DOT) return;
  const p = drag.p, x = p.x;                           // GUIDE LINE sits at this x
  let opp = null;
  for (const q of players)
    if (q.team !== p.team && (!opp || Math.abs(q.x - x) < Math.abs(opp.x - x))) opp = q;
  if (!opp) return;
  const off = HEAD_PX/s + DOT_GAP/s;                   // dot radius + margin, used at both ends
  const dy = opp.y - p.y, dir = dy < 0 ? -1 : 1;       // from the held dot toward the opponent
  if (Math.abs(dy) <= 2*off) return;                   // no room for the line between the two gaps
  const y0 = p.y + dir*off, y1 = opp.y - dir*off;      // GUIDE LINE spans y0 -> y1 at x
  const delta = Math.abs(opp.x - x);                   // DELTA: horizontal displacement (m)
  const sgn = opp.x < x ? -1 : 1;                      // ARROW points this way along x
  ctx.save();
  ctx.globalAlpha = 0.5; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
  ctx.lineWidth = Math.max(0.06, 1.5/s); ctx.lineCap = 'butt';
  ctx.setLineDash([9/s, 7/s]);
  line(x, y0, x, y1);                                  // GUIDE LINE
  const ax0 = x + sgn*ARROW_GAP/s;                     // ARROW tail, clear of the GUIDE LINE
  const ax1 = ax0 + sgn*ARROW_LEN/s;                   // ARROW tip
  if (delta >= 0.05){                                  // ARROW alone is hidden at 0.0 m, DELTA stays
    ctx.setLineDash([]);
    const hl = ARROW_HEAD_L/s, hw = ARROW_HEAD_HW/s;
    line(ax0, y1, ax1 - sgn*hl, y1);                   // shaft stops at the head base
    ctx.beginPath();                                   // sharp CAD-style head
    ctx.moveTo(ax1, y1);
    ctx.lineTo(ax1 - sgn*hl, y1 - hw);
    ctx.lineTo(ax1 - sgn*hl, y1 + hw);
    ctx.closePath(); ctx.fill();
  }
  // DELTA readout, always shown: past the ARROW tip, or past its tail when the ARROW is hidden
  const label = '\u0394' + delta.toFixed(1) + ' m';
  ctx.font = '700 ' + (12/s) + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textBaseline = 'middle';
  const lw = ctx.measureText(label).width;
  let tx = (delta >= 0.05 ? ax1 : ax0) + sgn*5/s, align = sgn > 0 ? 'left' : 'right';
  if (sgn > 0 ? tx + lw > VB.x1 - 4/s : tx - lw < VB.x0 + 4/s){
    align = sgn > 0 ? 'right' : 'left'; tx = x - sgn*5/s;
  }
  ctx.textAlign = align; ctx.fillText(label, tx, y1);
  ctx.restore();                                       // restores alpha, colour and dash pattern
}

function draw(){
  hitterFrame++;                                        // one ballHitter sweep per frame (see the memo)
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);
  ctx.translate(ox,oy); ctx.scale(s,s);
  drawCourt(); drawBeams(); drawNet();
  // The flight before everything it carries: the BTL and its solid HWS are the backdrop of the ball mode,
  // so the EBCRP/SRCP dots, the reach lines and the players are all laid on top of the trajectory and
  // never under it. It is drawn in the same pixels as the arrow (see drawBallFlight).
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawBallFlight();
  ctx.translate(ox,oy); ctx.scale(s,s);                 // back to court metres for the marks and players
  drawPlayers(); drawDragGuide();
  ctx.setTransform(dpr,0,0,dpr,0,0);   // back to pixels: the ball keeps a readable size and sits on top
  drawBallArrow(); drawBall();
}

// ---- interaction (mouse + touch via pointer events)
let drag = null;
// distance from a point to a segment, so the arrow can be grabbed anywhere along its drawn length
function segDist(px, py, ax, ay, bx, by){
  const vx = bx - ax, vy = by - ay, L = vx*vx + vy*vy;
  const t = L > 1e-6 ? Math.max(0, Math.min(1, ((px-ax)*vx + (py-ay)*vy)/L)) : 0;
  return Math.hypot(px - (ax + vx*t), py - (ay + vy*t));
}
function pick(px,py){
  let extHit = null;              // the dashed run is picked last: it crosses the whole screen, so the
                                  // ball, its arrow and the players all get first claim on a grab
  // the ball is drawn above everything, so it also wins the pick; a generous pad keeps it grabbable
  if (ball.on){
    const c = toPx(ball);
    if (Math.hypot(px - c.x, py - c.y) <= ballR() + 6) return {p: ball, part: BALL};
    // then the arrow (drawn above the players, and only where it is actually visible): grab its
    // shaft or its head, never the empty gap behind them. This handle changes the speed only.
    const g = arrowGeom();
    if (segDist(px, py, g.tail.x, g.tail.y, g.tip.x, g.tip.y) <= Math.max(7, arrowW/2 + 5))
      return {p: ball, part: VEC};
    // then the dashed continuation past the tip: a wide, easy handle for aiming, since it runs to the
    // edge of the screen — the farther from the ball it is grabbed, the finer the rotation it gives
    const run = edgeReach(g.tip.x, g.tip.y, g.ux, g.uy);
    if (run > 0.5 && segDist(px, py, g.tip.x, g.tip.y,
                             g.tip.x + g.ux*run, g.tip.y + g.uy*run) <= 8)
      extHit = {p: ball, part: EXT};
  }
  let best = null, bd = 1e9;
  for (const p of players){
    const r = reachOf(p), fh = fhSide(p);
    const c = toPx(p), d = Math.hypot(px-c.x, py-c.y);
    const a = toPx({x:p.x-r,y:p.y}), b = toPx({x:p.x+r,y:p.y});
    const fhDot = fh < 0 ? a : b, bhDot = fh < 0 ? b : a;
    const att = p.team === attackTeam();
    // ball mode picks the side itself, so its end dots are placeholders: no FH/BH pick at all
    const canSide = att && !ball.on;
    const dFh = canSide ? Math.hypot(px-fhDot.x, py-fhDot.y) : 1e9;
    const dBh = canSide ? Math.hypot(px-bhDot.x, py-bhDot.y) : 1e9;
    const dSeg = Math.abs(py-c.y) <= 16 && px >= a.x-12 && px <= b.x+12 ? Math.abs(py-c.y) + 16 : 1e9;
    const cands = [[d <= HEAD_PX+8 ? d : 1e9, DOT], [dFh <= 18 ? dFh : 1e9, FH], [dBh <= 18 ? dBh : 1e9, BH], [dSeg, SEG]];
    const [score, part] = cands.reduce((m, c2) => c2[0] < m[0] ? c2 : m);
    if (score < bd && score < 1e8){ bd = score; best = {p, part}; }
  }
  return best || extHit;
}
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), px = e.clientX-r.left, py = e.clientY-r.top;
  const hit = pick(px,py); if (!hit) return;
  const w = toWorld(px,py);
  drag = {p: hit.p, part: hit.part, dx: hit.p.x-w.x, dy: hit.p.y-w.y, sx: px, sy: py, moved: false};
  if (hit.part === VEC){          // stretching reads the pointer against where it was grabbed, so the
    const c = toPx(ball);         // head never jumps on the first move
    drag.vel0 = ball.vel; drag.dist0 = Math.hypot(px - c.x, py - c.y)/s;
  }
  cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); e.preventDefault();
  draw();            // show the DOT guide immediately, even before the first move
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const r = cv.getBoundingClientRect(), px = e.clientX-r.left, py = e.clientY-r.top;
  if (Math.hypot(px-drag.sx,py-drag.sy) > 6) drag.moved = true;
  if (drag.part === VEC){
    stretchArrow(px, py, drag.vel0, drag.dist0);   // the arrow only changes the speed, never the angle
  } else if (drag.part === EXT){
    rotateArrow(px, py);                           // the dashed run only swings it, never the speed
  } else {
    const w = toWorld(px,py);
    const x = Math.max(VB.x0, Math.min(VB.x1, w.x+drag.dx));
    let y = Math.max(VB.y0, Math.min(VB.y1, w.y+drag.dy));
    // No player crosses the MCL (the net line, y = 0): his own half is the only place he may stand, and
    // keeping the head's radius clear of the line stops the dot straddling the net. The ball is not a
    // player, so it crosses freely.
    if (drag.p !== ball){
      const clear = HEAD_PX/s;
      y = drag.p.team === 'A' ? Math.min(y, -clear) : Math.max(y, clear);
    }
    drag.p.x = x; drag.p.y = y;    // the arrow is stored relative to the ball, so it rides along
  }
  draw();
  scheduleHash();                 // keep the URL in step while the player is being moved
});
function end(){
  if (!drag) return;
  if (!drag.moved && drag.part !== BALL && drag.part !== VEC && drag.part !== EXT){
    const p = drag.p;       // the ball, its speed handle and its aiming handle only ever drag: a tap
                            // on any of them does nothing
    if (!ball.on){                            // ball mode owns the roles and the hitting side itself
      if (p.team !== attackTeam()){
        if (drag.part === DOT) swapRoles();   // placeholder tap: the defender attacks (no beam lit)
      } else if (drag.part === FH || drag.part === BH){
        // beams are emitted ONLY from the forehand/backhand dots: one side of one player at a time
        const side = drag.part === FH ? fhSide(p) : -fhSide(p);   // -1 = screen-left, +1 = screen-right
        const on = side < 0 ? !p.l : !p.r;
        clearBeams();
        if (side < 0) p.l = on; else p.r = on;
      }
    }
    // DOT / SEG on an attacker: drag only, a tap here never emits
    status();
  }
  writeHash();               // a drop, or a tap that lights/clears a side, refreshes the URL
  drag = null; cv.classList.remove('drag'); draw();
}
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', end);

// ---- controls
function clearBeams(){ for (const q of players) q.l = q.r = false; }
// roles swap with all beams off: a beam is only ever lit by tapping a forehand/backhand dot
function swapRoles(){
  if (ball.on) return;       // ball mode derives both roles from the arrow
  attack = attack === 'A' ? 'B' : 'A';
  clearBeams();
}
function status(){
  const atk = attackTeam(), def = atk === 'A' ? 'B' : 'A';
  if (ball.on){
    const h = ballHitter();
    const who = h ? ' Player ' + h.p.letter + (h.clamped
                    ? ' cannot reach it — the path never comes inside his reach, so the plan is to stretch to the end of it.'
                    : ' meets it on the ' + (h.side < 0 ? 'left' : 'right') + ' side.')
                  : ' No attacker has the ball in front of him yet.';
    document.getElementById('status').textContent =
      'Ball mode: the arrow points at ' + NAME[atk].toLowerCase() + ', so it attacks (beams); ' +
      NAME[def].toLowerCase() + ' defends (shadows).' + who +
      ' Drag the ball to move it, the arrow to change the ball’s speed, and the dashed line past its ' +
      'tip to aim it — the farther out you grab, the finer the aim.';
    return;
  }
  document.getElementById('status').textContent =
    NAME[atk] + ' attacks (beams), ' + NAME[def].toLowerCase() + ' defends (shadows). Tap an attacker’s forehand (FH) or backhand (BH) dot to emit from that side only (tap again to stop) — the lettered placeholder never emits; tap a defender’s placeholder to swap roles.';
}
// ---- reach sliders: REACH_SLIDERS owns the range, so the header needs no min/max/step/value and the
// readout is written from the live setting. The initial position follows rNet/rBase/rMargin, which means
// editing those constants is enough — and because the margin is stored as a fraction but shown as a whole
// percent, the slider's number is scaled on the way in and out.
function syncReachUI(){
  for (const sl of REACH_SLIDERS){
    const el = document.getElementById(sl.id), out = document.getElementById(sl.out);
    el.min = sl.min; el.max = sl.max; el.step = sl.step;
    el.value = sl.get() / sl.scale;                 // snapped to the step by the browser
    out.textContent = sl.fmt(+el.value);
    el.oninput = () => {                            // oninput (not addEventListener) keeps one handler
      sl.set((+el.value) * sl.scale);
      out.textContent = sl.fmt(+el.value);
      draw();
    };
  }
}
syncReachUI();
// ---- ball checkbox: show / hide the tennis ball; once shown it drags like a player does, and its
// arrow comes with it. The URL carries the ball, so toggling rewrites the fragment as well.
const ballOn = document.getElementById('ballOn');
ballOn.addEventListener('change', () => {
  if (!ballOn.checked && ball.on) attack = attackTeam();   // keep the roles the ball scene was showing
  ball.on = ballOn.checked;
  status();
  writeHash();                  // "b:" appears while the ball is shown, and goes when it is hidden
  draw();
});
// ---- delta marker checkbox: the drag guide (GUIDE LINE, ARROW, Δ readout) is a measuring aid, so it is
// off by default; ticking it lets a held DOT show the displacement line and its metres. Display only —
// the drag itself, the URL and the scene are untouched — so a change just redraws.
const deltaOnEl = document.getElementById('deltaOn');
deltaOnEl.checked = deltaOn;                 // the box starts from the setting, never the other way round
deltaOnEl.addEventListener('change', () => { deltaOn = deltaOnEl.checked; draw(); });
// ---- ball size slider: writes ball.px, the ball's drawn radius in CSS px (BALL_PX is its default).
// Its initial position follows ball.px, so editing the constant in the code is enough. Touching the
// slider also shows the ball, so the size change is visible straight away.
const ballSize = document.getElementById('ballSize'), ballSizev = document.getElementById('ballSizev');
ballSize.value = ball.px;
ballSizev.textContent = ball.px + ' px';
ballSize.addEventListener('input', () => {
  ball.px = +ballSize.value;
  ballSizev.textContent = ball.px + ' px';
  if (!ball.on){ ball.on = true; ballOn.checked = true; writeHash(); status(); }
  draw();
});
// ---- arrow width slider: writes arrowW, the shaft width in CSS px (BALL_ARROW_W is its default).
// Same rules as the size slider: it starts from the constant and shows the ball so you can see it.
const arrowWidth = document.getElementById('arrowW'), arrowWidthv = document.getElementById('arrowWv');
arrowWidth.value = arrowW;
arrowWidthv.textContent = arrowW + ' px';
arrowWidth.addEventListener('input', () => {
  arrowW = +arrowWidth.value;
  arrowWidthv.textContent = arrowW + ' px';
  if (!ball.on){ ball.on = true; ballOn.checked = true; writeHash(); status(); }
  draw();
});
// a #p- link can show or hide the ball, so the header always mirrors the live ball state
function syncBallUI(){
  ballOn.checked = ball.on;
  ballSize.value = ball.px; ballSizev.textContent = ball.px + ' px';
  arrowWidth.value = arrowW; arrowWidthv.textContent = arrowW + ' px';
}
// ---- header: on narrow screens it is just a "Settings" bar (see the max-width media query);
// tapping it toggles the full panel. Wide screens always show the panel and hide the bar.
const bar = document.querySelector('header'), barToggle = document.getElementById('barToggle');
function setBarOpen(open){
  bar.dataset.open = open ? 'true' : 'false';
  barToggle.setAttribute('aria-expanded', String(open));
}
barToggle.addEventListener('click', () => setBarOpen(bar.dataset.open !== 'true'));
setBarOpen(false);      // start minimal; the court gets the whole screen until the bar is tapped
applyHash();    // a shared #p- link restores the players before the first draw
status();       // ...and the status line reflects whether that link also shows the ball
resize();
</script>
</body>
</html>
