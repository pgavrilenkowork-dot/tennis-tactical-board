  // light direction: azimuth measured from +z toward +x, elevation from the horizontal plane
  function light(az, el){
    const a = az*Math.PI/180, e = el*Math.PI/180, ce = Math.cos(e);
    return [ce*Math.sin(a), Math.sin(e), ce*Math.cos(a)];
  }

  return function drawTennisBall(ctx, x, y, radius, opts = {}){
    if (!(radius > 0.01)) return;
    const M = rot(n4(opts.quat || D.quat));
    // spin: one more turn of everything about the view axis (z, the axis pointing at the reader), applied
    // after the quaternion. The ball's own y is up while a screen's y is down, so a turn that is clockwise
    // on screen — the sense the arrow's rot grows in — reads as (x, y) -> (x cos + y sin, y cos - x sin)
    // here: the sine carries the opposite sign to the screen formula, and the two agree by construction.
    const sp = (opts.spin ?? D.spin)*Math.PI/180, sc = Math.cos(sp), sn = Math.sin(sp);
    const L = light(opts.az ?? D.az, opts.el ?? D.el);
    const br = brightOf(opts.brightness);             // overall brightness, on top of the light shading
    const band = (opts.seam ?? D.seam)*Math.PI/180;    // seam half-width on the sphere (rad)
    const pts = seamPts(Math.max(16, Math.round(opts.segments ?? D.segments)));
    const N = pts.length, P = new Array(N), E1 = new Array(N), E2 = new Array(N), vis = new Array(N);
    for (let i = 0; i < N; i++){
      const p = turn(M, pts[i]);
      P[i] = [p[0]*sc + p[1]*sn, p[1]*sc - p[0]*sn, p[2]];   // the hinge is z, so z is left alone
    }
    for (let i = 0; i < N; i++){
      const p = P[i], pa = P[(i + N - 1) % N], pb = P[(i + 1) % N];
      const tan = n3([pb[0] - pa[0], pb[1] - pa[1], pb[2] - pa[2]]);    // along the seam
      const bin = n3(cross(p, tan));                                    // across the seam
      E1[i] = n3([p[0] + band*bin[0], p[1] + band*bin[1], p[2] + band*bin[2]]);
      E2[i] = n3([p[0] - band*bin[0], p[1] - band*bin[1], p[2] - band*bin[2]]);
      vis[i] = p[2] > 0;                                                // front hemisphere only
    }
    const px = v => [x + v[0]*radius, y - v[1]*radius];

    ctx.save();
    // body: one radial gradient, centred on the highlight the light direction implies
    const xy = Math.hypot(L[0], L[1]), bright = Math.max(0, L[2]);
    const ux = xy > 1e-6 ? L[0]/xy : 0, uy = xy > 1e-6 ? L[1]/xy : 0;
    const hf = (L[2] >= 0 ? xy*0.85 : 0.85)*radius;
    const hx = x + ux*hf, hy = y - uy*hf;
    const k = clamp(0.55 + 0.45*(L[2] + 0.45)/1.13, 0.35, 1)*br;       // dims when backlit, then brightens
    const g = ctx.createRadialGradient(hx, hy, radius*(0.06 + 0.10*(1 - bright)),
                                       hx, hy, radius*(1.30 + 0.30*(1 - bright)));
    const base = color(opts.color) || color(BALL_COLOR) || [207, 234, 85];   // felt colour
    for (const [pos, r, gg, b] of TINT)      // the whole body ramp, derived from that one colour
      g.addColorStop(pos, rgb((base[0] + r)*k, (base[1] + gg)*k, (base[2] + b)*k));
    ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();

    // seam: one flat-shaded quad per visible segment, lit by the same light
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const seamCol = color(opts.seamColor) || color(BALL_SEAM_COLOR) || [255, 255, 244];
    const lw = radius > 30 ? Math.min(1.1, radius*0.02) : 0;            // hides hairlines on big balls
    if (lw) ctx.lineWidth = lw;
    for (let i = 0; i < N; i++){
      const j = (i + 1) % N;
      if (!vis[i] && !vis[j]) continue;
      const nx = (P[i][0] + P[j][0])*0.5, ny = (P[i][1] + P[j][1])*0.5, nz = (P[i][2] + P[j][2])*0.5;
      const nl = Math.hypot(nx, ny, nz) || 1;
      const lam = Math.max(0, (nx*L[0] + ny*L[1] + nz*L[2])/nl);
      // lit by the same light, brightened, and capped so the seam tops out at its own colour
      const t = Math.min(1, (0.42 + 0.58*Math.pow(lam, 0.9))*br);
      const col = rgb(seamCol[0]*t, seamCol[1]*t, seamCol[2]*t);
      const a = px(E1[i]), b = px(E2[i]), c = px(E2[j]), d = px(E1[j]);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]);
      ctx.closePath();
      ctx.fillStyle = col; ctx.fill();
      if (lw){ ctx.strokeStyle = col; ctx.stroke(); }
    }
    ctx.restore();
  };
})();

// A tennis ball is 3.43 cm in radius, i.e. about one pixel at the court's normal scale, so its true
// size is far too small to see: what is drawn is BALL_PX pixels of screen instead (raise BALL_PX,
// or drag "Ball size" in the header — that writes ball.px — to watch it change). The true radius is
// still a floor, so the ball only grows past ball.px when you zoom in enough for it to matter.
// Like a player it is clamped to the visible rectangle, and it is drawn above everything else.
const BALL_R = 0.0343;                        // true radius of a tennis ball, metres
const BALL_PX = 11;                            // drawn radius, CSS px  ← the size you actually see
const ball = {
  on: false,
  x: 0, y: 6.5,                               // starts on the centre line, behind the near service line
  vel: 90,                                    // the ball's speed, km/h — it IS the arrow's length
  rot: 303.7,                                 // the arrow's rotation, degrees (see the model below)
  px: BALL_PX,                                // drawn radius, CSS px (the header slider edits this)
  quat: [0.0698, 0.6742, -0.7349, 0.0210]     // the ball's default orientation
};
// ---- the arrow's model: speed + rotation, never a tip.  The arrow is drawn to a fixed scale —
//      2 m of court is 50 km/h, i.e. 25 km/h per metre — so the same speed and angle mean the same
//      thing at any zoom and the URL can carry them instead of a length in metres.
//      Rotation is in degrees: 0 points along +x (screen right) and the angle grows clockwise on
//      screen, because court y grows down; -90 (i.e. 270) aims at the top pair, +90 at the bottom.
const DEG = Math.PI/180;
const normRot = deg => ((deg % 360) + 360) % 360;          // into 0 .. 360
const VEL_PER_M = 50/2;                                    // km/h per metre of arrow: 2 m = 50 km/h
const BALL_VEL_MIN = 10, BALL_VEL_MAX = 400;               // km/h — the arrow stays inside this
const clampVel = v => Math.max(BALL_VEL_MIN, Math.min(BALL_VEL_MAX, v));
const arrowLenM = () => ball.vel / VEL_PER_M;              // the arrow's length, metres
// the arrow's tip in world metres: always derived from the centre, so moving the ball carries the
// arrow with it and stretching/swinging the arrow never touches the ball's position
const arrowTipWorld = () => {
  const a = ball.rot*DEG, L = arrowLenM();
  return {x: ball.x + Math.cos(a)*L, y: ball.y + Math.sin(a)*L};
};
// a tip in world metres -> {vel, rot}: what an older "b:x:y:tipx:tipy" link still carries
function arrowFromTip(x, y, tx, ty){
  const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy);
  if (d < 1e-9) return null;
  return {vel: clampVel(d*VEL_PER_M), rot: normRot(Math.atan2(dy, dx)/DEG)};
}
const ballR = () => Math.max(BALL_R*s, ball.px);

// ---- the ball's arrow. It always starts at the ball's centre, but the first stretch is never drawn:
//      a gap radius (always wider than the ball) swallows the tail, so the felt stays clean and the
//      arrow reads as a direction sticking out of the ball. Drag the arrow itself and it only changes
//      the ball's speed (its length, see stretchArrow); swing it by dragging the dashed continuation
//      past the tip (see rotateArrow), where the lever arm is as long as the grab is far away.
const BALL_ARROW_W       = 4;     // shaft width, CSS px  ← the 4 px "Arrow width" setting
const BALL_ARROW_GAP     = 8;     // clear space kept past the ball's edge, CSS px
const BALL_ARROW_MIN     = 14;    // shortest VISIBLE arrow, gap edge -> tip, CSS px
const BALL_ARROW_HEAD_L  = 12;    // head length along the shaft, CSS px
const BALL_ARROW_HEAD_HW = 6.5;   // head half-width, CSS px
const BALL_ARROW_COLOR   = '#ffffff';   // the plain arrow colour
let arrowW = BALL_ARROW_W;        // live shaft width (the header "Arrow width" slider edits this)

// The arrow is the ball's shot direction, so its colour names the side that sent it: aimed up at the
// top pair (A, B) it wears the bottom pair's colour, aimed down at C, D it wears the top pair's —
// the ball comes from that side's opponent. It reads the direction as it is DRAWN (pixel space, the
// same vector arrowGeom() uses), so the colour can never disagree with the arrow you see; within a
// pixel of level it is aimed at nobody and keeps the plain colour. Read at draw time, so turning the
// arrow recolours it.
function arrowColor(){
  const g = arrowGeom(), dy = g.uy*g.len;          // the arrow's whole drawn rise, CSS px
  if (Math.abs(dy) < 1) return BALL_ARROW_COLOR;
  return dy < 0 ? COL.B : COL.A;                 // up -> sent by the bottom pair, down -> by the top pair
}

// The arrow as it is drawn, all in CSS px: ball centre, unit direction (ux, uy), the gap it hides
// behind, and the tail / tip / head it ends up with. Never shorter than BALL_ARROW_MIN past the gap.
// The direction comes from ball.rot and the length from ball.vel at VEL_PER_M, so the shaft is a
// physical reading of the ball's speed; only the pixel minimum below is a drawing convenience.
function arrowGeom(){
  const c = toPx(ball), gap = ballR() + BALL_ARROW_GAP;
  const t = toPx(arrowTipWorld());
  let dx = t.x - c.x, dy = t.y - c.y, d = Math.hypot(dx, dy);
  if (d < 1e-6){ dx = 1; dy = 0; d = 1; }                   // degenerate: aim along +x
  const len  = Math.max(d, gap + BALL_ARROW_MIN);            // minimal length, from the ball's centre
  const ux = dx/d, uy = dy/d;
  const head = Math.min(Math.max(BALL_ARROW_HEAD_L, arrowW*1.6), (len - gap)*0.55);   // grows with width,
  return {c, gap, ux, uy, len, head,                        // never longer than the visible arrow
          hw: Math.max(arrowW*0.85, BALL_ARROW_HEAD_HW*(head/BALL_ARROW_HEAD_L)),
          tail: {x: c.x + ux*gap, y: c.y + uy*gap},
          tip:  {x: c.x + ux*len, y: c.y + uy*len}};
}

// The dashed continuation wears the arrow's own colour, lightened halfway to white: at 0.6 opacity
// the plain team colour reads too dim over the court, and a lightened version keeps the team's hue
// while staying visible all the way to the screen edge.
function brighten(hex){
  const n = parseInt(hex.slice(1), 16), mix = v => Math.round(v + (255 - v)*0.5);
  return 'rgb(' + mix((n >> 16) & 255) + ',' + mix((n >> 8) & 255) + ',' + mix(n & 255) + ')';
}

// How far a pixel-space ray from (x, y) along (ux, uy) runs before it leaves the canvas: the dashed
// extension of the arrow stops exactly at the edge of the screen, wherever it is aimed.
function edgeReach(x, y, ux, uy){
  let t = Infinity;
  if (ux >  1e-9) t = Math.min(t, (cw - x)/ux);
  if (ux < -1e-9) t = Math.min(t, (0  - x)/ux);
  if (uy >  1e-9) t = Math.min(t, (ch - y)/uy);
  if (uy < -1e-9) t = Math.min(t, (0  - y)/uy);
  return t;
}

// shaft + filled head, in pixel space above the court. The tail cap is flat ("butt"), so the gap
// really is empty: the arrow begins exactly gap px past the ball's edge and never covers the ball.
// Its length is the ball's speed (see VEL_PER_M), so it grows with the shot and shrinks with it.
// Past the tip the same direction carries on as a thin dashed line at 0.6 — the opacity the example
// gives its dashed trajectory — in the arrow's own colour (lightened, see brighten), right to the edge
// of the screen, so the shot line reads across the whole court without competing with the arrow itself.
// That dashed run is also the aiming handle: it is long, so grabbing it far from the ball gives a long
// lever arm (see rotateArrow).
// The flight itself, drawn first among the ball-mode elements (see draw): the marks and the players are
// laid on top of it, never the other way round. draw() is what decides whether there is a ball mode at
// all, so this needs no guard of its own.
function drawBallFlight(){
  const g = arrowGeom(), col = arrowColor();
  // The dashed run is the flight itself, drawn whole: it never stops at a player's reach, because the
  // trajectory is what the arrow means and a line that ends mid-court reads as the arrow being cut
  // short. It runs from the tip all the way to the edge of the screen, wherever the arrow is aimed —
  // except across the HWS, which is drawn solid instead (below), so the two never overlap and double
  // their alpha.
  const run = edgeReach(g.tip.x, g.tip.y, g.ux, g.uy);   // tip -> screen edge, along the arrow
  const h = ballHitter();
  const hws = h && h.win && Number.isFinite(h.win.s2) && h.win.s2 > h.win.s1 ? h.win : null;
  const w0 = hws ? hws.s1*s : Infinity;                  // HWS near BCRP-E, px from the ball's centre
  const w1 = hws ? hws.s2*s : -Infinity;                 // ... and its far BCRP-E
  // Dashes up to the window, then from its far end to the edge; with no window the run is one piece.
  const dashedRuns = [[g.len, Math.min(g.len + run, w0)], [Math.max(g.len, w1), g.len + run]];
  if (run > 0.5){
    ctx.save();
    ctx.globalAlpha = 0.6;                          // the opacity of the example's dashed trajectory
    ctx.strokeStyle = brighten(col);                // same hue, half way to white: readable at 0.6
    ctx.lineWidth = DASH_W; ctx.lineCap = 'butt';   // exactly the MBCR curve's stroke, in CSS px
    ctx.setLineDash([DASH_ON, DASH_OFF]);
    for (const [a, b] of dashedRuns)
      if (b - a > 0.5) line(g.c.x + g.ux*a, g.c.y + g.uy*a, g.c.x + g.ux*b, g.c.y + g.uy*b);
    ctx.restore();
  }
  // HWS: the hitting window is the segment of the BTL between the two BCRP-Es — the part of the flight
  // the hitter can actually meet. It is the same line as the dashed run above, so it uses exactly that
  // stroke and colour and only drops the dashes: solid says "inside his window", dashed is the rest of
  // the flight. No window at all (the path never enters his reach) means no solid stretch.
  if (hws){
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = brighten(col);
    ctx.lineWidth = DASH_W; ctx.lineCap = 'butt';
    ctx.setLineDash([]);                            // solid: the window, not the flight
    line(g.c.x + g.ux*w0, g.c.y + g.uy*w0, g.c.x + g.ux*w1, g.c.y + g.uy*w1);
    ctx.restore();
  }
}

// The arrow itself — shaft, filled head and the speed readout — drawn in pixels above everything else
// the ball mode puts on the court, and then the ball on top of it. They are one function because they
// are one thing: the arrow is this ball's shot, its length and its readout are this ball's speed, so an
// arrow without its ball would be a nonsense. draw() therefore does not call this at all unless there
// is a ball on court (see draw), and there is no way to reach the arrow alone.
function drawBallMode(){
  const g = arrowGeom(), col = arrowColor();
  const bx = g.tip.x - g.ux*g.head, by = g.tip.y - g.uy*g.head;   // centre of the head's base
  const nx = -g.uy, ny = g.ux;                                    // across the shaft
  ctx.save();
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = arrowW; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
  line(g.tail.x, g.tail.y, bx, by);
  ctx.beginPath();
  ctx.moveTo(g.tip.x, g.tip.y);
  ctx.lineTo(bx + nx*g.hw, by + ny*g.hw);
  ctx.lineTo(bx - nx*g.hw, by - ny*g.hw);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // the speed readout, by the arrow's end. The context is turned to the arrow's own angle, so the
  // text's baseline runs along the trajectory and the number is read in the direction the ball is
  // sent; it sits just off the head's flank, clear of the dashed run. Plain white, like the court
  // markings — the arrow's own colour already says which team sends the ball.
  ctx.save();
  ctx.translate(g.tip.x, g.tip.y);
  ctx.rotate(Math.atan2(g.uy, g.ux));
  ctx.font = '700 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  const label = Math.round(ball.vel) + ' km/h';
  ctx.fillText(label, 6, -(g.hw + 9));               // across the shaft, on the arrow's left flank
  ctx.restore();

  // the ball last, so it covers the arrow's tail rather than the other way round. The felt turns with
  // the arrow: the seam pattern is spun about the view axis by the arrow's own rotation, so swinging the
  // arrow turns its face at 1:1 — the ball is never showing the same face twice. ball.quat stays the
  // ball's rest orientation (the arrow edits nothing else), and because the light is fixed in the same
  // frame, only the pattern turns while the highlight stays where the light puts it.
  const c = toPx(ball);
  drawTennisBall(ctx, c.x, c.y, ballR(), {quat: ball.quat, spin: ball.rot});
}

// drag the ARROW: it only changes the ball's speed — the direction belongs to the dashed extension
// (see rotateArrow). The pointer's distance from the ball's centre is read against the speed it had
// when the drag started, so grabbing the shaft anywhere never makes the head jump on the first move.
function stretchArrow(px, py, vel0, dist0){
  const c = toPx(ball), d = Math.hypot(px - c.x, py - c.y)/s;   // metres from the ball's centre
  ball.vel = clampVel(vel0 + (d - dist0)*VEL_PER_M);
}

// drag the DASHED EXTENSION: the arrow is aimed at the pointer and keeps its speed, so only the
// rotation changes. The rotation radius is how far from the ball the drag started — grabbing the
// dashed line far out gives a long lever arm, which is what makes fine aiming possible.
function rotateArrow(px, py){
  const c = toPx(ball), dx = px - c.x, dy = py - c.y;
  if (Math.hypot(dx, dy) < 1e-6) return;
  ball.rot = normRot(Math.atan2(dy, dx)/DEG);
}

// drag the S-BCP: the contact dot only ever slides along the HWS — the stretch of the flight he can meet —
// so the pointer is projected onto the BTL and clamped between the two BCRP-Es, and the direction from his
// centre to that BPCP becomes his US-BCRLE. That is the whole mechanism: the dot moves along the line it
// must stay on, the axis follows the dot, and nothing else is solved here — bcRl reads the angle back and
// puts the dot exactly where that axis crosses the flight, so the two can never disagree.
function aimBcp(px, py){
  const h = ball.on ? ballHitter() : null;
  if (!h || !h.bcrl || !h.bcrl.ball) return;               // no contact, no dot to drag
  const span = hwsSpan(h.p, h.curve), ray = h.curve.ray;
  if (!span) return;
  const w = toWorld(px, py);
  const sp = (w.x - ray.x)*ray.ux + (w.y - ray.y)*ray.uy;  // the pointer's own place on the BTL
  const sc = Math.max(span.lo, Math.min(span.hi, sp));     // ... clamped into the HWS
  const q = {x: ray.x + ray.ux*sc, y: ray.y + ray.uy*sc};
  const dx = q.x - h.p.x, dy = q.y - h.p.y;
  if (Math.hypot(dx, dy) < 1e-6) return;                   // the dot sits on his head: no axis to name
  h.p.bcrleDir = normRot(Math.atan2(dy, dx)/DEG);
}


function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

function drawCourt(){
  ctx.fillStyle = '#2f8a4e'; ctx.fillRect(VB.x0,VB.y0,VB.x1-VB.x0,VB.y1-VB.y0);
  ctx.fillStyle = '#2e6fd0'; ctx.fillRect(-CW/2,-CL/2,CW,CL);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(0.06, 1.5/s); ctx.lineCap = 'butt';
  ctx.strokeRect(-CW/2,-CL/2,CW,CL);
  line(-SINGLES/2,-CL/2,-SINGLES/2,CL/2); line(SINGLES/2,-CL/2,SINGLES/2,CL/2);
  line(-SINGLES/2,-SERVICE,SINGLES/2,-SERVICE); line(-SINGLES/2,SERVICE,SINGLES/2,SERVICE);
  line(0,-SERVICE,0,SERVICE);
  line(0,-CL/2,0,-CL/2+0.1); line(0,CL/2,0,CL/2-0.1);
}

function drawNet(){
  ctx.strokeStyle = '#f2f4f7'; ctx.lineWidth = Math.max(0.1, 2.5/s);
  line(-POST,0,POST,0);
  ctx.fillStyle = '#f2f4f7';
  for (const x of [-POST, POST]){ ctx.beginPath(); ctx.arc(x,0,0.16,0,7); ctx.fill(); }
}

// A beam is only ever lit by the attacker who is hitting, and that attacker's head-dot distance to a
// defender sizes that defender's reach here — the very same distance the reach line and end dots use
// (see defenderSource), so the shadow and the line can never disagree. In ball mode there is still one
// hitter and two beams, but his source is the end of the reach line drawn for him (ballHitter's hit:
// the level BPCP, an BCRP-E, or the tip of an S-BCRL-U) — the same point the contact dot marks — so the
// light always leaves from where the line says he meets the ball.
function drawBeams(){
  const T = 400;
  ctx.save();
  ctx.beginPath(); ctx.rect(VB.x0,VB.y0,VB.x1-VB.x0,VB.y1-VB.y0); ctx.clip();
  const atk = attackTeam();
  const defenders = players.filter(q => q.team !== atk);
  // A beam is cast from the attacking player, so the half it is cast from is his own court: there he is in
  // nobody's way and the shade only follows his own stroke, so it is four times lighter. Past the net it
  // falls on the defender's ground, where it is the reach it takes away, and keeps its full weight. Every
  // polygon is therefore filled twice, once inside each half, clipped at the MCL — one number, one rule, and
  // the step in weight lands exactly on the net.
  const atkUp = atk === 'A';                       // A stands in the upper half (y < 0), B in the lower
  const ownRect = atkUp ? [VB.x0, VB.y0, VB.x1-VB.x0, -VB.y0] : [VB.x0, 0, VB.x1-VB.x0, VB.y1];
  const oppRect = atkUp ? [VB.x0, 0, VB.x1-VB.x0, VB.y1] : [VB.x0, VB.y0, VB.x1-VB.x0, -VB.y0];
  const OWN_LIGHT = 0.25;                          // a quarter: the beam on his own side
  const beam = (pts, alpha) => {
    for (const [r, a] of [[ownRect, alpha*OWN_LIGHT], [oppRect, alpha]]){
      ctx.save();
      ctx.beginPath(); ctx.rect(r[0], r[1], r[2], r[3]); ctx.clip();
      ctx.globalAlpha = a; ctx.fillStyle = SHADOW_COL;
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  };
  // one beam per defender: source to that defender's reach zone, then the shadow behind him
  const cast = (S, q) => {
    // net mode: one dark beam only; otherwise the wide (lighter) zone, then the fast ball (darker)
    // one, cut from it by the margin. Both go through the same defenderReach/fastReach the reach
    // line uses, so the line ends and the shadow edge beams can never drift apart.
    const zones = inNetMode(q) ? [[defenderReach(q), 0.3]]
                               : [[defenderReach(q), 0.15], [fastReach(q), 0.3]];
    for (const [rq, alpha] of zones){
      const A = {x: q.x - rq, y: q.y}, B = {x: q.x + rq, y: q.y};
      const dA = {x: A.x-S.x, y: A.y-S.y}, dB = {x: B.x-S.x, y: B.y-S.y};
      if (Math.hypot(dA.x,dA.y) < 1e-6 || Math.hypot(dB.x,dB.y) < 1e-6) continue;
      // lit part: source to defender
      beam([S, A, B], 0.22);
      // shadow behind defender
      beam([A, B, {x: B.x+dB.x*T, y: B.y+dB.y*T}, {x: A.x+dA.x*T, y: A.y+dA.y*T}], alpha);
    }
  };
  if (ball.on){
    const h = ballHitter();
    if (h) for (const q of defenders) cast(h.hit, q);   // one source, exactly two beams
  } else {
    for (const p of players.filter(q => q.team === atk)){
      for (const sx of [-1, 1]){
        if (!(sx < 0 ? p.l : p.r)) continue;
        const S = {x: p.x + sx*STATIC_REACH, y: p.y};
        for (const q of defenders) cast(S, q);
      }
    }
  }
  ctx.restore();
}

function drawPlayers(){
  // Two passes: every reach mark first, every head after. The marks are where the ball can be met —
  // crossing dots, reach lines, the MPRC curve, the partner’s NAPRZ — so they belong to the court, not to
  // the player; the head is drawn last, over them and over the flight (see draw).
  for (const p of players) drawPlayerMarks(p);
  for (const p of players) drawPlayerHead(p);
}

// One player’s marks: his SRCL (the static reach he keeps), his MPRC curve in ball mode, his partner’s
// NAPRZ, the one BCRL that reaches the flight with its BCRP-Es, his SRCPs — and last the contact dot, the
// point the whole plan converges on (see the end of the body). Everything here is in court metres.
function drawPlayerMarks(p){
  const atk = attackTeam(), hitter = ball.on ? ballHitter() : null;
  const ray = ball.on ? ballRay() : null;
  const teamCol = COL[p.team], att = p.team === atk, r = reachOf(p);
  // Red marks say one thing only: this flight cannot be returned (noContact — the S-BCRL-U case, where the
  // path never crosses the hitter's MPRC), and then the whole attacking pair wears it, hitter and partner
  // alike. Nothing else is red: a partner who is simply not the one hitting is not at fault, and a defender
  // never is — his line is a coverage zone (defenderReach), not a reach curve, so it keeps its team colour.
  const col = ball.on && att && noContact() ? UNREACH_COL : teamCol;
  ctx.strokeStyle = col; ctx.lineCap = 'round';
  ctx.lineWidth = LINE_W/s;
  // An attacker's reach line is his SRCL pair: centre -> SRCP-L and centre -> SRCP-R. In ball mode it —
  // and its SRCP — is still held inside the zone the defensive model gives him (arcReach), so when that
  // zone is narrower than his fixed wingspan the line shortens to it. Otherwise it is the full
  // STATIC_WINGSPAN/2. The MBCR reach the flight buys him is a separate thing and rides on top, as the
  // BCRL to the BCRP-E below; the two lines are drawn independently and may differ in length and angle.
  const arc = ball.on && att && ballInFront(p) ? arcReach(p) : 0;
  const half = arc ? Math.min(r, arc) : r;
  // The AHS (active hitting side) is the side he plans to meet this ball on: the side of his centre the
  // contact lies on (hitter.side). In ball mode only that SRCL and SRCP are drawn — the other side is a
  // reach he is not going to use. The partner has no AHS (the flight is not his to plan for), so he
  // carries his travel circle instead; outside ball mode the pair is drawn whole, as before.
  const ahs = !ball.on || !att ? null : (hitter && hitter.p === p ? hitter.side : 0);
  const srclSides = ahs === null ? [-half, half] : (ahs ? [ahs*half] : []);
  // a defender outside net mode: half-transparent line over the whole (wide, lighter-shadow) reach,
  // opaque over the fast ball (darker-shadow) reach, which is that same wide reach cut by the margin.
  // In net mode the reach is a single dark zone, so the line is drawn solid all the way. Every reach
  // here comes from reachOf/defenderReach/fastReach, i.e. from the attacker who is actually hitting
  // and from the identical numbers the shadow edges use.
  const twoZones = !att && !inNetMode(p);
  if (twoZones) ctx.globalAlpha = 0.5;
  if (ahs === null) line(p.x-half,p.y,p.x+half,p.y);   // SRCL-L and SRCL-R (or a defender's zone)
  else if (ahs){
    // Ball mode: the AHS SRCL only — the side he plans to meet this ball on — and in grey instead of team
    // colour: this side is a reach he keeps, not one he plays from, and the SRCP is no longer marked on it,
    // so the line has to say both things by itself. Opaque and butt-capped: it ends exactly at the SRCP, the
    // point he can reach a ball at, with nothing growing half a stroke width past it.
    const prev = ctx.strokeStyle, cap = ctx.lineCap;
    ctx.strokeStyle = SRCL_GREY; ctx.lineCap = 'butt';
    line(p.x,p.y,p.x+ahs*half,p.y);
    ctx.strokeStyle = prev; ctx.lineCap = cap;
  }
  ctx.globalAlpha = 1;
  if (twoZones){ const rn = fastReach(p); line(p.x-rn,p.y,p.x+rn,p.y); }

  // ball mode: only the man who actually meets the ball carries the MPRC — the reach the ball's own
  // flight time allows, swept like the example: uniformly in ANGLE about him, each ray's BPCP giving
  // r = Dp + STATIC_REACH (mprc). It starts at his own centre, runs out to his wingspan circle in the
  // direction of the ball and sweeps on continuously to the far BCRP-E where the ball's path finally leaves
  // that reach — or to the level BPCP when the ball is already out of reach by the time it is level with
  // him, so the curve always joins the BCRL tip; a player with the ball behind him has none. Dashed
  // team colour, like the example's curve. His partner is not meeting this ball, so a reach curve
  // would claim he could: he gets the ground he can cover instead (below).
  const fwd = ball.on && att && ballInFront(p);
  const curve = fwd && hitter && hitter.p === p ? hitter.curve : null;
  const bcrl = curve ? hitter.bcrl : null;

  if (curve && curve.pts.length > 1){
    ctx.save();
    ctx.setLineDash([DASH_ON/s, DASH_OFF/s]);
    ctx.lineWidth = DASH_W/s; ctx.lineCap = 'butt';   // butt caps: the dash itself is exactly DASH_ON
    // The sweep is the reach the flight buys him, but where it bulges across the MCL it names ground he may
    // not stand on, so that run is faded — the mirror of the partner's zone, which is clipped at the same
    // line. The curve is cut exactly at y = 0 (a point is inserted there), so every run is stroked in a
    // single alpha, and the dash phase is carried over the cut so the pattern does not restart.
    const cut = [curve.pts[0]];
    for (let i = 1; i < curve.pts.length; i++){
      const a = cut[cut.length-1], b = curve.pts[i];
      if (a.y*b.y < 0) cut.push({x: a.x + (b.x-a.x)*a.y/(a.y-b.y), y: 0});   // where it meets the net
      cut.push(b);
    }
    const runs = [[cut[0]]];
    for (let i = 1; i < cut.length; i++){
      const run = runs[runs.length-1];
      if (cut[i].y === 0 && run[run.length-1].y !== 0){ run.push(cut[i]); runs.push([cut[i]]); }
      else run.push(cut[i]);
    }
    const period = (DASH_ON + DASH_OFF)/s;
    let phase = 0;
    for (const run of runs){
      const q = run.find(pt => pt.y !== 0);          // any sample off the net: which half is this run on
      ctx.globalAlpha = q && p.y*q.y < 0 ? 0.3 : 1;
      ctx.lineDashOffset = -(phase % period);        // the dashes keep their rhythm across the cut
      ctx.beginPath();
      ctx.moveTo(run[0].x, run[0].y);
      for (let i = 1; i < run.length; i++) ctx.lineTo(run[i].x, run[i].y);
      ctx.stroke();
      for (let i = 1; i < run.length; i++) phase += Math.hypot(run[i].x-run[i-1].x, run[i].y-run[i-1].y);
    }
    ctx.restore();
  }

  // ball mode, the partner: his NAPRZ (non-attacking player reaching zone) is the MRA circle — the ground
  // he can travel before his partner meets the ball, travelBy at the contact's BPCP, the same Dp = Vp*t the
  // hitter's own BCRL adds to his wingspan, with no wingspan of its own: it says where he can get to, not
  // what he can reach once he is there. It carries no outline at all: it is a claim on ground, not a line to
  // a point, so the court under the circle is shaded instead (NAPRZ_ALPHA). It is cut at the MCL too: the
  // circle meets the net as a chord, not as a half, so the part beyond it is clipped away — that ground is
  // court he may not stand in and must not be claimed. The shade turns reddish exactly when the pair is red
  // (noContact): then there is no contact left for him to cover.
  if (fwd && hitter && hitter.p !== p){
    const R = travelBy(hitter.hit.dball);            // metres, Vp * (dball / Vball)
    if (R > 1e-6){
      ctx.save();
      ctx.beginPath();                               // his own half of the world, up to the MCL
      if (p.team === 'A') ctx.rect(VB.x0, VB.y0, VB.x1-VB.x0, -VB.y0);
      else                ctx.rect(VB.x0, 0,     VB.x1-VB.x0,  VB.y1);
      ctx.clip();
      ctx.beginPath();
      ctx.arc(p.x, p.y, R, 0, 2*Math.PI);
      ctx.fillStyle = noContact() ? NAPRZ_SHADE_RED : NAPRZ_SHADE;
      ctx.fill();
      ctx.restore();
    }
  }

  // ball mode: the one visible BCRL pair (see bcRl). The S-BCRLE beyond the BCRL is faded — it only marks
  // the reach the flight buys him, out to the MPRC — while the S-BCRL, the part that really reaches the
  // ball, is opaque; the two coincide when the line ends on the BTL itself (BCRL-E). Every BCRP-E is
  // dotted, the one the S-BCRL ends on solid and the other faded, so the eye can tell which crossing he
  // can actually meet. An S-BCRL-U ends on the MPRC instead and keeps the faded dot: a place he could
  // stretch to, not one the ball goes through.
  if (bcrl){
    const dot = (q, a) => {
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(q.x, q.y, 4/s, 0, 7);
      ctx.fillStyle = col; ctx.fill();
      ctx.lineWidth = 2/s; ctx.strokeStyle = '#fff'; ctx.stroke();
      ctx.lineWidth = LINE_W/s;
    };
    ctx.save();
    ctx.lineWidth = LINE_W/s; ctx.lineCap = 'round';
    // Neither line can cross the MCL: the ball may cross the net, the player may not, so an S-BCRL-U is cut
    // there (bcRl) and the level BPCP lies on his own side by construction. The 0.4 fade the reaches used to
    // need past the net went with the crossing.
    ctx.globalAlpha = 0.5;
    if (!bcrl.edge) line(p.x, p.y, bcrl.tip.x, bcrl.tip.y);       // S-BCRLE beyond the BCRL: reach, not contact
    if (bcrl.ball){
      ctx.globalAlpha = 1;                                       // S-BCRL: it does reach the ball, so opaque
      line(p.x, p.y, bcrl.ball.x, bcrl.ball.y);
    }
    for (const s2 of bcrl.edges){
      const q = {x: curve.ray.x + curve.ray.ux*s2, y: curve.ray.y + curve.ray.uy*s2};
      dot(q, bcrl.edge !== null && Math.abs(s2 - bcrl.edge) < 1e-9 ? 1 : 0.5);
    }
    if (!bcrl.edges.length) dot(bcrl.tip, 0.5);      // S-BCRL-U: the stretch tip, faded
    ctx.restore();
  }

  // The SRCPs come first and the contact dot last. Each SRCP is the point on its own SRCL he can reach a
  // ball at, so the line is drawn before its mark; and the contact dot (S-BCP) closes the pass because it
  // is the point the whole plan converges on — nothing is laid over it. The head still comes later
  // (drawPlayerHead) and does overlap these marks at ordinary zoom — the reach is about a metre, the head's
  // circle a little wider — which is why the idle SRCP dots are rimmed white: what shows past the head still
  // reads as a marked point.
  for (const sx of srclSides){
    if (ahs !== null){
      // Ball mode: no dot and no mark. The SRCL above already ends at this point and is grey there, so the
      // SRCP is read off the end of the line itself: anything drawn on top of it would only hide the end it
      // marks. The AHS keeps exactly one visible tip, and that tip is the SRCP.
      continue;
    }
    const on = att && (sx < 0 ? p.l : p.r);   // a side he is emitting from: idle mode only
    ctx.beginPath(); ctx.arc(p.x+sx,p.y,(att ? 7 : 4)/s,0,7);
    ctx.fillStyle = on ? col : '#1b2430'; ctx.fill();
    ctx.lineWidth = 2/s; ctx.strokeStyle = att ? '#fff' : col; ctx.stroke();   // every SRCP is rimmed white
  }
  // Ball mode: the contact point — the end of the reach line drawn above, where it meets the ball — as the
  // same small dot as the reach-line ends but filled with the team colour and rimmed in white. The beams
  // start exactly here (see drawBeams), and the dot is also a handle: dragging it (or the line it sits on)
  // slides the contact along the HWS and re-aims the S-BCRLE, which is how a US-BCRLE is made (aimBcp). An
  // S-BCRL-U reaches no ball, so it carries no contact dot: its own tip keeps the faded one, and the beams
  // start from that tip all the same.
  if (hitter && hitter.p === p && hitter.hit.reached){
    ctx.beginPath(); ctx.arc(hitter.hit.x, hitter.hit.y, 4/s, 0, 7);
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 2/s; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
}

// One player’s head: the rim (red when the ball’s path misses his reach in ball mode), the dot in his
// team colour and his letter. Drawn after every mark, so the players read as standing on the court.
function drawPlayerHead(p){
  const att = p.team === attackTeam(), teamCol = COL[p.team];
  // the very red the marks use, and under the very same rule: the whole pair, only when nothing can be met
  const red = ball.on && att && noContact();
  // The rim — an attacker's white halo, a defender's team ring — turns red only then; the head's own
  // background keeps the team colour.
  if (att){
    ctx.beginPath(); ctx.arc(p.x,p.y,(HEAD_PX+2)/s,0,7);
    ctx.fillStyle = red ? UNREACH_COL : '#fff'; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(p.x,p.y,HEAD_PX/s,0,7);
  ctx.fillStyle = att ? teamCol : '#1b2430'; ctx.fill();
  if (!att){ ctx.strokeStyle = teamCol; ctx.lineWidth = 3/s; ctx.stroke(); }
  // player letter (A-D) centred in the dot: bold while he is attacking, regular while defending;
  // dark on a team-coloured attacker, white on a dark defender
  ctx.fillStyle = att ? '#1b2430' : '#fff';
  ctx.font = (att ? '700 ' : '400 ') + (13/s) + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.letter, p.x, p.y + 0.5/s);
}
// Temporary overlay drawn only while a player's DOT is held and the DELTA MARKER setting is on (deltaOn).
// Three named parts:
//   GUIDE LINE — vertical dashed line at the held dot's x. Starts DOT_GAP clear of the held dot
//                and ends DOT_GAP clear of the nearest opposing dot (nearest measured
//                perpendicular to the line, i.e. smallest |Δx|).
//   ARROW      — short arrow perpendicular to the GUIDE LINE. Its tail sits ARROW_GAP clear of
//                the line (near the far end) and its tip points at the target opponent's side.
//   DELTA (Δ)  — horizontal displacement between the held player and that opponent, one decimal,
//                printed beside the ARROW. It always shows; only the ARROW is hidden at 0.0 m.
function drawDragGuide(){
  if (!deltaOn || !drag || drag.part !== DOT) return;
  const p = drag.p, x = p.x;                           // GUIDE LINE sits at this x
  let opp = null;
  for (const q of players)
    if (q.team !== p.team && (!opp || Math.abs(q.x - x) < Math.abs(opp.x - x))) opp = q;
  if (!opp) return;
  const off = HEAD_PX/s + DOT_GAP/s;                   // dot radius + margin, used at both ends
  const dy = opp.y - p.y, dir = dy < 0 ? -1 : 1;       // from the held dot toward the opponent
  if (Math.abs(dy) <= 2*off) return;                   // no room for the line between the two gaps
  const y0 = p.y + dir*off, y1 = opp.y - dir*off;      // GUIDE LINE spans y0 -> y1 at x
  const delta = Math.abs(opp.x - x);                   // DELTA: horizontal displacement (m)
  const sgn = opp.x < x ? -1 : 1;                      // ARROW points this way along x
  ctx.save();
  ctx.globalAlpha = 0.5; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
  ctx.lineWidth = Math.max(0.06, 1.5/s); ctx.lineCap = 'butt';
  ctx.setLineDash([9/s, 7/s]);
  line(x, y0, x, y1);                                  // GUIDE LINE
  const ax0 = x + sgn*ARROW_GAP/s;                     // ARROW tail, clear of the GUIDE LINE
  const ax1 = ax0 + sgn*ARROW_LEN/s;                   // ARROW tip
  if (delta >= 0.05){                                  // ARROW alone is hidden at 0.0 m, DELTA stays
    ctx.setLineDash([]);
    const hl = ARROW_HEAD_L/s, hw = ARROW_HEAD_HW/s;
    line(ax0, y1, ax1 - sgn*hl, y1);                   // shaft stops at the head base
    ctx.beginPath();                                   // sharp CAD-style head
    ctx.moveTo(ax1, y1);
    ctx.lineTo(ax1 - sgn*hl, y1 - hw);
    ctx.lineTo(ax1 - sgn*hl, y1 + hw);
    ctx.closePath(); ctx.fill();
  }
  // DELTA readout, always shown: past the ARROW tip, or past its tail when the ARROW is hidden
  const label = '\u0394' + delta.toFixed(1) + ' m';
  ctx.font = '700 ' + (12/s) + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textBaseline = 'middle';
  const lw = ctx.measureText(label).width;
  let tx = (delta >= 0.05 ? ax1 : ax0) + sgn*5/s, align = sgn > 0 ? 'left' : 'right';
  if (sgn > 0 ? tx + lw > VB.x1 - 4/s : tx - lw < VB.x0 + 4/s){
    align = sgn > 0 ? 'right' : 'left'; tx = x - sgn*5/s;
  }
  ctx.textAlign = align; ctx.fillText(label, tx, y1);
  ctx.restore();                                       // restores alpha, colour and dash pattern
}

function draw(){
  hitterFrame++;                                        // one ballHitter sweep per frame (see the memo)
  pruneDir();                                          // ... and no US-BCRLE a non-attacker may not keep
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);
  ctx.translate(ox,oy); ctx.scale(s,s);
  drawCourt(); drawBeams(); drawNet();
  // Ball mode, in two passes and both of them gated on ball.on: the flight first, as the backdrop of
  // everything it carries (the BTL and its solid HWS sit under the dots, the reach lines and the
  // players), then — on top of them all — the ball with its arrow (see drawBallMode). No ball, no
  // ball-mode drawing at all.
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (ball.on) drawBallFlight();
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.translate(ox,oy); ctx.scale(s,s);   // metres: marks, players
  drawPlayers(); drawDragGuide();
  ctx.setTransform(dpr,0,0,dpr,0,0);   // pixels again: the ball keeps a readable size and sits on top
  if (ball.on) drawBallMode();
}

// ---- interaction (mouse + touch via pointer events)
let drag = null;
// distance from a point to a segment, so the arrow can be grabbed anywhere along its drawn length
function segDist(px, py, ax, ay, bx, by){
  const vx = bx - ax, vy = by - ay, L = vx*vx + vy*vy;
  const t = L > 1e-6 ? Math.max(0, Math.min(1, ((px-ax)*vx + (py-ay)*vy)/L)) : 0;
  return Math.hypot(px - (ax + vx*t), py - (ay + vy*t));
}
function pick(px,py){
  let extHit = null;              // the dashed run is picked last: it crosses the whole screen, so the
                                  // ball, its arrow and the players all get first claim on a grab
  // the ball is drawn above everything, so it also wins the pick; a generous pad keeps it grabbable
  if (ball.on){
    const c = toPx(ball);
    if (Math.hypot(px - c.x, py - c.y) <= ballR() + 6) return {p: ball, part: BALL};
    // then the arrow (drawn above the players, and only where it is actually visible): grab its
    // shaft or its head, never the empty gap behind them. This handle changes the speed only.
    const g = arrowGeom();
    if (segDist(px, py, g.tail.x, g.tail.y, g.tip.x, g.tip.y) <= Math.max(PAD_LINE, arrowW/2 + 5))
      return {p: ball, part: VEC};
    // then the dashed continuation past the tip: a wide, easy handle for aiming, since it runs to the
    // edge of the screen — the farther from the ball it is grabbed, the finer the rotation it gives
    const run = edgeReach(g.tip.x, g.tip.y, g.ux, g.uy);
    if (run > 0.5 && segDist(px, py, g.tip.x, g.tip.y,
                             g.tip.x + g.ux*run, g.tip.y + g.uy*run) <= PAD_LINE)
      extHit = {p: ball, part: EXT};
    // then the S-BCP, the contact dot of the man who meets the ball: dragging it slides the contact along
    // the HWS, which re-aims his S-BCRLE (aimBcp). The dot is small, so the grab pad is generous — but his
    // head keeps its claim: within the head's own pad the head wins, and he is dragged instead.
    const h = ballHitter();
    if (h && h.hit.reached){
      const hc = toPx(h.hit), pc = toPx(h.p);
      if (Math.hypot(px - hc.x, py - hc.y) <= PAD_DOT && Math.hypot(px - pc.x, py - pc.y) > PAD_DOT)
        return {p: h.p, part: SBCP};
    }
    // ... and his reach line itself, as a band along its whole drawn length (the S-BCRLE part that only marks
    // reach included): grabbing the line is the same gesture as grabbing its dot, just as the dashed run past
    // the arrow's tip aims the ball. It starts at his centre, so the head keeps its claim there as well.
    if (h && h.bcrl && h.bcrl.ball){
      const a2 = toPx(h.p), b2 = toPx(h.bcrl.tip);
      if (Math.hypot(px - a2.x, py - a2.y) > PAD_DOT &&
          segDist(px, py, a2.x, a2.y, b2.x, b2.y) <= PAD_LINE)
        return {p: h.p, part: SBCRLE};
    }
  }
  let best = null, bd = 1e9;
  for (const p of players){
    const r = reachOf(p), fh = fhSide(p);
    const c = toPx(p), d = Math.hypot(px-c.x, py-c.y);
    const a = toPx({x:p.x-r,y:p.y}), b = toPx({x:p.x+r,y:p.y});
    const fhDot = fh < 0 ? a : b, bhDot = fh < 0 ? b : a;
    const att = p.team === attackTeam();
    // ball mode picks the side itself, so its end dots are placeholders: no FH/BH pick at all
    const canSide = att && !ball.on;
    const dFh = canSide ? Math.hypot(px-fhDot.x, py-fhDot.y) : 1e9;
    const dBh = canSide ? Math.hypot(px-bhDot.x, py-bhDot.y) : 1e9;
    const dSeg = Math.abs(py-c.y) <= PAD_LINE && px >= a.x-PAD_LINE && px <= b.x+PAD_LINE ? Math.abs(py-c.y) + PAD_LINE : 1e9;
    const cands = [[d <= PAD_DOT ? d : 1e9, DOT], [dFh <= PAD_DOT ? dFh : 1e9, FH], [dBh <= PAD_DOT ? dBh : 1e9, BH], [dSeg, SEG]];
    const [score, part] = cands.reduce((m, c2) => c2[0] < m[0] ? c2 : m);
    if (score < bd && score < 1e8){ bd = score; best = {p, part}; }
  }
  return best || extHit;
}
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), px = e.clientX-r.left, py = e.clientY-r.top;
  const hit = pick(px,py); if (!hit) return;
  const w = toWorld(px,py);
  drag = {p: hit.p, part: hit.part, dx: hit.p.x-w.x, dy: hit.p.y-w.y, sx: px, sy: py, moved: false};
  if (hit.part === VEC){          // stretching reads the pointer against where it was grabbed, so the
    const c = toPx(ball);         // head never jumps on the first move
    drag.vel0 = ball.vel; drag.dist0 = Math.hypot(px - c.x, py - c.y)/s;
  }
  cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); e.preventDefault();
  draw();            // show the DOT guide immediately, even before the first move
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const r = cv.getBoundingClientRect(), px = e.clientX-r.left, py = e.clientY-r.top;
  if (Math.hypot(px-drag.sx,py-drag.sy) > 6) drag.moved = true;
  if (drag.part === VEC){
    stretchArrow(px, py, drag.vel0, drag.dist0);   // the arrow only changes the speed, never the angle
  } else if (drag.part === EXT){
    rotateArrow(px, py);                           // the dashed run only swings it, never the speed
  } else if (drag.part === SBCP || drag.part === SBCRLE){
    aimBcp(px, py);                                // dot or line: the same aim, along the HWS (US-BCRLE)
  } else {
    const w = toWorld(px,py);
    const x = Math.max(VB.x0, Math.min(VB.x1, w.x+drag.dx));
    let y = Math.max(VB.y0, Math.min(VB.y1, w.y+drag.dy));
    // No player crosses the MCL (the net line, y = 0): his own half is the only place he may stand, and
    // keeping the head's radius clear of the line stops the dot straddling the net. The ball is not a
    // player, so it crosses freely.
    if (drag.p !== ball){
      const clear = HEAD_PX/s;
      y = drag.p.team === 'A' ? Math.min(y, -clear) : Math.max(y, clear);
    }
    drag.p.x = x; drag.p.y = y;    // the arrow is stored relative to the ball, so it rides along
  }
  draw();
  scheduleHash();                 // keep the URL in step while the player is being moved
});
function end(){
  if (!drag) return;
  if (!drag.moved && drag.part !== BALL && drag.part !== VEC && drag.part !== EXT){
    const p = drag.p;       // the ball, its speed handle and its aiming handle only ever drag: a tap
                            // on any of them does nothing
    if (!ball.on){                            // ball mode owns the roles and the hitting side itself
      if (p.team !== attackTeam()){
        if (drag.part === DOT) swapRoles();   // placeholder tap: the defender attacks (no beam lit)
      } else if (drag.part === FH || drag.part === BH){
        // beams are emitted ONLY from the forehand/backhand dots: one side of one player at a time
        const side = drag.part === FH ? fhSide(p) : -fhSide(p);   // -1 = screen-left, +1 = screen-right
        const on = side < 0 ? !p.l : !p.r;
        clearBeams();
        if (side < 0) p.l = on; else p.r = on;
      }
    }
    // DOT / SEG on an attacker: drag only, a tap here never emits
    status();
  }
  writeHash();               // a drop, or a tap that lights/clears a side, refreshes the URL
  drag = null; cv.classList.remove('drag'); draw();
}
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', end);

// ---- controls
function clearBeams(){ for (const q of players) q.l = q.r = false; }
// roles swap with all beams off: a beam is only ever lit by tapping a forehand/backhand dot
function swapRoles(){
  if (ball.on) return;       // ball mode derives both roles from the arrow
  attack = attack === 'A' ? 'B' : 'A';
  clearBeams();
}
function status(){
  const atk = attackTeam(), def = atk === 'A' ? 'B' : 'A';
  if (ball.on){
    const h = ballHitter();
    const who = h ? ' Player ' + h.p.letter + (h.clamped
                    ? ' cannot reach it — the path never comes inside his reach, so the plan is to stretch to the end of it.'
                    : ' meets it on the ' + (h.side < 0 ? 'left' : 'right') + ' side.')
                  : ' No attacker has the ball in front of him yet.';
    document.getElementById('status').textContent =
      'Ball mode: the arrow points at ' + NAME[atk].toLowerCase() + ', so it attacks (beams); ' +
      NAME[def].toLowerCase() + ' defends (shadows).' + who +
      ' Drag the ball to move it, the arrow to change the ball’s speed, and the dashed line past its ' +
      'tip to aim it — the farther out you grab, the finer the aim. Drag the contact dot along the ' +
      'hitting window to choose his reach line yourself.';
    return;
  }
  document.getElementById('status').textContent =
    NAME[atk] + ' attacks (beams), ' + NAME[def].toLowerCase() + ' defends (shadows). Tap an attacker’s forehand (FH) or backhand (BH) dot to emit from that side only (tap again to stop) — the lettered placeholder never emits; tap a defender’s placeholder to swap roles.';
}
// ---- reach sliders: REACH_SLIDERS owns the range, so the header needs no min/max/step/value and the
// readout is written from the live setting. The initial position follows rNet/rBase/rMargin, which means
// editing those constants is enough — and because the margin is stored as a fraction but shown as a whole
// percent, the slider's number is scaled on the way in and out.
function syncReachUI(){
  for (const sl of REACH_SLIDERS){
    const el = document.getElementById(sl.id), out = document.getElementById(sl.out);
    el.min = sl.min; el.max = sl.max; el.step = sl.step;
    el.value = sl.get() / sl.scale;                 // snapped to the step by the browser
    out.textContent = sl.fmt(+el.value);
    el.oninput = () => {                            // oninput (not addEventListener) keeps one handler
      sl.set((+el.value) * sl.scale);
      out.textContent = sl.fmt(+el.value);
      scheduleHash();                               // "dvr:" and friends travel with the link
      draw();
    };
  }
}
syncReachUI();
// ---- ball checkbox: show / hide the tennis ball; once shown it drags like a player does, and its
// arrow comes with it. The URL carries the ball, so toggling rewrites the fragment as well.
const ballOn = document.getElementById('ballOn');
ballOn.addEventListener('change', () => {
  if (!ballOn.checked && ball.on) attack = attackTeam();   // keep the roles the ball scene was showing
  ball.on = ballOn.checked;
  status();
  writeHash();                  // "b:" appears while the ball is shown, and goes when it is hidden
  draw();
});
// ---- delta marker checkbox: the drag guide (GUIDE LINE, ARROW, Δ readout) is a measuring aid, so it is
// off by default; ticking it lets a held DOT show the displacement line and its metres. Display only —
// the drag itself, the URL and the scene are untouched — so a change just redraws.
const deltaOnEl = document.getElementById('deltaOn');
deltaOnEl.checked = deltaOn;                 // the box starts from the setting, never the other way round
deltaOnEl.addEventListener('change', () => { deltaOn = deltaOnEl.checked; writeHash(); draw(); });
// ---- ball size slider: writes ball.px, the ball's drawn radius in CSS px (BALL_PX is its default).
// Its initial position follows ball.px, so editing the constant in the code is enough. Touching the
// slider also shows the ball, so the size change is visible straight away.
const ballSize = document.getElementById('ballSize'), ballSizev = document.getElementById('ballSizev');
ballSize.value = ball.px;
ballSizev.textContent = ball.px + ' px';
ballSize.addEventListener('input', () => {
  ball.px = +ballSize.value;
  ballSizev.textContent = ball.px + ' px';
  if (!ball.on){ ball.on = true; ballOn.checked = true; status(); }
  scheduleHash();                 // "bs:" travels with the link, and the game remembers it
  draw();
});
// ---- arrow width slider: writes arrowW, the shaft width in CSS px (BALL_ARROW_W is its default).
// Same rules as the size slider: it starts from the constant and shows the ball so you can see it.
const arrowWidth = document.getElementById('arrowW'), arrowWidthv = document.getElementById('arrowWv');
arrowWidth.value = arrowW;
arrowWidthv.textContent = arrowW + ' px';
arrowWidth.addEventListener('input', () => {
  arrowW = +arrowWidth.value;
  arrowWidthv.textContent = arrowW + ' px';
  if (!ball.on){ ball.on = true; ballOn.checked = true; status(); }
  scheduleHash();                 // "aw:" travels with the link as well
  draw();
});
// a #p- link can show or hide the ball, so the header always mirrors the live ball state
function syncBallUI(){
  ballOn.checked = ball.on;
  ballSize.value = ball.px; ballSizev.textContent = ball.px + ' px';
  arrowWidth.value = arrowW; arrowWidthv.textContent = arrowW + ' px';
}
// every control mirrors the live settings at once: a link or a stored game can change the reach
// numbers, the ball and the delta marker together, so they are re-read together
function syncSettingsUI(){
  syncReachUI();
  syncBallUI();
  deltaOnEl.checked = deltaOn;
}
// ---- tabs: one header, three panes. Game holds the scene's line of help, My Games the saved list,
// Settings the controls. On narrow screens the pane stacks under the tabs from the top down; on wide
// screens a pane becomes a column down the left (see the media query) and the court takes the rest.
const bar = document.querySelector('header');
const TABS = ['game', 'games', 'settings'];
const tabBtn = t => document.getElementById('tabbtn-' + t);
function setTab(name, focus){
  const tab = TABS.includes(name) ? name : 'game';
  bar.dataset.tab = tab;
  for (const t of TABS){
    const on = t === tab, btn = tabBtn(t);
    btn.setAttribute('aria-selected', String(on));
    btn.tabIndex = on ? 0 : -1;          // one tab in the Tab order, as a tablist wants
    document.getElementById('tab-' + t).hidden = !on;
    if (on && focus) btn.focus();
  }
  resize();          // the court's rectangle depends on where the header now ends (see resize)
}
TABS.forEach((t, i) => {
  tabBtn(t).addEventListener('click', () => setTab(t));
  tabBtn(t).addEventListener('keydown', e => {
    const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!step) return;
    e.preventDefault();
    setTab(TABS[(i + step + TABS.length) % TABS.length], true);   // the arrows wrap around
  });
});
// The Game tab's head: the name of the game on court, and its help line behind a triangle. renderGames
// keeps the name current, so opening, creating, renaming and deleting a game all retitle the tab.
const gameNameEl = document.getElementById('gameName');
const helpBtn = document.getElementById('helpBtn'), statusEl = document.getElementById('status');
function syncGameName(){
  const g = activeGame();
  gameNameEl.textContent = g ? g.name : '';
  gameNameEl.title = g ? g.name : '';
}
function setHelp(open){
  helpBtn.setAttribute('aria-expanded', String(open));
  helpBtn.title = open ? 'Hide help' : 'Show help';
  statusEl.hidden = !open;
  resize();                       // the pane changed height, so the court's offset may have changed too
}
helpBtn.addEventListener('click', () => setHelp(helpBtn.getAttribute('aria-expanded') !== 'true'));

// ---- boot: the saved games first (the active one becomes the court and its settings), then a shared
// link, which openLink() treats exactly as a link pasted later in the tab: a scene of its own, never an
// order to overwrite what is saved. The only difference is the first visit, where there is nothing to
// protect and the game boot has just made is the one the link lands in.
const hadStore = initGames();
const link = fragmentText();
if (link) openLink(link, !hadStore);
setTab('game');     // Game is the tab the app opens on
status();           // the status line reflects whether the ball is shown
resize();
</script>
</body>
</html>
